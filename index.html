          const diffText = diff ? diff.symbol : (p.difficulty || '—');
          
          tbl.appendChild(el('div', {
            style: {
              display: 'grid',
              gridTemplateColumns: '40px 1fr 90px 70px',
              gap: '8px',
              padding: '8px 10px',
              fontSize: '12px',
              borderBottom: '1px solid rgba(0,0,0,0.04)',
              alignItems: 'center'
            }
          },
            el('div', { style: { fontWeight: 700 } }, p.no + '번'),
            el('div', null,
              el('div', { style: { lineHeight: '1.4' } }, unitText),
              p.summary ? el('div', { 
                style: { 
                  fontSize: '10.5px', 
                  color: 'var(--ink-3)', 
                  marginTop: '2px',
                  fontStyle: 'italic',
                  overflow: 'hidden',
                  textOverflow: 'ellipsis',
                  display: '-webkit-box',
                  WebkitLineClamp: 2,
                  WebkitBoxOrient: 'vertical'
                } 
              }, p.summary) : null
            ),
            el('div', { style: { fontSize: '11px' } }, typeText),
            el('div', { style: { color: 'var(--orange)', fontWeight: 700, letterSpacing: '0.5px' } }, diffText)
          ));
        });
        
        wrap.appendChild(tbl);
      } else {
        wrap.appendChild(el('div', { className: 'notice notice-warn' }, '문항 데이터가 없습니다'));
      }
      
      // 액션
      wrap.appendChild(el('div', { className: 'modal-actions' },
        el('button', { 
          className: 'btn btn-danger',
          onClick: () => confirmDialog(
            `${titleParts.join(' · ')} 시험지 데이터를 삭제하시겠습니까?`,
            async () => {
              delete state.testPapers[grade][pKey];
              await deletePdfFromDB(pdfKey(grade, round, version));
              saveState();
              closeModal();
              render();
              showToast('시험지 삭제 완료', 'success');
            }
          )
        }, '🗑 삭제'),
        el('button', { className: 'btn btn-orange', onClick: closeModal }, '닫기')
      ));
      
      return wrap;
    }
  });
}


// ============================================================
// Excel 문항 분류표 가져오기
// ============================================================

// 난이도 문자열 정규화 ("★★★☆☆", "★★★", "중" 등 → 표준 레벨)
function normalizeDifficulty(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  // 별 개수 세기
  const starCount = (s.match(/★/g) || []).length;
  if (starCount > 0) {
    const map = { 1: '최하', 2: '하', 3: '중', 4: '상', 5: '최상' };
    return map[starCount] || '';
  }
  // 한글 직접 매칭
  const known = ['최하', '하', '중', '상', '최상'];
  for (const k of known) {
    if (s.includes(k)) return k;
  }
  return '';
}

// 학년 문자열 정규화
function normalizeGrade(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (s.includes('중1') || s.includes('중학교 1')) return '중1';
  if (s.includes('중2') || s.includes('중학교 2')) return '중2';
  if (s.includes('중3') || s.includes('중학교 3')) return '중3';
  if (s.includes('고1') || s.includes('고등학교 1')) return '고1';
  if (s.includes('고2') || s.includes('고등학교 2')) return '고2';
  if (s.includes('고3') || s.includes('고등학교 3')) return '고3';
  return '';
}

// 컬럼명 → 표준 키 매핑
function detectColumnMap(headers) {
  const map = {};
  headers.forEach((h, idx) => {
    if (!h) return;
    const norm = String(h).trim().replace(/\s+/g, '');
    if (/^회차$|^차수$|^회$|^round$/i.test(norm)) map.round = idx;
    else if (/^번호$|^문항번호$|^No$/i.test(norm)) map.no = idx;
    else if (/문항요약|요약|내용/.test(norm)) map.summary = idx;
    else if (/^과정$|^학년$/.test(norm)) map.gradeCol = idx;
    else if (/^대단원$|^단원$/.test(norm)) map.unit = idx;
    else if (/^중단원$/.test(norm)) map.subUnit = idx;
    else if (/^소단원$/.test(norm)) map.soUnit = idx;
    else if (/일반유형|문제유형|^유형$/.test(norm)) map.type = idx;
    else if (/도형유형|기하유형/.test(norm)) map.geomType = idx;
    else if (/^난이도$/.test(norm)) map.difficulty = idx;
    else if (/사고단계|인지단계|Bloom|블룸/.test(norm)) map.cognitive = idx;
    else if (/^비고$|^메모$|^참고$/.test(norm)) map.memo = idx;
  });
  return map;
}

// 시트 데이터 → 문항 배열로 변환
function parseSheetToProblems(rows, colMap) {
  const problems = [];
  for (const row of rows) {
    const no = colMap.no != null ? parseInt(row[colMap.no]) : NaN;
    if (isNaN(no) || no < 1) continue;
    
    const p = {
      no: no,
      summary: colMap.summary != null ? (row[colMap.summary] || '') : '',
      book: '',
      unit: colMap.unit != null ? (row[colMap.unit] || '') : '',
      subUnit: colMap.subUnit != null ? (row[colMap.subUnit] || '') : '',
      soUnit: colMap.soUnit != null ? (row[colMap.soUnit] || '') : '',
      type: colMap.type != null ? (row[colMap.type] || '') : '',
      geomType: colMap.geomType != null ? (row[colMap.geomType] || '') : '',
      difficulty: normalizeDifficulty(colMap.difficulty != null ? row[colMap.difficulty] : ''),
      cognitive: colMap.cognitive != null ? (row[colMap.cognitive] || '') : '',
      memo: colMap.memo != null ? (row[colMap.memo] || '') : ''
    };
    // 빈 값(NaN, "—", 등) 정리
    Object.keys(p).forEach(k => {
      if (typeof p[k] === 'string') {
        p[k] = p[k].trim();
        if (p[k] === '—' || p[k] === '-' || p[k].toLowerCase() === 'nan') p[k] = '';
      } else if (p[k] == null || (typeof p[k] === 'number' && isNaN(p[k]))) {
        p[k] = k === 'no' ? p[k] : '';
      }
    });
    problems.push(p);
  }
  // 번호순 정렬
  problems.sort((a, b) => a.no - b.no);
  return problems;
}

// 시트명에서 버전 라벨 추출:  "중1-2 V1 (1~8회)" → "V1",  "고1-2 대수 (1~8회)" → "대수"
function detectVersionLabelFromSheet(sheetName) {
  let t = String(sheetName || '');
  t = t.replace(/\([^)]*\)/g, ' ');              // (1~8회) 제거
  t = t.replace(/[\d]+\s*~\s*[\d]+\s*회/g, ' '); // 1~8회 제거
  t = t.replace(/[중고]\s*\d\s*-?\s*\d?/g, ' '); // 중1-2 / 고1-2 제거
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

// 감지된 버전 라벨 → 설정된 버전 키 (없으면 null)
function resolveVersionKey(grade, label) {
  if (!label) return null;
  const m = String(label).match(/^V\s*(\d+)$/i);
  const keys = getVersionKeysForGrade(grade);
  if (m) {
    const k = 'v' + m[1];
    return keys.includes(k) ? k : null;
  }
  return versionKeyFromLabel(grade, label) || null;
}

// 회차 문자열 → 숫자 ("3회" → 3)
function parseRoundValue(v) {
  if (v == null) return null;
  const m = String(v).match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// Excel 파일에서 시트 정보 파싱 (회차 컬럼이 있으면 회차별로 분리)
async function parseExcelFile(file) {
  if (typeof XLSX === 'undefined') {
    throw new Error('Excel 라이브러리(XLSX)가 로드되지 않았습니다');
  }
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type: 'array' });

  const sheets = [];
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    if (rows.length < 2) continue;

    // 헤더 행 찾기 ('번호'가 포함된 행)
    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(8, rows.length); i++) {
      if (rows[i] && rows[i].some(c => String(c).trim() === '번호')) { headerRowIdx = i; break; }
    }
    if (headerRowIdx < 0) continue;

    const headers = rows[headerRowIdx];
    const colMap = detectColumnMap(headers);
    if (colMap.no == null) continue;

    const dataRows = rows.slice(headerRowIdx + 1);

    // 학년 감지 (과정 컬럼 → 시트명)
    let detectedGrade = '';
    if (colMap.gradeCol != null) {
      for (const r of dataRows) {
        const g = normalizeGrade(r[colMap.gradeCol]);
        if (g) { detectedGrade = g; break; }
      }
    }
    if (!detectedGrade) detectedGrade = normalizeGrade(sheetName);

    // 회차별 분리
    const blocks = [];
    if (colMap.round != null) {
      const byRound = {};
      dataRows.forEach(r => {
        const rn = parseRoundValue(r[colMap.round]);
        if (rn == null) return;
        (byRound[rn] = byRound[rn] || []).push(r);
      });
      Object.keys(byRound).map(Number).sort((a, b) => a - b).forEach(rn => {
        const problems = parseSheetToProblems(byRound[rn], colMap);
        if (problems.length) blocks.push({ round: rn, problems: problems });
      });
    } else {
      const problems = parseSheetToProblems(dataRows, colMap);
      if (problems.length) blocks.push({ round: null, problems: problems });
    }
    if (!blocks.length) continue;

    const versionLabel = detectVersionLabelFromSheet(sheetName);
    sheets.push({
      name: sheetName,
      grade: detectedGrade,
      versionLabel: versionLabel,
      hasRoundColumn: colMap.round != null,
      blocks: blocks,
      problemCount: blocks.reduce((a, b) => a + b.problems.length, 0),
      colMap: colMap
    });
  }

  return sheets;
}

async function openExcelImportModal(file) {
  let sheets;
  try {
    showToast('📥 Excel 파일 분석 중...', 'info');
    sheets = await parseExcelFile(file);
  } catch (err) {
    console.error(err);
    showToast('Excel 파일을 읽을 수 없습니다: ' + err.message, 'error');
    return;
  }

  if (!sheets || sheets.length === 0) {
    showToast('가져올 수 있는 시트가 없습니다. "번호" 컬럼이 포함된 시트를 확인하세요', 'error');
    return;
  }

  // 시트별 매핑 (학년 · 버전은 시트 단위, 회차는 파일에서 자동)
  const maps = sheets.map(sheet => {
    const grade = GRADES.includes(sheet.grade) ? sheet.grade : (ui.papersGrade || GRADES[0]);
    let key = resolveVersionKey(grade, sheet.versionLabel);
    if (!key && !sheet.versionLabel) key = getVersionKeysForGrade(grade)[0] || null;  // 버전 표기가 없는 시트 → V1
    return {
      sheet: sheet,
      grade: grade,
      versionKey: key,                       // null = 설정에 없는 새 버전
      newLabel: key ? '' : (sheet.versionLabel || ''),
      enabled: true,
      rounds: sheet.blocks.map(b => ({ round: b.round, use: true, count: b.problems.length }))
    };
  });

  const maxRound = Math.max(...maps.flatMap(m => m.rounds.map(r => r.round || 0)), 0);
  const unresolved = maps.filter(m => !m.versionKey && m.newLabel);

  openModal({
    title: '📥 Excel 문항 분류표 가져오기',
    size: 'lg',
    body: () => {
      const wrap = el('div');
      const totalBlocks = maps.reduce((a, m) => a + m.rounds.length, 0);
      const totalProblems = maps.reduce((a, m) => a + m.sheet.problemCount, 0);

      wrap.appendChild(el('div', { className: 'notice mb-12', style: { fontSize: '12px' } },
        el('strong', null, `✓ 시트 ${sheets.length}개 · 회차 ${totalBlocks}개 · 문항 ${totalProblems}개 인식`),
        el('br'),
        maps.some(m => m.sheet.hasRoundColumn)
          ? '「회차」 열을 읽어 한 시트 안의 여러 회차를 자동으로 나눴습니다. 학년·버전만 확인해 주세요.'
          : '회차 열이 없어 시트별로 회차를 직접 지정해야 합니다.'
      ));

      // 설정에 없는 버전 안내 + 자동 반영
      if (unresolved.length) {
        const byGrade = {};
        maps.forEach(m => {
          if (!m.newLabel) return;
          (byGrade[m.grade] = byGrade[m.grade] || []).push(m.newLabel);
        });
        wrap.appendChild(el('div', { className: 'notice notice-warn mb-12', style: { fontSize: '12px' } },
          el('strong', null, '⚠ 설정에 없는 시험지 버전이 있습니다: '),
          Object.keys(byGrade).map(g => g + ' → ' + byGrade[g].join(', ')).join('  |  '),
          el('br'),
          el('button', {
            className: 'btn btn-sm btn-orange', style: { marginTop: '8px' },
            onClick: () => {
              // 엑셀에서 감지된 구성대로 설정(버전 목록 · 회차 수) 갱신
              const detected = {};
              maps.forEach(m => {
                const label = m.newLabel || (getVersionLabelsForGrade(m.grade)[m.versionKey] || '');
                if (!label) return;
                detected[m.grade] = detected[m.grade] || [];
                if (!detected[m.grade].includes(label)) detected[m.grade].push(label);
              });
              Object.keys(detected).forEach(g => {
                const cur = (state.config.versions[g] || []).slice();
                const def = DEFAULT_VERSIONS[g] || [];
                const isUntouched = cur.length === def.length && cur.every((x, i) => x === def[i]);
                const namedOnly = detected[g].every(lb => !/^V\s*\d+$/i.test(lb));
                if (isUntouched && namedOnly) {
                  // 아직 기본값이고 엑셀에 실제 범위명이 있으면 그대로 교체 (예: 고1 → 공통수학2 / 대수)
                  state.config.versions[g] = detected[g].slice();
                } else {
                  detected[g].forEach(lb => { if (!cur.includes(lb)) cur.push(lb); });
                  state.config.versions[g] = cur;
                }
              });
              if (maxRound > ROUNDS) state.config.rounds = maxRound;
              applyConfig();
              saveState();
              closeModal();
              showToast('설정을 엑셀 구성에 맞게 업데이트했습니다. 다시 가져오기를 눌러주세요.', 'success');
              render();
            }
          }, '⚙ 엑셀 구성대로 설정 업데이트')
        ));
      }

      // 시트별 카드
      const list = el('div', { style: { maxHeight: '420px', overflowY: 'auto' } });
      maps.forEach(m => {
        const gradeSelect = el('select', { className: 'select', style: { width: '80px', padding: '4px 6px', fontSize: '12px' } },
          ...GRADES.map(g => el('option', { value: g, selected: g === m.grade }, g))
        );
        const versionSelect = el('select', { className: 'select', style: { width: '190px', padding: '4px 6px', fontSize: '12px' } });

        function paintVersions() {
          versionSelect.innerHTML = '';
          const labels = getVersionsForGrade(m.grade);
          getVersionKeysForGrade(m.grade).forEach((k, i) => {
            versionSelect.appendChild(el('option', { value: k, selected: m.versionKey === k }, `V${i + 1} · ${labels[i]}`));
          });
          if (!m.versionKey) {
            versionSelect.appendChild(el('option', { value: '', selected: true },
              m.newLabel ? `⚠ ${m.newLabel} (설정에 없음)` : '버전 선택'));
          }
        }
        paintVersions();
        versionSelect.addEventListener('change', e => { m.versionKey = e.target.value || null; });
        gradeSelect.addEventListener('change', e => {
          m.grade = e.target.value;
          m.versionKey = resolveVersionKey(m.grade, m.sheet.versionLabel);
          paintVersions();
        });

        const check = el('input', { type: 'checkbox', checked: m.enabled });
        check.addEventListener('change', e => { m.enabled = e.target.checked; });

        // 회차 칩
        const roundChips = el('div', { className: 'filter-chips', style: { marginTop: '10px' } });
        m.rounds.forEach((r, i) => {
          const chip = el('button', {
            className: 'chip active',
            onClick: () => {
              r.use = !r.use;
              chip.className = 'chip' + (r.use ? ' active' : '');
            }
          }, (r.round ? r.round + '회' : '회차 미지정') + ' · ' + r.count + '문항');
          if (!r.round) {
            // 회차 열이 없는 시트는 직접 지정
            const sel = el('select', { className: 'select', style: { width: '80px', padding: '4px 6px', fontSize: '12px', marginLeft: '6px' } },
              ...roundNumbers().map(n => el('option', { value: n, selected: n === (i + 1) }, n + '회'))
            );
            sel.addEventListener('change', e => { r.round = parseInt(e.target.value, 10); });
            r.round = i + 1;
            roundChips.appendChild(el('div', { className: 'flex gap-8', style: { alignItems: 'center' } }, chip, sel));
          } else {
            roundChips.appendChild(chip);
          }
        });

        list.appendChild(el('div', {
          style: { padding: '14px 14px', borderBottom: '1px solid var(--line)' }
        },
          el('div', { className: 'flex gap-8', style: { alignItems: 'center', flexWrap: 'wrap' } },
            check,
            el('div', { style: { fontWeight: 700, fontSize: '13px', flex: '1 1 240px' } }, m.sheet.name),
            el('div', { className: 'text-sm muted' }, m.sheet.problemCount + '문항'),
            gradeSelect,
            versionSelect
          ),
          roundChips
        ));
      });
      wrap.appendChild(el('div', { style: { border: '1px solid var(--line)', borderRadius: '10px', overflow: 'hidden' } }, list));

      // 미리보기
      const firstBlock = sheets[0].blocks[0];
      if (firstBlock) {
        wrap.appendChild(el('div', { className: 'mt-12', style: { padding: '10px 12px', background: 'var(--bg-elevated)', borderRadius: '8px', fontSize: '11.5px' } },
          el('div', { style: { fontWeight: 700, marginBottom: '6px' } },
            `👀 미리보기 — ${sheets[0].name}${firstBlock.round ? ' ' + firstBlock.round + '회' : ''}`),
          ...firstBlock.problems.slice(0, 3).map(p =>
            el('div', { style: { marginBottom: '4px', lineHeight: '1.5' } },
              el('strong', null, `${p.no}번: `),
              p.unit || '', p.subUnit ? ` › ${p.subUnit}` : '', p.soUnit ? ` › ${p.soUnit}` : '',
              p.type ? ` · ${p.type}` : '', p.difficulty ? ` · ${p.difficulty}` : ''
            )
          )
        ));
      }

      wrap.appendChild(el('div', { className: 'modal-actions' },
        el('button', { className: 'btn btn-ghost', onClick: closeModal }, '취소'),
        el('button', {
          className: 'btn btn-orange',
          onClick: () => {
            const targets = [];
            for (const m of maps) {
              if (!m.enabled) continue;
              if (!m.versionKey && gradeHasVersions(m.grade)) {
                showToast(`"${m.sheet.name}" 의 버전을 선택하거나 설정에 추가해 주세요`, 'error');
                return;
              }
              m.rounds.forEach((r, i) => {
                if (!r.use || !r.round) return;
                targets.push({ grade: m.grade, round: r.round, version: m.versionKey, block: m.sheet.blocks[i], sheetName: m.sheet.name });
              });
            }
            if (!targets.length) { showToast('적용할 회차를 선택하세요', 'error'); return; }

            // 중복 검사
            const seen = new Set();
            for (const t of targets) {
              const key = t.grade + '|' + t.round + '|' + (t.version || '');
              if (seen.has(key)) {
                showToast(`중복: ${t.grade} ${t.round}회 (${t.version || '-'})가 두 번 매핑되었습니다`, 'error');
                return;
              }
              seen.add(key);
            }

            const overRound = targets.filter(t => t.round > ROUNDS);
            if (overRound.length) {
              showToast(`설정된 회차(${ROUNDS}회)를 넘는 데이터가 있습니다. [설정 ①]에서 회차 수를 늘려주세요.`, 'error');
              return;
            }

            let totalApplied = 0;
            targets.forEach(t => {
              const versionLabels = getVersionLabelsForGrade(t.grade);
              const pKey = t.version ? ('r' + t.round + '_' + t.version) : ('r' + t.round);
              if (!state.testPapers[t.grade]) state.testPapers[t.grade] = {};
              const existing = state.testPapers[t.grade][pKey] || {};
              const problems = t.block.problems.map(p => ({ ...p }));
              state.testPapers[t.grade][pKey] = {
                version: t.version || '',
                versionLabel: t.version ? versionLabels[t.version] : '',
                problemCount: problems.length,
                topic: t.sheetName,
                paperPdf: existing.paperPdf || null,
                problems: problems,
                comment: existing.comment || '',
                analysisMode: 'excel_import',
                detectedCount: problems.length,
                uploadedAt: dateStr()
              };
              totalApplied += problems.length;
            });

            saveState();
            closeModal();
            render();
            showToast(`✅ ${targets.length}개 회차 · 총 ${totalApplied}개 문항 가져오기 완료`, 'success');
          }
        }, '✅ 가져오기')
      ));

      return wrap;
    }
  });
}

function base64ToBlob(dataUrl, mime) {
  const base64 = dataUrl.split(',')[1];
  const byteChars = atob(base64);
  const byteArr = new Uint8Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
  return new Blob([byteArr], { type: mime || 'application/octet-stream' });
}

async function openPdfBlob(pdf, gradeRoundKey) {
  if (!pdf) { showToast('PDF 데이터가 없습니다', 'error'); return; }
  let dataUrl = pdf.data;
  // 데이터가 없으면 IndexedDB에서 로드
  if (!dataUrl && gradeRoundKey) {
    showToast('PDF 불러오는 중...', 'info');
    dataUrl = await loadPdfFromDB(gradeRoundKey);
  }
  if (!dataUrl) {
    showToast('PDF 데이터를 찾을 수 없습니다', 'error');
    return;
  }
  const blob = base64ToBlob(dataUrl, 'application/pdf');
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

// ============================================================
// 자동 문항 분석
// 시험지 업로드 시 학년·학기·주제·문항 수를 기반으로 합리적인 기본값 자동 채움
// ============================================================

// 학년별 시험 범위 기본 매핑
// 2학기 중간고사 대비 → 중등은 2학기 단원, 고등은 해당 학년 2학기 과목 우선
const TERM_BOOK_ORDER = {
  '중1': ['2학기', '1학기'],
  '중2': ['2학기', '1학기'],
  '중3': ['2학기', '1학기'],
  '고1': ['공통수학2', '공통수학1'],
  '고2': ['대수', '미적분Ⅰ', '확률과 통계'],
  '고3': ['미적분Ⅱ', '기하']
};

function getBookOrder(grade) {
  const curr = TAG_SYSTEM.curriculum[grade] || {};
  const pref = TERM_BOOK_ORDER[grade] || [];
  const books = pref.filter(b => curr[b]);
  Object.keys(curr).forEach(b => { if (!books.includes(b)) books.push(b); });
  return books;
}

function getDefaultUnitRangeForRound(grade, round) {
  const curr = TAG_SYSTEM.curriculum[grade];
  if (!curr) return [];
  const flat = [];
  getBookOrder(grade).forEach(book => {
    (curr[book] || []).forEach(u => {
      if (u.mid) {
        // 고등 구조: 대단원 > 중단원 > 소단원
        (u.mid || []).forEach(m => {
          (m.sub || []).forEach(so => {
            flat.push({ book: book, unit: u.unit, mid: m.name, so: so });
          });
        });
      } else {
        // 중등 구조: 대단원 > 중단원
        (u.sub || []).forEach(s => {
          flat.push({ book: book, unit: u.unit, mid: s, so: '' });
        });
      }
    });
  });
  return flat;
}

// 문항 번호 → 난이도·유형 추론 (시험지 일반 패턴 기반)
function inferDifficultyByPosition(no, total) {
  // 시험지 난이도 분포 일반 패턴:
  //   처음 30% — 하 (개념·기본 계산)
  //   30~70% — 중 (응용·복합)
  //   70~90% — 상 (심화 응용)
  //   90~100% — 최상 (고난도)
  const ratio = (no - 1) / Math.max(1, total - 1);
  if (ratio < 0.30) return '하';
  if (ratio < 0.70) return '중';
  if (ratio < 0.90) return '상';
  return '최상';
}

function inferTypeByPosition(no, total) {
  // 문항 위치별 유형 분포 (일반적 시험지 구성):
  //   1~5번: 개념 확인형
  //   6~15번: 계산형
  //   16~22번: 응용형
  //   23번 이후: 추론형 또는 복합형
  const ratio = (no - 1) / Math.max(1, total - 1);
  if (ratio < 0.20) return '개념 확인형';
  if (ratio < 0.55) return '계산형';
  if (ratio < 0.85) return '응용형';
  return '추론형';
}

// "주제" 문자열에서 단원 키워드 매칭으로 적합한 단원 찾기
function matchUnitsByTopic(topicStr, grade) {
  if (!topicStr) return null;
  const allUnits = getDefaultUnitRangeForRound(grade, 1);
  const matched = [];
  // 주제 문자열에서 키워드 추출 (예: "식의 계산과 일차부등식" → ["식의 계산", "일차부등식"])
  const keywords = topicStr.split(/[,·、\/+&과와그리고및]/g)
    .map(k => k.trim())
    .filter(k => k.length >= 2);
  
  keywords.forEach(kw => {
    // 단원명, 중단원명, 소단원명에 키워드가 포함된 것들 찾기
    const found = allUnits.filter(u => {
      return (u.unit && u.unit.includes(kw)) ||
             (u.mid && u.mid.includes(kw)) ||
             (u.so && u.so.includes(kw));
    });
    found.forEach(f => {
      if (!matched.some(m => m.unit === f.unit && m.mid === f.mid && m.so === f.so)) {
        matched.push(f);
      }
    });
  });
  return matched.length > 0 ? matched : null;
}

// 메인 자동 분석 함수: 모든 문항에 단원/유형/난이도 채워넣기
function autoAnalyzeProblems(problems, grade, round, topic) {
  const total = problems.length;
  if (total === 0) return problems;
  
  // 1) 주제로 단원 매칭 시도
  let candidateUnits = matchUnitsByTopic(topic, grade);
  
  // 2) 매칭 실패 시 학년·회차별 기본 범위 사용
  if (!candidateUnits || candidateUnits.length === 0) {
    candidateUnits = getDefaultUnitRangeForRound(grade, round);
  }
  
  if (candidateUnits.length === 0) return problems;
  
  // 3) 각 문항에 단원을 균등 분배 (앞쪽 문항은 앞 단원, 뒤쪽은 뒤 단원)
  problems.forEach((p, idx) => {
    // 이미 사용자가 수동 입력한 값은 보존
    if (p.unit || p.type || p.difficulty) return;
    
    // 단원 매핑: 문항 번호를 단원 개수에 따라 분배
    const unitIdx = Math.min(
      Math.floor((idx / total) * candidateUnits.length),
      candidateUnits.length - 1
    );
    const u = candidateUnits[unitIdx];
    p.book = u.book;
    p.unit = u.unit;
    p.subUnit = u.mid;
    p.soUnit = u.so;
    
    // 위치 기반 유형/난이도
    p.type = inferTypeByPosition(idx + 1, total);
    p.difficulty = inferDifficultyByPosition(idx + 1, total);
  });
  
  return problems;
}

// ============================================================
// PDF 텍스트 기반 진짜 자동 분석
// PDF에서 텍스트를 추출해 각 문항의 단원·유형·난이도를 실제로 분석
// ============================================================

// PDF에서 모든 페이지의 텍스트 추출
async function extractPdfText(dataUrl) {
  if (!window.pdfjsLib) {
    throw new Error('PDF.js 라이브러리가 로드되지 않았습니다');
  }
  // dataUrl → ArrayBuffer
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  
  const pdf = await window.pdfjsLib.getDocument({ data: bytes.buffer }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const text = content.items.map(item => item.str).join(' ');
    pages.push(text);
  }
  return pages.join('\n\n');
}

// 문항 번호별로 텍스트 분할
// 한국 수학 시험지의 다양한 번호 패턴을 인식
function splitTextByProblems(text, expectedCount) {
  // 다양한 패턴 시도
  const patterns = [
    { regex: /(?:^|[\n\r\s])(\d{1,2})\.\s/g,  name: '1.' },     // "1. "
    { regex: /(?:^|[\n\r\s])(\d{1,2})\)\s/g,  name: '1)' },     // "1) "
    { regex: /\[(\d{1,2})\]/g,                  name: '[1]' },   // "[1]"
    { regex: /문제\s*(\d{1,2})[\s\.\)]/g,      name: '문제 1' }, // "문제 1"
    { regex: /(?:^|[\n\r])\s*(\d{1,2})\s*[\.\)]/g, name: '줄시작1.' }, // 줄 시작 "1." (more lax)
  ];
  
  let bestSplit = null;
  let bestPattern = null;
  let bestCount = 0;
  
  for (const pat of patterns) {
    pat.regex.lastIndex = 0;
    const matches = [];
    let m;
    while ((m = pat.regex.exec(text)) !== null) {
      const num = parseInt(m[1]);
      if (num >= 1 && num <= 50) {
        // 매치의 실제 번호 부분의 시작 위치 계산
        const numStr = m[1];
        const numIdx = m[0].indexOf(numStr);
        matches.push({ num, index: m.index + numIdx, matchEnd: m.index + m[0].length });
      }
    }
    
    if (matches.length < 3) continue;
    
    // 가장 긴 연속 시퀀스 찾기 (1, 2, 3, ...) 
    // 중간에 중복이나 비순차 번호가 있어도 가장 긴 1→N 시퀀스 추출
    // 정답표/페이지번호 같은 패턴이 섞여있을 수 있으므로 첫 등장 번호만 사용
    const seenNums = new Set();
    const uniqueOrdered = [];
    for (const match of matches) {
      if (!seenNums.has(match.num)) {
        seenNums.add(match.num);
        uniqueOrdered.push(match);
      }
    }
    
    // 1부터 연속되는 가장 긴 시퀀스
    let expected = 1;
    const sequential = [];
    for (const match of uniqueOrdered) {
      if (match.num === expected) {
        sequential.push(match);
        expected++;
      } else if (match.num > expected) {
        // 건너뛴 번호가 있으면 시퀀스 종료
        break;
      }
    }
    
    if (sequential.length >= 3 && sequential.length > bestCount) {
      bestCount = sequential.length;
      bestSplit = sequential;
      bestPattern = pat.name;
    }
  }
  
  if (!bestSplit || bestSplit.length < 3) {
    console.log('[PDF 분석] 문항 번호 패턴 인식 실패. 텍스트 길이:', text.length);
    return null;
  }
  
  console.log('[PDF 분석] 패턴 "' + bestPattern + '"로 ' + bestSplit.length + '개 문항 감지');
  
  // 각 문항의 텍스트 영역 잘라내기
  const problems = [];
  for (let i = 0; i < bestSplit.length; i++) {
    const start = bestSplit[i].index;
    const end = i + 1 < bestSplit.length ? bestSplit[i + 1].index : text.length;
    problems.push({
      no: bestSplit[i].num,
      text: text.substring(start, end).slice(0, 800)
    });
  }
  return problems;
}

// 단원 키워드 사전 만들기 (학년별)
function buildKeywordMap(grade) {
  const curriculum = TAG_SYSTEM.curriculum[grade] || {};
  const keywords = [];
  
  Object.entries(curriculum).forEach(([book, units]) => {
    units.forEach(u => {
      // 대단원 이름에서 핵심 키워드 추출
      const unitName = u.unit.replace(/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\.\s*/, '');
      
      if (u.mid) { // 고1
        u.mid.forEach(m => {
          const midName = m.name.replace(/^\d+\.\s*/, '');
          m.sub.forEach(so => {
            keywords.push({
              keywords: extractKeywords(so + ' ' + midName + ' ' + unitName),
              book, unit: u.unit, mid: m.name, so: so
            });
          });
        });
      } else { // 중2/3
        u.sub.forEach(s => {
          keywords.push({
            keywords: extractKeywords(s + ' ' + unitName),
            book, unit: u.unit, mid: s, so: ''
          });
        });
      }
    });
  });
  
  return keywords;
}

// 텍스트에서 의미있는 키워드 추출
function extractKeywords(text) {
  // 수학 용어/단어를 추출 (2글자 이상 한글)
  const tokens = text.split(/[\s·,()\[\]{}]+/).filter(t => t.length >= 2);
  return [...new Set(tokens)];
}

// 문항 텍스트와 단원 키워드 매칭해서 가장 적합한 단원 찾기
function matchUnitByText(problemText, keywordMap) {
  if (!problemText) return null;
  
  let bestMatch = null;
  let bestScore = 0;
  
  for (const entry of keywordMap) {
    let score = 0;
    for (const kw of entry.keywords) {
      if (kw.length < 2) continue;
      // 정확 매칭은 높은 점수
      if (problemText.includes(kw)) {
        score += kw.length;  // 긴 키워드일수록 가중치 높음
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = entry;
    }
  }
  
  return bestScore >= 4 ? bestMatch : null;  // 최소 점수 임계값
}

// 문항 텍스트에서 유형 추론
function inferTypeFromText(text) {
  if (!text) return null;
  
  const patterns = [
    { keywords: ['증명', '보여라', '나타내라', '증명하시오'], type: '증명형' },
    { keywords: ['그래프', '도형', '삼각형', '사각형', '원', '각도', '넓이', '부피', '길이', '둘레'], type: '응용형' },
    { keywords: ['값을 구', '값은', '구하시오', '구하라'], type: '계산형' },
    { keywords: ['다음 중', '옳은 것', '옳지 않은', '모두 고르', '몇 개'], type: '개념 확인형' },
    { keywords: ['보기', '항상', '추론', '결론'], type: '추론형' },
    { keywords: ['풀이 과정', '서술', '설명하시오'], type: '서술형' }
  ];
  
  let bestType = null;
  let bestScore = 0;
  for (const p of patterns) {
    let score = 0;
    for (const kw of p.keywords) {
      if (text.includes(kw)) score++;
    }
    if (score > bestScore) {
      bestScore = score;
      bestType = p.type;
    }
  }
  return bestType;
}

// 문항 텍스트 길이/복잡도로 난이도 추론
function inferDifficultyFromText(text, position, total) {
  if (!text) return null;
  
  const len = text.length;
  // 텍스트 길이 + 위치 종합 점수
  let difficultyScore = 0;
  
  // 길이 기반 (긴 문항 = 더 어려움)
  if (len > 400) difficultyScore += 3;
  else if (len > 250) difficultyScore += 2;
  else if (len > 150) difficultyScore += 1;
  
  // 위치 기반
  const posRatio = (position - 1) / Math.max(1, total - 1);
  if (posRatio > 0.85) difficultyScore += 3;
  else if (posRatio > 0.65) difficultyScore += 2;
  else if (posRatio > 0.40) difficultyScore += 1;
  
  // 키워드 기반 가중치
  if (/(?:그리고|또한|이때|따라서|단,)/.test(text)) difficultyScore += 1;  // 조건이 많은 문제
  if (/(?:최[댓대]값|최[솟소]값)/.test(text)) difficultyScore += 1;
  if (/(?:정수|실수|모든)/.test(text)) difficultyScore += 1;
  
  if (difficultyScore <= 1) return '최하';
  if (difficultyScore <= 2) return '하';
  if (difficultyScore <= 4) return '중';
  if (difficultyScore <= 6) return '상';
  return '최상';
}

// 메인: PDF 텍스트 기반 자동 분석
// 반환: { mode, extracted, analyzed, detectedCount }
// detectedCount: PDF에서 실제 감지한 문항 수 (호출자가 problems 배열 크기 조정에 사용)
async function autoAnalyzeFromPDF(problems, grade, round, topic, pdfDataUrl) {
  if (!pdfDataUrl) {
    autoAnalyzeProblems(problems, grade, round, topic);
    return { mode: 'heuristic', extracted: 0, detectedCount: null };
  }
  
  try {
    const text = await extractPdfText(pdfDataUrl);
    if (!text || text.length < 100) {
      autoAnalyzeProblems(problems, grade, round, topic);
      return { mode: 'heuristic_empty_text', extracted: 0, detectedCount: null, textLength: text ? text.length : 0 };
    }
    
    // 문항별로 텍스트 분할 (PDF에서 실제 문항 수 자동 감지)
    const problemTexts = splitTextByProblems(text, problems.length);
    
    if (!problemTexts || problemTexts.length === 0) {
      autoAnalyzeProblems(problems, grade, round, topic);
      return { mode: 'heuristic_split_failed', extracted: 0, detectedCount: null, totalText: text.length };
    }
    
    // PDF에서 감지한 실제 문항 수
    const detectedCount = problemTexts.length;
    
    // problems 배열 크기를 감지한 문항 수로 조정
    if (detectedCount !== problems.length) {
      // 문항 추가
      while (problems.length < detectedCount) {
        problems.push({
          no: problems.length + 1,
          book: '', unit: '', subUnit: '', soUnit: '',
          type: '', difficulty: '', memo: ''
        });
      }
      // 문항 제거 (PDF에서 감지된 수가 더 적은 경우)
      while (problems.length > detectedCount) {
        problems.pop();
      }
      // 번호 재정렬
      problems.forEach((p, i) => p.no = i + 1);
    }
    
    // 학년별 단원 키워드 맵
    const keywordMap = buildKeywordMap(grade);
    
    let analyzed = 0;
    problems.forEach((p, idx) => {
      const probText = problemTexts.find(pt => pt.no === (idx + 1));
      const ptext = probText ? probText.text : '';
      
      if (ptext && ptext.length > 30) {
        const match = matchUnitByText(ptext, keywordMap);
        if (match) {
          p.book = match.book;
          p.unit = match.unit;
          p.subUnit = match.mid;
          p.soUnit = match.so;
          analyzed++;
        }
        
        const type = inferTypeFromText(ptext);
        if (type) p.type = type;
        
        const diff = inferDifficultyFromText(ptext, idx + 1, problems.length);
        if (diff) p.difficulty = diff;
      }
      
      // 매칭 실패한 부분은 위치 기반 휴리스틱으로 보완
      if (!p.unit) {
        const tempArr = [{ no: idx + 1, unit: '', subUnit: '', soUnit: '', type: '', difficulty: '' }];
        // 임시 분석 시 학년 기본 단원에서 위치별로 할당
        autoAnalyzeProblems(tempArr, grade, round, topic);
        if (tempArr[0].unit) {
          p.book = tempArr[0].book; p.unit = tempArr[0].unit;
          p.subUnit = tempArr[0].subUnit; p.soUnit = tempArr[0].soUnit;
        }
      }
      if (!p.type) p.type = inferTypeByPosition(idx + 1, problems.length);
      if (!p.difficulty) p.difficulty = inferDifficultyByPosition(idx + 1, problems.length);
    });
    
    return {
      mode: 'pdf_text',
      extracted: problemTexts.length,
      analyzed,
      detectedCount,
      totalText: text.length
    };
  } catch (err) {
    console.error('PDF 텍스트 분석 실패:', err);
    autoAnalyzeProblems(problems, grade, round, topic);
    return { mode: 'heuristic_error', error: err.message, detectedCount: null };
  }
}

// ============================================================
// Excel 내보내기 (전체 데이터)
// ============================================================
function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    showToast('Excel 라이브러리 로드 실패', 'error');
    return;
  }
  const wb = XLSX.utils.book_new();

  // 1) 학생 명단
  const studentRows = [['학년','학생명','학교','선생님','전학기','목표(학생)','가능(강사)','목표(강사)']];
  state.students.filter(s => GRADES.includes(s.grade)).forEach(s => {
    studentRows.push([s.grade, s.name, s.school, s.teacher, s.prevScore, s.studentGoal, s.teacherPossible, s.teacherGoal]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(studentRows), '학생명단');

  // 2) 선생님별 점수 시트
  getAllTeachers().forEach(t => {
    const headers = ['학년','학교','이름','직전','목표(학생)','가능(강사)','목표(강사)'];
    for (let r = 1; r <= ROUNDS; r++) headers.push(r+'회', r+'회 오답');
    const rows = [headers];
    state.students.filter(s => s.teacher === t && GRADES.includes(s.grade)).forEach(s => {
      const row = [s.grade, s.school, s.name, s.prevScore, s.studentGoal, s.teacherPossible, s.teacherGoal];
      for (let r = 1; r <= ROUNDS; r++) {
        const rd = getRoundData(s.id, r);
        if (!rd) row.push('', '');
        else if (isAbsent(rd)) row.push('결시', '');
        else row.push(rd.score || '', rd.errors || '');
      }
      rows.push(row);
    });
    if (rows.length > 1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), t.slice(0, 30));
  });

  // 3) 학년별 종합
  const summary = [['학년']];
  for (let r = 1; r <= ROUNDS; r++) summary[0].push(r+'회 평균', r+'회 응시', r+'회 최고', r+'회 최저');
  GRADES.forEach(g => {
    const row = [g];
    for (let r = 1; r <= ROUNDS; r++) {
      const st = gradeRoundStats(g, r);
      row.push(st.avg != null ? Number(st.avg.toFixed(1)) : '', st.count, st.max || '', st.min || '');
    }
    summary.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), '학년별 종합');

  XLSX.writeFile(wb, `수만프_전체데이터_${dateStr()}.xlsx`);
  showToast('Excel 다운로드 완료');
}

// Firebase 실시간 동기화
// ============================================================
// 사용 방법:
//   1) https://console.firebase.google.com 에서 프로젝트 만들기
//   2) "웹 앱 추가" → SDK 설정의 firebaseConfig 값 복사
//   3) 아래 FIREBASE_CONFIG의 값을 모두 채우기 (apiKey, authDomain, databaseURL, projectId)
//   4) Realtime Database 만들기 → 위치는 "asia-southeast1" (싱가포르) 권장
//   5) Realtime Database → "규칙" 탭에서 다음 규칙 적용:
//        { "rules": { ".read": true, ".write": true } }
//      (학원 내부용이므로 공개 규칙 사용. 외부 노출 방지를 위해 URL을 공유 범위만 제한)
//   6) GitHub Pages 등에 배포하여 선생님들과 링크 공유 → 실시간 자동 동기화
// 
// 빈 값으로 두면 자동으로 "오프라인 모드"(기존 localStorage만 사용)로 작동합니다.
// ============================================================
const FIREBASE_CONFIG = {
 apiKey: "AIzaSyBxlW9HEoodfMYyYc5IDd9LIJo3K4TLXwg",
  authDomain: "kladi-sumanpeu-83ad5.firebaseapp.com",
  databaseURL: "https://kladi-sumanpeu-83ad5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kladi-sumanpeu-83ad5"
};

// Firebase 데이터 경로 (이 프로그램 전용 루트)
const FB_ROOT = 'sumanpeu/2026-2mid';

const FBSync = (function() {
  let db = null;
  let rootRef = null;
  let isOnline = false;
  let isApplyingRemote = false;  // 원격 데이터 적용 중 플래그(쓰기 루프 방지)
  let lastPushedHash = '';
  
  // 설정 여부 확인
  const isConfigured = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
  
  function init() {
    if (!isConfigured) {
      console.log('[FBSync] Firebase 미설정 - 오프라인 모드로 동작합니다.');
      updateBadge('offline');
      return;
    }
    if (typeof firebase === 'undefined' || !firebase.initializeApp) {
      console.warn('[FBSync] Firebase SDK가 로드되지 않았습니다.');
      updateBadge('error');
      return;
    }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      rootRef = db.ref(FB_ROOT);
      
      // 연결 상태 모니터링
      db.ref('.info/connected').on('value', snap => {
        isOnline = !!snap.val();
        updateBadge(isOnline ? 'online' : 'connecting');
      });
      
      // 실시간 수신
      rootRef.on('value', snap => {
        const remote = snap.val();
        if (remote && remote.meta && remote.meta.term && remote.meta.term !== TERM_ID) {
          console.warn('[FBSync] 다른 학기 데이터(' + remote.meta.term + ')가 감지되어 무시합니다.');
          updateBadge('error');
          return;
        }
        if (!remote) {
          // 최초 진입 — 원격이 비어 있으면 로컬(명단·설정)을 올려 초기화
          push();
          return;
        }
        applyRemote(remote);
      }, err => {
        console.error('[FBSync] 수신 오류:', err);
        updateBadge('error');
      });
      
      console.log('[FBSync] Firebase 실시간 동기화 활성화됨');
    } catch (e) {
      console.error('[FBSync] 초기화 실패:', e);
      updateBadge('error');
    }
  }
  
  // 원격 → 로컬 적용
  function applyRemote(remote) {
    try {
      isApplyingRemote = true;
      // PDF 동기화 제외: paperPdf의 data만은 절대 덮어쓰지 않음 (로컬 IndexedDB 우선)
      const merged = {
        students: remote.students || state.students || [],
        scores: remote.scores || {},
        testPapers: remote.testPapers || {},
        config: remote.config || state.config || defaultConfig(),
        meta: remote.meta || state.meta
      };
      state.students = merged.students;
      state.scores = merged.scores;
      state.testPapers = merged.testPapers;
      state.meta = merged.meta;

      // 설정(회차·학년·시험지 버전)도 함께 동기화 — 선생님별로 버전 목록이 어긋나지 않도록
      state.config = merged.config;
      applyConfig();
      if (!GRADES.includes(ui.papersGrade)) ui.papersGrade = GRADES[0];
      if (ui.scoreFilters && ui.scoreFilters.round > ROUNDS) ui.scoreFilters.round = 1;
      lastPushedHash = simpleHash(remote);
      
      // window.state 갱신
      window.state = state;
      
      // localStorage에도 저장(원래 saveState가 하는 일)
      saveStateLocalOnly();
      
      // UI 갱신 — 단, 점수 입력 중(저장 전)이면 화면을 다시 그리지 않는다
      if (ui.currentPage === 'scores' && hasDrafts()) {
        showToast('다른 선생님의 입력이 도착했습니다 · 저장하면 함께 반영됩니다');
      } else if (typeof render === 'function') {
        try { render(); } catch (e) { console.error('[FBSync] render 실패:', e); }
      }
    } finally {
      isApplyingRemote = false;
    }
  }
  
  // 로컬 → 원격 푸시
  function push() {
    if (!rootRef || isApplyingRemote) return;
    try {
      // PDF의 base64 data 필드는 푸시 대상에서 제외 (용량 문제)
      const payload = {
        students: state.students || [],
        scores: state.scores || {},
        testPapers: stripPdfData(state.testPapers || {}),
        config: state.config || defaultConfig(),
        meta: { ...(state.meta || {}), term: TERM_ID, program: PROGRAM }
      };
      const hash = simpleHash(payload);
      if (hash === lastPushedHash) return;  // 변경 없음
      lastPushedHash = hash;
      
      rootRef.set(payload).catch(e => {
        console.error('[FBSync] 푸시 실패:', e);
        updateBadge('error');
      });
    } catch (e) {
      console.error('[FBSync] 푸시 중 오류:', e);
    }
  }
  
  // testPapers의 paperPdf.data 제거 (메타만 남김)
  function stripPdfData(testPapers) {
    const out = {};
    for (const grade in testPapers) {
      out[grade] = {};
      for (const rkey in testPapers[grade]) {
        const p = testPapers[grade][rkey];
        if (!p) continue;
        const light = { ...p };
        if (light.paperPdf && light.paperPdf.data) {
          light.paperPdf = {
            name: light.paperPdf.name || '',
            size: light.paperPdf.size || 0,
            stored: true
          };
        }
        out[grade][rkey] = light;
      }
    }
    return out;
  }
  
  function simpleHash(obj) {
    try { return JSON.stringify(obj).length + ':' + JSON.stringify(obj).slice(-50); }
    catch(e) { return ''; }
  }
  
  // 상태 뱃지 업데이트
  function updateBadge(status) {
    const badge = document.getElementById('fb-sync-badge');
    if (!badge) return;
    const labels = {
      online: { dot: '#15803d', text: '실시간 동기화', sub: '연결됨' },
      connecting: { dot: '#d97706', text: '실시간 동기화', sub: '연결 중...' },
      offline: { dot: '#9090a8', text: '오프라인 모드', sub: '로컬 저장만' },
      error: { dot: '#b91c3c', text: '동기화 오류', sub: '콘솔 확인' }
    };
    const s = labels[status] || labels.offline;
    badge.querySelector('.fb-dot').style.background = s.dot;
    badge.querySelector('.fb-text').textContent = s.text;
    badge.querySelector('.fb-sub').textContent = s.sub;
  }
  
  return {
    init,
    push,
    isConfigured: () => isConfigured,
    isApplyingRemote: () => isApplyingRemote
  };
})();

// 원본 saveState를 감싸서 Firebase에도 자동 푸시
const _originalSaveState = saveState;

  if (!FBSync.isApplyingRemote()) {
    FBSync.push();
  }
};

// ============================================================
const GATE_STORAGE_KEY = STORAGE_KEY + '_gate';
const GATE_DEFAULT_PW = 'kladi2026';

// 가벼운 해시(djb2) — 파일에 비밀번호를 그대로 남기지 않기 위한 용도
function gateHash(str) {
  let h = 5381;
  const t = String(str == null ? '' : str);
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0;
  return 'g' + h.toString(36);
}
function requiredGateHash() {
  return (state.config && state.config.gateHash) || gateHash(GATE_DEFAULT_PW);
}
function isUnlocked() {
  try { return localStorage.getItem(GATE_STORAGE_KEY) === requiredGateHash(); }
  catch (e) { return false; }
}
function unlock(pw) {
  const h = gateHash(pw);
  if (h !== requiredGateHash()) return false;
  try { localStorage.setItem(GATE_STORAGE_KEY, h); } catch (e) {}
  return true;
}
function lockAgain() {
  try { localStorage.removeItem(GATE_STORAGE_KEY); } catch (e) {}
  location.reload();
}

function adminUnlock(pw) {

function renderGate(onSuccess) {
  const app = document.getElementById('app') || document.body;
  const pw = el('input', {
    className: 'input', type: 'password', placeholder: '비밀번호',
    style: { fontSize: '16px', textAlign: 'center', letterSpacing: '2px' }
  });
  const msg = el('div', { className: 'text-sm', style: { color: 'var(--red)', minHeight: '20px', marginTop: '8px' } });
  function submit() {
    if (unlock(pw.value)) { gateWrap.remove(); onSuccess(); }
    else { msg.textContent = '비밀번호가 맞지 않습니다.'; pw.value = ''; pw.focus(); }
  }
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  const gateWrap = el('div', {
    style: {
      position: 'fixed', inset: '0', zIndex: '9999', background: 'var(--bg)',

// Ctrl+S 저장 · 브라우저 종료 시 경고
function installScoreShortcuts() {
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      if (ui.currentPage === 'scores') {
        e.preventDefault();
        if (!hasDrafts()) { showToast('저장할 변경 내용이 없습니다'); return; }
        const n = commitDrafts();
        render();
        showToast(n + '건 저장 완료 ✓', 'success');
      }
    }
  });
  window.addEventListener('beforeunload', e => {
    if (hasDrafts()) { e.preventDefault(); e.returnValue = ''; }
  });
}

function boot() {
  loadState();
  // 디버그/테스트용으로 window에 핵심 객체 노출
  window.state = state;
  window.ui = ui;
  window.render = render;
  window.renderSharedReport = renderSharedReport;
  window.getRoundData = getRoundData;
  window.setRoundData = setRoundData;
  window.openParentReportModal = openParentReportModal;
  window.closeModal = closeModal;
  window.saveState = saveState;
  window.FBSync = FBSync;
  if (checkSharedReport()) {
    // 학부모 공유 리포트는 비밀번호 없이 열람
    renderSharedReport();
    FBSync.init();
  } else if (isUnlocked()) {
    render();
    installScoreShortcuts();
    FBSync.init();
  } else {
    renderGate(() => { render(); installScoreShortcuts(); FBSync.init(); });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
