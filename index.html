<style>
:root {

  --bg-card: #ffffff;
  --bg-elevated: #f4f1ea;
  --bg-deep: #ebe6d8;

  --ink: #1a1a2e;

  --orange: #b5924f;
  --orange-deep: #8c6c33;
  --orange-light: #d9bd82;
  --orange-soft: #f2e7d1;
  --orange-bg: #faf6ea;

  --navy: #0f2742;
  --navy-2: #1e3a5f;
  --navy-soft: #d8e0eb;

  --c-middle1: #7c3aed;
  --c-middle1-soft: #ede4fd;
  --c-middle2: #2563eb;
  --c-middle2-soft: #dde8fc;
  --c-middle3: #0f766e;
  --c-middle3-soft: #d1eee9;
  --c-high1: #be185d;
  --c-high1-soft: #fadcec;
  --c-high2: #b45309;
  --c-high2-soft: #fbead1;
  --c-high3: #4d4d4d;
  --c-high3-soft: #e6e6e6;

  --green: #15803d;
  --green-soft: #d4f0dc;
  --red: #b91c3c;
  --red-soft: #fae0e5;
  --amber: #d97706;
  --amber-soft: #fef0d9;

  --radius: 8px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --shadow-xs: 0 1px 2px rgba(26,26,46,0.04);
  --shadow-sm: 0 1px 3px rgba(26,26,46,0.06), 0 1px 2px rgba(26,26,46,0.04);
  --shadow: 0 2px 5px rgba(26,26,46,0.05), 0 6px 16px rgba(26,26,46,0.05);
  --shadow-lg: 0 8px 24px rgba(26,26,46,0.10), 0 20px 40px rgba(26,26,46,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14.5px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  font-feature-settings: 'tnum';
}
body {
  background-image:
    radial-gradient(1200px 500px at 0% -10%, rgba(181,146,79,0.05), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(15,39,66,0.03), transparent 60%);
  background-attachment: fixed;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
.serif { font-family: 'Noto Serif KR', serif; }

/* Topbar */
.topbar {
  background: rgba(255,255,255,0.85);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-inner {
  max-width: 1480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 14px 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  padding-right: 22px;
  border-right: 1px solid var(--line);
}
.brand-logo { height: 32px; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-name-ko {
  font-family: 'Noto Serif KR', serif;
  font-weight: 800;
  font-size: 14px;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.brand-tagline {
  font-size: 10.5px;
  color: var(--ink-mute);
  letter-spacing: 2px;
  margin-top: 3px;
  text-transform: uppercase;
  font-weight: 600;
}

.nav { display: flex; gap: 2px; flex: 1; }
.nav-item {
  padding: 9px 14px;
  border-radius: var(--radius);
  color: var(--ink-3);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
  border: none;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: -0.1px;
}
.nav-item:hover { color: var(--ink); background: var(--bg-elevated); }
.nav-item.active {
  color: var(--orange-deep);
  background: var(--orange-soft);
  font-weight: 700;
}

.topbar-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: var(--radius);
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  font-size: 15px;
}
.icon-btn:hover {
  color: var(--orange-deep);
  border-color: var(--orange);
  background: var(--orange-soft);
}

.main {
  max-width: 1480px;
  margin: 0 auto;
  padding: 32px 28px;
}
.page { display: none; animation: fadeIn 0.28s ease; }
.page.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-header { margin-bottom: 28px; }
.page-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -0.8px;
  margin-bottom: 6px;
  color: var(--ink);
  line-height: 1.2;
}
.page-subtitle {
  color: var(--ink-3);
  font-size: 13.5px;
  letter-spacing: -0.1px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}
.card-elev { box-shadow: var(--shadow); }
.card-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-family: 'Noto Serif KR', serif;
  letter-spacing: -0.3px;
}
.card-title-accent {
  width: 4px; height: 17px;
  background: linear-gradient(180deg, var(--orange), var(--orange-deep));
  border-radius: 2px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 26px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.18s, box-shadow 0.18s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--orange);
}
.stat-card.navy::before { background: var(--navy); }
.stat-card.green::before { background: var(--green); }
.stat-card.pink::before { background: var(--c-high1); }
.stat-label {
  font-size: 11.5px;
  color: var(--ink-mute);
  text-transform: uppercase;
  letter-spacing: 1.4px;
  margin-bottom: 10px;
  font-weight: 700;
}
.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 30px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -1px;
  line-height: 1;
}
.stat-unit { font-size: 14px; color: var(--ink-3); margin-left: 4px; font-weight: 500; }
.stat-sub { font-size: 12px; color: var(--ink-3); margin-top: 10px; font-weight: 500; }

.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) {
  .grid-2, .grid-4 { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .grid-3 { grid-template-columns: 1fr; }
}

.round-version-group {
  margin-bottom: 18px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.round-version-group .grid-3 { gap: 10px; }
.round-version-title {
  font-family: 'Noto Serif KR', serif;
  font-weight: 800;
  font-size: 15px;
  color: var(--orange-deep);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 6px;
}
.round-version-title::before {
  content: '';
  width: 4px;
  height: 16px;
  background: var(--orange);
  border-radius: 2px;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
  padding: 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
}
.filter-label {
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.filter-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 6px 14px;

  background: var(--bg-elevated);
  border: 1px solid var(--line);
  color: var(--ink-3);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: -0.1px;
}
.chip:hover { color: var(--ink); border-color: var(--ink-mute); }
.chip.active { background: var(--ink); color: white; border-color: var(--ink); }

.form-row {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 14px;
  align-items: center;
  margin-bottom: 14px;
}
.form-label { font-size: 13px; color: var(--ink-3); font-weight: 700; }
.input, .select, .textarea {
  width: 100%;
  padding: 10px 13px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 13.5px;
  transition: all 0.15s;
  font-weight: 500;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(181,146,79,0.15);
}
.textarea { resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.6; }
.input[type="number"] { font-family: 'JetBrains Mono', monospace; }

.btn {
  padding: 10px 18px;
  background: var(--ink);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  letter-spacing: -0.1px;
}
.btn:hover { background: var(--ink-2); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn-orange { background: var(--orange); color: white; }
.btn-orange:hover { background: var(--orange-deep); }
.btn-ghost {
  background: var(--bg-card);
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-ghost:hover { background: var(--bg-elevated); transform: none; }
.btn-danger { background: var(--red); color: white; }
.btn-danger:hover { background: #93192f; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }

.table-wrap {
  overflow-x: auto;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
}
table.dt { width: 100%; border-collapse: collapse; font-size: 13px; }
table.dt th, table.dt td {
  padding: 11px 14px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.dt th {
  background: var(--bg-elevated);
  color: var(--ink-3);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  position: sticky;
  top: 0;
}
table.dt tbody tr { transition: background 0.12s; }
table.dt tbody tr:hover { background: var(--bg-elevated); }
table.dt td.num { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
table.dt td.score-high { color: var(--green); }
table.dt td.score-mid { color: var(--amber); }
table.dt td.score-low { color: var(--red); }
table.dt td.absent { color: var(--ink-mute); font-style: italic; }

.badge {
  display: inline-block;
  padding: 3px 9px;
  background: var(--bg-elevated);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
  letter-spacing: 0.3px;
}
.badge-grade-중1 { background: var(--c-middle1-soft); color: var(--c-middle1); }
.badge-grade-중2 { background: var(--c-middle2-soft); color: var(--c-middle2); }
.badge-grade-중3 { background: var(--c-middle3-soft); color: var(--c-middle3); }
.badge-grade-고1 { background: var(--c-high1-soft); color: var(--c-high1); }
.badge-grade-고2 { background: var(--c-high2-soft); color: var(--c-high2); }
.badge-grade-고3 { background: var(--c-high3-soft); color: var(--c-high3); }
.badge-success { background: var(--green-soft); color: var(--green); }
.badge-danger { background: var(--red-soft); color: var(--red); }
.badge-warning { background: var(--amber-soft); color: var(--amber); }
.badge-orange { background: var(--orange-soft); color: var(--orange-deep); }
.badge-excel { 
  background: rgba(16, 185, 129, 0.12); 
  color: #047857; 
  border: 1px solid rgba(16, 185, 129, 0.25);
  font-weight: 800;
}

/* === 응시율 표시 === */
.attendance-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;

}
.attendance-badge.mid {
  background: rgba(245, 158, 11, 0.10);
  color: #b45309;

}
.attendance-badge.low {
  background: rgba(220, 38, 38, 0.08);

}
.attendance-badge::before {

}
.attendance-warn {
  display: inline-block;
  margin-left: 4px;
  font-size: 11px;
  color: #b91c1c;
  font-weight: 700;
}
.score-with-attendance {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* === 학생 분류 배지 === */
.student-category-badge {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 6px;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

/* === 목표 진행률 바 === */
.goal-progress-bar {
  width: 100%;
  height: 6px;
  background: var(--bg-elevated);
  border-radius: 3px;
  overflow: hidden;
}
.goal-progress-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === 우선 관리 대상 박스 === */
.priority-box {

}

}
.priority-sub {

}

  font-weight: 800;

  align-items: center;
  justify-content: center;
  background: rgba(220, 38, 38, 0.08);
  border-radius: 50%;
  flex-shrink: 0;

.priority-content { flex: 1; min-width: 0; }
.priority-name-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;

}
.priority-name {

  font-weight: 800;
  font-size: 15px;

.priority-school {

  color: var(--ink-3);

}
.priority-badge {

}
.priority-tag {

/* === 공통 약점 단원 박스 === */
.weak-units-box {

.score-grid {
  display: grid;
  gap: 0;

.weakness-tag-mid { background: var(--amber-soft); color: var(--amber); }
.weakness-tag-low { background: var(--bg-elevated); color: var(--ink-2); }
.weakness-tag-count {
  background: rgba(0,0,0,0.08);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
}

/* === 새로운 학부모 친화적 약점 시각화 === */
.weakness-headline {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  background: linear-gradient(135deg, rgba(181, 146, 79, 0.08) 0%, rgba(140, 108, 51, 0.04) 100%);
  border: 1px solid rgba(181, 146, 79, 0.25);
  border-left: 5px solid var(--orange);
  border-radius: 12px;
  margin-bottom: 20px;
}
.weakness-headline-icon {
  font-size: 32px;
  flex-shrink: 0;
}
.weakness-headline-content { flex: 1; min-width: 0; }
.weakness-headline-label {
  font-size: 11.5px;
  color: var(--orange-deep);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.weakness-headline-unit {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 6px;
}
.weakness-headline-stat {
  font-size: 12.5px;
  color: var(--ink-3);
}
.weakness-headline-stat strong {
  color: var(--orange-deep);
  font-weight: 800;
  font-size: 14px;
  font-family: 'JetBrains Mono', monospace;
}

.weakness-bar-group {
  margin-bottom: 20px;
}
.weakness-bar-title {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-3);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.weakness-bar-title::before {
  content: '';
  width: 3px; height: 12px;
  background: var(--orange);
  border-radius: 2px;
}
.weakness-bar-row {
  display: grid;
  grid-template-columns: 180px 1fr 50px;
  gap: 12px;
  align-items: center;
  padding: 6px 0;
}
.weakness-bar-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink);
  font-family: 'Noto Serif KR', serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.weakness-bar-track {
  height: 22px;
  background: var(--bg-elevated);
  border-radius: 11px;
  overflow: hidden;
  position: relative;
}
.weakness-bar-fill {
  height: 100%;
  border-radius: 11px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.weakness-bar-fill.bar-high { 
  background: linear-gradient(90deg, var(--red) 0%, #dc2626 100%);
}
.weakness-bar-fill.bar-mid { 
  background: linear-gradient(90deg, var(--orange) 0%, var(--orange-deep) 100%);
}
.weakness-bar-fill.bar-low { 
  background: linear-gradient(90deg, #94a3b8 0%, #64748b 100%);
}
.weakness-bar-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  text-align: right;
}

.weakness-sub-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 16px;
}
@media (max-width: 600px) {
  .weakness-sub-box { grid-template-columns: 1fr; }
  .weakness-bar-row { grid-template-columns: 100px 1fr 40px; gap: 8px; }
  .weakness-bar-label { font-size: 11.5px; }
}
.weakness-sub-col {}
.weakness-sub-title {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink-3);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}
.weakness-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.weakness-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-2);
}
.weakness-chip-count {
  background: var(--orange-soft);
  color: var(--orange-deep);
  padding: 1px 7px;
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 800;
}

.analysis-list {
  background: var(--orange-bg);
  border: 1px solid var(--orange-soft);
  border-left: 4px solid var(--orange);
  border-radius: 10px;
  padding: 18px 20px;
}
.analysis-item {
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-2);
  padding: 4px 0;
}
.analysis-item strong { color: var(--orange-deep); font-weight: 800; }

/* 학부모 검색 hero */

.search-hero-logo {

}
.search-hero-logo img {

}
.search-hero-tag {

.search-hero-title {

  font-weight: 900;
  margin-bottom: 14px;

  letter-spacing: -1.5px;

}
.search-hero-title-accent {

}
.search-hero-desc {

  font-size: 14.5px;
  margin-bottom: 32px;
  position: relative;
  z-index: 1;

}
.search-box {

}
.search-input {

.student-card {

.report-avatar {

.toast {

.gap-12 { gap: 12px; }

.mt-18 { margin-top: 18px; }

#fb-sync-badge .fb-dot {

/* ============================================================
   REFINEMENT LAYER — 2026.08 고급화 패스
   기존 톤(크림 + 오렌지 + 네이비)은 유지하고
   여백 · 서체 · 결(hairline) · 그림자만 정제합니다.
   ============================================================ */
:root {
  --bg: #faf9f5;
  --bg-card: #ffffff;
  --bg-elevated: #f5f2ea;
  --bg-deep: #ece7db;

  --line: #ece7dc;
  --line-2: #ddd5c2;
  --line-strong: #c3b590;

  --gold: #b99a5b;
  --gold-soft: rgba(185, 154, 91, 0.16);

  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --shadow-xs: 0 1px 1px rgba(31, 27, 20, 0.03);
  --shadow-sm: 0 1px 2px rgba(31, 27, 20, 0.04), 0 2px 8px rgba(31, 27, 20, 0.035);
  --shadow: 0 1px 2px rgba(31, 27, 20, 0.04), 0 8px 24px rgba(31, 27, 20, 0.06);
  --shadow-lg: 0 2px 6px rgba(31, 27, 20, 0.06), 0 24px 60px rgba(31, 27, 20, 0.12);
  --ring: 0 0 0 3px rgba(181, 146, 79, 0.16);
}

html { font-size: 14.5px; }
body {
  letter-spacing: -0.15px;
  font-variant-numeric: tabular-nums;
  text-rendering: optimizeLegibility;
  background-image:
    radial-gradient(1100px 460px at 0% -12%, rgba(181, 146, 79, 0.045), transparent 62%),
    radial-gradient(900px 560px at 100% -4%, rgba(15, 39, 66, 0.032), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,0.6), transparent 240px);
}
::selection { background: rgba(181, 146, 79, 0.22); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* 스크롤바 */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--line-strong); background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* 상단바 */
.topbar {
  background: rgba(252, 251, 248, 0.78);
  backdrop-filter: saturate(180%) blur(18px);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid rgba(31, 27, 20, 0.06);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
}
.topbar-inner { padding: 15px 32px; gap: 24px; }
.brand { padding-right: 24px; border-right: 1px solid var(--line); }
.brand-tagline { letter-spacing: 2.6px; font-size: 10px; color: var(--gold); }
.nav { gap: 3px; }
.nav-item {
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 12.8px;
  letter-spacing: -0.2px;
  transition: color .18s ease, background .18s ease, box-shadow .18s ease;
}
.nav-item:hover { background: rgba(31, 27, 20, 0.045); }
.nav-item.active {
  background: linear-gradient(180deg, #ffffff, var(--orange-bg));
  color: var(--orange-deep);
  box-shadow: 0 0 0 1px rgba(181, 146, 79, 0.28), 0 1px 2px rgba(31, 27, 20, 0.06);
}
.icon-btn { border-radius: 999px; border-color: var(--line); box-shadow: var(--shadow-xs); }
.icon-btn:hover { box-shadow: var(--shadow-sm); }

/* 페이지 헤더 */
.main { padding: 38px 32px 56px; }
.page-header {
  margin-bottom: 26px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.page-title { font-size: 29px; letter-spacing: -1.1px; margin-bottom: 7px; }
.page-subtitle { font-size: 13px; color: var(--ink-3); letter-spacing: -0.1px; }

/* 카드 */
.card {
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  padding: 26px;
  box-shadow: var(--shadow-sm);
  background-image: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
  margin-bottom: 18px;
}
.card-title {
  font-size: 14.5px;
  letter-spacing: -0.35px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.card-title-accent { width: 3px; height: 15px; border-radius: 99px; }

/* 지표 카드 */
.stat-grid { gap: 16px; margin-bottom: 30px; }
.stat-card {
  padding: 22px 22px 20px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  background-image:
    radial-gradient(420px 160px at 100% 0%, rgba(181, 146, 79, 0.05), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0));
  transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease;
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.stat-card::before {
  height: 2px;
  left: 22px; right: 22px;
  border-radius: 0 0 99px 99px;
  background: linear-gradient(90deg, var(--orange), var(--orange-light));
}
.stat-card.navy::before { background: linear-gradient(90deg, var(--navy), #47688f); }
.stat-card.green::before { background: linear-gradient(90deg, var(--green), #4ca86e); }
.stat-card.pink::before { background: linear-gradient(90deg, var(--c-high1), #e2699f); }
.stat-label { font-size: 10.5px; letter-spacing: 1.7px; color: var(--ink-mute); margin-bottom: 12px; }
.stat-value { font-size: 33px; letter-spacing: -1.6px; }
.stat-sub { font-size: 11.5px; color: var(--ink-mute); margin-top: 12px; font-weight: 600; }

/* 표 */
.table-wrap { border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.table-wrap > table.dt { border-radius: inherit; }
table.dt { font-size: 12.8px; }
table.dt th {
  background: linear-gradient(180deg, #fbf9f4, var(--bg-elevated));
  font-size: 10.5px;
  letter-spacing: 1px;
  color: var(--ink-mute);
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-2);
}
table.dt td { padding: 12px 16px; border-bottom: 1px solid rgba(31, 27, 20, 0.05); }
table.dt tbody tr:last-child td { border-bottom: none; }
table.dt tbody tr:hover { background: rgba(181, 146, 79, 0.045); }
table.dt td.num { font-weight: 600; letter-spacing: -0.3px; }

/* 버튼 */
.btn {
  border-radius: 999px;
  font-size: 12.8px;

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<!-- Firebase 실시간 동기화 상태 뱃지 -->
<div id="fb-sync-badge" title="Firebase 실시간 동기화 상태">
  <span class="fb-dot"></span>
  <span>
    <span class="fb-text">오프라인 모드</span>
    <span class="fb-sub" style="margin-left:6px;">로컬 저장만</span>
  </span>
</div>
<script>
// ============================================================
// 클라디수학학원 · 수만프 자동화 관리 시스템
// 2026년 2학기 중간고사 대비
// ============================================================

const ACADEMY = '클라디수학학원';
const PROGRAM = '2026년 2학기 중간고사 대비 수만프';
const TERM_ID = '2026-2-mid';

// ============================================================
// 기본 설정값 — 앱 내 [설정] 페이지에서 언제든 변경 가능
// ============================================================
const DEFAULT_ROUNDS = 8;
const DEFAULT_GRADES = ['중1', '중2', '중3', '고1', '고2'];
const SELECTABLE_GRADES = ['중1', '중2', '중3', '고1', '고2', '고3'];

// 학년별 시험지 버전 (이름·개수 모두 설정에서 편집)
const DEFAULT_VERSIONS = {
  '중1': ['표준 (V1)', '난이도 ↓ (V2)'],
  '중2': ['표준 (V1)', '난이도 ↓ (V2)'],
  '중3': ['표준 (V1)', '난이도 ↓ (V2)'],
  '고1': ['표준 (V1)', '난이도 ↓ (V2)'],
  '고2': ['표준 (V1)', '난이도 ↓ (V2)'],
  '고3': ['표준 (V1)', '난이도 ↓ (V2)']
};

// 런타임 값 — applyConfig()로 state.config에서 주입
let ROUNDS = DEFAULT_ROUNDS;
let GRADES = DEFAULT_GRADES.slice();
let GRADE_VERSIONS = JSON.parse(JSON.stringify(DEFAULT_VERSIONS));

function defaultConfig() {
  const versions = {};
  DEFAULT_GRADES.forEach(g => { versions[g] = (DEFAULT_VERSIONS[g] || ['표준 (V1)']).slice(); });
  return { rounds: DEFAULT_ROUNDS, grades: DEFAULT_GRADES.slice(), versions: versions };
}

function applyConfig() {
  if (!state.config) state.config = defaultConfig();
  const c = state.config;
  ROUNDS = Math.max(1, Math.min(20, parseInt(c.rounds, 10) || DEFAULT_ROUNDS));
  GRADES = (Array.isArray(c.grades) && c.grades.length) ? c.grades.slice() : DEFAULT_GRADES.slice();
  const v = {};
  GRADES.forEach(g => {
    const list = (c.versions && Array.isArray(c.versions[g]))
      ? c.versions[g].map(x => String(x == null ? '' : x).trim()).filter(Boolean) : null;
    v[g] = (list && list.length) ? list : (DEFAULT_VERSIONS[g] ? DEFAULT_VERSIONS[g].slice() : ['표준 (V1)']);
  });
  GRADE_VERSIONS = v;
}

// 학년별 버전 정보 헬퍼 (설정 기반)
function gradeHasVersions(grade) {
  return (GRADE_VERSIONS[grade] || []).length > 0;
}
function getVersionsForGrade(grade) {
  return (GRADE_VERSIONS[grade] || []).slice();
}
function getVersionKeysForGrade(grade) {
  return getVersionsForGrade(grade).map((_, i) => 'v' + (i + 1));
}
function getVersionLabelsForGrade(grade) {
  const o = {};
  getVersionsForGrade(grade).forEach((label, i) => { o['v' + (i + 1)] = label; });
  return o;
}

// 예전(1학기) 버전 라벨 호환 매핑
const LEGACY_VERSION_LABELS = {
  '방정식~행렬': 'v1', '부등식~행렬': 'v2', '방정식과 부등식+행렬': 'v3',
  '표준 (V1)': 'v1', '난이도 ↓ (V2)': 'v2'
};

// 라벨(또는 키) → v1/v2/... 키 변환
function versionKeyFromLabel(grade, label) {
  if (!label) return '';
  const s = String(label).trim();
  if (/^v\d+$/i.test(s)) return s.toLowerCase();
  const list = getVersionsForGrade(grade);
  let idx = list.indexOf(s);
  if (idx < 0) idx = list.findIndex(l => String(l).replace(/\s+/g, '') === s.replace(/\s+/g, ''));

// === Persistence ===
// PDF 등 큰 바이너리는 IndexedDB에 저장, 메타데이터만 localStorage에 저장
const PDF_DB_NAME = 'sumanpeu_pdfs_2026_2mid';
const PDF_STORE = 'pdfs';

function openPdfDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PDF_DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(PDF_STORE)) {
        db.createObjectStore(PDF_STORE);
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function savePdfToDB(key, dataUrl) {
  try {
    const db = await openPdfDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(PDF_STORE, 'readwrite');
      const store = tx.objectStore(PDF_STORE);
      const req = store.put(dataUrl, key);
      req.onsuccess = () => resolve(true);
      req.onerror = e => reject(e.target.error);
    });
  } catch (e) { console.error('PDF DB save failed', e); return false; }
}

async function loadPdfFromDB(key) {
  try {
    const db = await openPdfDB();
    return new Promise((resolve) => {
      const tx = db.transaction(PDF_STORE, 'readonly');
      const store = tx.objectStore(PDF_STORE);
      const req = store.get(key);
      req.onsuccess = e => resolve(e.target.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function deletePdfFromDB(key) {
  try {
    const db = await openPdfDB();
    return new Promise((resolve) => {
      const tx = db.transaction(PDF_STORE, 'readwrite');
      const store = tx.objectStore(PDF_STORE);
      const req = store.delete(key);
      req.onsuccess = () => resolve(true);
      req.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

// 저장 시 PDF 데이터(base64)를 분리해서 IndexedDB로, state에는 메타만
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch (e) { console.error(e); }

  // 설정(회차/학년/시험지 버전) 정규화 후 런타임 값에 반영
  if (!state.config || typeof state.config !== 'object') state.config = defaultConfig();
  if (!Array.isArray(state.config.grades) || !state.config.grades.length) state.config.grades = DEFAULT_GRADES.slice();
  if (!state.config.versions || typeof state.config.versions !== 'object') state.config.versions = defaultConfig().versions;
  if (!state.config.rounds) state.config.rounds = DEFAULT_ROUNDS;
  applyConfig();
  if (!ui.papersGrade || !GRADES.includes(ui.papersGrade)) ui.papersGrade = GRADES[0];

  if (!state.students || state.students.length === 0) {
    // 2학기 앱은 빈 명단으로 시작 — [학생 관리 > 엑셀 일괄등록]으로 명단을 올립니다.
    state.students = [];
  } else {
    state.students = state.students.map(s => ({
      prevScore: '', studentGoal: '', teacherGoal: '', teacherPossible: '',
      ...s
    }));
  }
  if (!state.scores) state.scores = {};
  if (!state.testPapers) state.testPapers = {};
  
  // 마이그레이션: 옛 구조(testPdf/solutionPdf 분리) → 새 구조(paperPdf 통합)
  // 또한 손상된 paper 데이터 정리
  for (const grade in state.testPapers) {
    if (!state.testPapers[grade] || typeof state.testPapers[grade] !== 'object') {
      delete state.testPapers[grade];
      continue;
    }
    for (const rkey in state.testPapers[grade]) {
      const p = state.testPapers[grade][rkey];
      if (!p || typeof p !== 'object') {
        delete state.testPapers[grade][rkey];
        continue;
      }
      // 옛 구조 마이그레이션
      if (!p.paperPdf && p.testPdf) {
        p.paperPdf = p.testPdf;
        delete p.testPdf;
      }
      if (p.solutionPdf) delete p.solutionPdf;  // 더 이상 사용 안 함
      // problems 배열이 없거나 잘못된 형태면 빈 배열로
      if (!Array.isArray(p.problems)) p.problems = [];
      // 각 problem이 객체가 아니면 정리
      p.problems = p.problems.map((q, i) => {
        if (!q || typeof q !== 'object') {
          return { no: i+1, book: '', unit: '', subUnit: '', soUnit: '', type: '', difficulty: '', memo: '' };
        }
        return {
          no: q.no || (i+1),
          book: q.book || '',
          unit: q.unit || '',
          subUnit: q.subUnit || '',
          soUnit: q.soUnit || '',
          type: q.type || '',
          difficulty: q.difficulty || '',
          memo: q.memo || ''
        };
      });
    }
    
    // 중1/중2/중3 기존 r{N} 형식 → r{N}_v1 으로 자동 이전
    // (사용자 기존 데이터는 표준 버전 V1로 간주)
    if (grade === '중1' || grade === '중2' || grade === '중3') {
      for (const rkey in state.testPapers[grade]) {
        // r1, r2 ... 같이 _v 없는 키만 이전
        if (/^r\d+$/.test(rkey)) {
          const round = rkey.substring(1);
          const newKey = 'r' + round + '_v1';
          // 이미 _v1이 있으면 건너뜀
          if (!state.testPapers[grade][newKey]) {
            state.testPapers[grade][newKey] = state.testPapers[grade][rkey];
            // version 정보 추가
            state.testPapers[grade][newKey].version = 'v1';
            state.testPapers[grade][newKey].versionLabel = '표준 (V1)';
          }
          delete state.testPapers[grade][rkey];
        }
      }
    }
  }
}

function saveState() {
  try {
    // PDF의 base64 data 필드는 localStorage에 저장하지 않음
    const stateLight = {
      students: state.students,
      scores: state.scores,
      testPapers: {},
      meta: state.meta
    };
    for (const grade in state.testPapers) {
      stateLight.testPapers[grade] = {};
      for (const rkey in state.testPapers[grade]) {
        const p = state.testPapers[grade][rkey];
        if (!p) continue;
        const lightPaper = { ...p };
        // paperPdf에서 큰 data만 제거(이름/크기는 유지)
        if (lightPaper.paperPdf && lightPaper.paperPdf.data) {
          lightPaper.paperPdf = {
            name: lightPaper.paperPdf.name,
            size: lightPaper.paperPdf.size,
            stored: true  // IndexedDB에 저장됨을 표시
          };
        }
        stateLight.testPapers[grade][rkey] = lightPaper;
      }
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stateLight));
  } catch (e) {
    console.error('saveState error', e);
    if (typeof showToast === 'function') showToast('저장 용량 초과 (시험지 메타데이터 저장 실패)', 'error');
  }
}

// PDF 키 생성 (학년+회차+버전으로 고유)
function pdfKey(grade, round, version) {
  if (version && gradeHasVersions(grade)) {
    // version을 v1/v2/v3 키로 정규화
    let v = version;
    if (grade === '고1') {
      if (version === '방정식~행렬') v = 'v1';
      else if (version === '부등식~행렬') v = 'v2';
      else if (version === '방정식과 부등식+행렬') v = 'v3';
    } else {
      // 중1/중2/중3
      if (version === '표준 (V1)') v = 'v1';
      else if (version === '난이도 ↓ (V2)') v = 'v2';
    }
    return grade + '_r' + round + '_' + v;
  }
  return grade + '_r' + round;
}

// === DOM helpers ===
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.from((r || document).querySelectorAll(s)); }

function el(tag, props) {
  const node = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'className') node.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else if (k.startsWith('on') && typeof v === 'function') {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'html') node.innerHTML = v;
      else if (k === 'dataset') { for (const d in v) node.dataset[d] = v[d]; }
      else if (k in node) { try { node[k] = v; } catch(e) { node.setAttribute(k, v); } }
      else node.setAttribute(k, v);
    }
  }
  const kids = Array.from(arguments).slice(2).flat(Infinity);
  for (const c of kids) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') node.appendChild(document.createTextNode(String(c)));
    else node.appendChild(c);
  }
  return node;
}

function showToast(message, type) {
  const t = el('div', { className: 'toast' + (type ? ' ' + type : ' success') },
    type === 'error' ? '⚠ ' : type === 'info' ? 'ⓘ ' : type === 'success' || !type ? '✓ ' : '',
    message
  );
  $('#toast-root').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(20px)'; }, 2400);
  setTimeout(() => t.remove(), 2800);
}

// === Score helpers ===
function scoreClass(s) {
  if (s == null || s === '' || s === 'absent') return '';
  const n = Number(s);
  if (isNaN(n)) return '';
  if (n >= 80) return 'score-high';
  if (n >= 60) return 'score-mid';
  return 'score-low';
}

function dotClass(s) {
  if (s === 'absent') return 'absent';
  if (s == null || s === '') return '';
  const n = Number(s);
  if (isNaN(n)) return '';
  if (n >= 80) return 'high';
  if (n >= 60) return 'mid';
  return 'low';
}

function fmt(n, d) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toFixed(d == null ? 1 : d);
}

function getRoundData(sid, r) {
  const sc = state.scores[sid];
  if (!sc) return null;
  return sc['r' + r] || null;
}

function setRoundData(sid, r, data) {
  if (!state.scores[sid]) state.scores[sid] = {};
  state.scores[sid]['r' + r] = data;
  saveState();
}

function isAbsent(rd) { return rd && rd.absent === true; }

function getScore(rd) {
  if (!rd || isAbsent(rd)) return null;
  const n = Number(rd.score);
  return isNaN(n) ? null : n;
}

function getStudent(id) { return state.students.find(s => s.id === id); }

function getAllTeachers() {
  const set = new Set();
  state.students.forEach(s => { if (s.teacher) set.add(s.teacher); });
  return Array.from(set).sort();
}

function filterStudents(f) {
  return state.students.filter(s => {
    if (!GRADES.includes(s.grade)) return false;
    if (f.grade && f.grade !== 'all' && s.grade !== f.grade) return false;
    if (f.teacher && f.teacher !== 'all' && s.teacher !== f.teacher) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!s.name.toLowerCase().includes(q) && !(s.school||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function avg(arr) {
  const nums = arr.filter(x => x != null && !isNaN(x));
  if (nums.length === 0) return null;
  return nums.reduce((a,b) => a+b, 0) / nums.length;
}

function gradeRoundStats(grade, round) {
  const ids = state.students.filter(s => s.grade === grade).map(s => s.id);
  const scores = ids.map(id => getScore(getRoundData(id, round))).filter(x => x != null);
  const absentCount = ids.filter(id => isAbsent(getRoundData(id, round))).length;
  if (scores.length === 0) return { avg: null, min: null, max: null, count: 0, absent: absentCount, total: ids.length };
  return {
    avg: scores.reduce((a,b)=>a+b,0) / scores.length,
    min: Math.min(...scores),
    max: Math.max(...scores),
    count: scores.length,
    absent: absentCount,
    total: ids.length
  };
}

function teacherRoundStats(teacher, grade, round) {
  const ids = state.students.filter(s => s.teacher === teacher && (!grade || s.grade === grade) && GRADES.includes(s.grade)).map(s => s.id);
  const scores = ids.map(id => getScore(getRoundData(id, round))).filter(x => x != null);
  const absentCount = ids.filter(id => isAbsent(getRoundData(id, round))).length;
  if (scores.length === 0) return { avg: null, count: 0, total: ids.length, absent: absentCount };
  return {
    avg: scores.reduce((a,b)=>a+b,0) / scores.length,
    count: scores.length,
    total: ids.length,
    absent: absentCount
  };
}

// 응시율 헬퍼: 학생 수 대비 응시한 학생 비율 (결시 제외)
// total: 응시 대상 총 학생 수
// count: 점수 입력된 학생 수 (응시)
// absent: 결시 처리된 학생 수
// 응시율 = count / total (결시·미입력 모두 분모에 포함)
function attendanceRate(stat) {
  if (!stat || !stat.total) return null;
  return stat.count / stat.total;
}

// 응시율에 따른 색상 등급
// 80% 이상: 정상(녹색), 50-80%: 주의(노랑), 50% 미만: 경고(빨강)
function attendanceLevel(rate) {
  if (rate == null) return 'none';
  if (rate >= 0.8) return 'high';
  if (rate >= 0.5) return 'mid';
  return 'low';
}

function parseErrors(str) {
  if (!str) return [];
  return String(str).split(/[,\s]+/).map(s => s.trim()).filter(s => /^\d+$/.test(s)).map(Number);
}

function commonWrongs(grade, round, top) {
  top = top || 5;
  const ids = state.students.filter(s => s.grade === grade).map(s => s.id);
  const counter = {};
  let total = 0;
  ids.forEach(id => {
    const rd = getRoundData(id, round);
    if (!rd || isAbsent(rd) || !rd.errors) return;
    total++;
    parseErrors(rd.errors).forEach(e => { counter[e] = (counter[e] || 0) + 1; });
  });
  return { entries: Object.entries(counter).sort((a,b) => b[1] - a[1]).slice(0, top), total };
}

// 학생의 응시 회차 점수 수집 (결시 제외)
function getStudentScores(sid) {
  const arr = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (!rd || isAbsent(rd)) continue;
    const n = Number(rd.score);
    if (!isNaN(n) && rd.score !== '' && rd.score != null) {
      arr.push({ round: r, score: n });
    }
  }
  return arr;
}

// 결시 회차 수
function countAbsent(sid) {
  let c = 0;
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (rd && isAbsent(rd)) c++;
  }
  return c;
}

// 학생 분석 종합
// 반환: { latestScore, firstScore, delta, trend, gap, goalRate, absentCount, category, tags }
function analyzeStudent(sid) {
  const s = getStudent(sid);
  const scores = getStudentScores(sid);
  const absentCount = countAbsent(sid);
  const goal = Number(s.teacherGoal) || Number(s.studentGoal) || null;
  
  if (scores.length === 0) {
    return {
      latestScore: null, firstScore: null, delta: 0, trend: 'none',
      gap: null, goalRate: 0, absentCount, category: 'pending', tags: ['미응시']
    };
  }
  
  const firstScore = scores[0].score;
  const latestScore = scores[scores.length - 1].score;
  const delta = latestScore - firstScore;
  
  // 추세 판단
  let trend;
  if (scores.length < 2) trend = 'neutral';
  else if (delta >= 3) trend = 'up';
  else if (delta <= -3) trend = 'down';
  else trend = 'flat';
  
  // 목표 대비 갭
  const gap = goal != null ? latestScore - goal : null;
  
  // 목표 달성률 (응시 회차 중 목표 도달 비율)
  const goalRate = goal != null ?
    scores.filter(x => x.score >= goal).length / scores.length : 0;
  
  // 4분면 분류 (수만프 난이도 고려: -20점이 위기 기준)
  let category;
  if (gap == null) {
    category = 'no_goal';  // 목표 미설정
  } else if (gap >= -5) {
    category = 'stable';   // 🏆 안정: 목표 ±5 이내 또는 달성
  } else if (gap >= -20) {
    // 목표 -10~-20: 정체 vs 성장
    category = trend === 'up' ? 'growing' : 'idle';
  } else {
    // -20점 이상 미달: 위기 또는 성장(상승 추세는 약간 완화)
    category = (trend === 'up' && delta >= 8) ? 'growing' : 'crisis';
  }
  
  // 자동 태그
  const tags = [];
  if (scores.length >= 3 && trend === 'up' && delta >= 10) tags.push('급상승');
  if (scores.length >= 2 && trend === 'down' && delta <= -7) tags.push('급하락');
  if (absentCount >= 3) tags.push('결시 잦음');
  else if (absentCount >= 2) tags.push('결시 2회');
  if (scores.length >= 3) {
    const max = Math.max(...scores.map(x => x.score));
    const min = Math.min(...scores.map(x => x.score));
    if (max - min >= 25) tags.push('편차 큼');
  }
  if (goal != null && scores.length >= 3 && goalRate === 0) tags.push('목표 0회 달성');
  if (goal != null && scores.length >= 3 && goalRate >= 0.67) tags.push('목표 안정');
  
  return {
    latestScore, firstScore, delta, trend, gap, goalRate, absentCount, category, tags
  };
}

// 우선 관리 대상 추천 (선생님 담당 학생 중)
// 위기 → 결시 잦음 → 정체 순으로 정렬, 최대 N명
function getPriorityStudents(teacher, grade, max) {
  max = max || 5;
  const ts = state.students.filter(s =>
    s.teacher === teacher &&
    (!grade || s.grade === grade) &&
    GRADES.includes(s.grade)
  );
  
  const analyzed = ts.map(s => ({
    student: s,
    analysis: analyzeStudent(s.id)
  }));
  
  // 우선순위 점수 계산
  function priorityScore(a) {
    let score = 0;
    if (a.analysis.category === 'crisis') score += 100;
    else if (a.analysis.category === 'idle') score += 50;
    if (a.analysis.tags.includes('급하락')) score += 30;
    if (a.analysis.tags.includes('결시 잦음')) score += 40;
    if (a.analysis.tags.includes('결시 2회')) score += 15;
    if (a.analysis.tags.includes('목표 0회 달성')) score += 20;
    // 갭이 클수록 (목표 대비 미달이 클수록) 우선순위 ↑
    if (a.analysis.gap != null && a.analysis.gap < -20) {
      score += Math.min(30, Math.abs(a.analysis.gap + 20));
    }
    return score;
  }
  
  return analyzed
    .map(a => ({ ...a, priority: priorityScore(a) }))
    .filter(a => a.priority > 0)
    .sort((a, b) => b.priority - a.priority)
    .slice(0, max);
}

// 우선 관리 대상에 대한 추천 액션 생성
function getRecommendedActions(analysis) {
  const actions = [];
  if (analysis.category === 'crisis') {
    actions.push('개별 면담 필요');
    if (analysis.gap != null && analysis.gap < -25) {
      actions.push('목표 점수 재조정 검토');
    }
  }
  if (analysis.tags.includes('급하락')) {
    actions.push('하락 원인 점검 (난이도/컨디션/학습량)');
  }
  if (analysis.tags.includes('결시 잦음') || analysis.tags.includes('결시 2회')) {
    actions.push('학부모 연락, 출석 이유 확인');
  }
  if (analysis.category === 'idle') {
    actions.push('학습 동기 점검 및 목표 재설정');
  }
  if (analysis.tags.includes('편차 큼')) {
    actions.push('컨디션 관리, 시험 전 멘탈 코칭');
  }
  if (actions.length === 0 && analysis.category === 'crisis') {
    actions.push('학습 방법 재점검');
  }
  return actions;
}

// 선생님 담당 학생들의 공통 약점 단원 (학년별)
// 반환: [{ unit, errorCount, studentCount, students: [...] }]
function getCommonWeakUnits(teacher, grade, topN) {
  topN = topN || 5;
  const ts = state.students.filter(s =>
    s.teacher === teacher && s.grade === grade && GRADES.includes(s.grade)
  );
  
  const unitMap = {};  // unit → { errorCount, students: Set, totalChances }
  
  ts.forEach(s => {
    for (let r = 1; r <= ROUNDS; r++) {
      const rd = getRoundData(s.id, r);
      if (!rd || isAbsent(rd) || !rd.errors) continue;
      const paper = getPaperForStudent(s.grade, r, rd.version);
      if (!paper || !paper.problems) continue;
      
      const errors = parseErrors(rd.errors);
      const seenUnits = new Set();
      errors.forEach(n => {
        const p = paper.problems[n - 1];
        if (!p || !p.unit) return;
        const unit = p.unit;
        if (!unitMap[unit]) {
          unitMap[unit] = { errorCount: 0, students: new Set(), totalProblems: 0 };
        }
        unitMap[unit].errorCount++;
        seenUnits.add(unit);
      });
      seenUnits.forEach(u => unitMap[u].students.add(s.name));
      
      // 단원별 전체 출제 문항 수 (오답률 계산용)
      paper.problems.forEach(p => {
        if (p.unit && unitMap[p.unit]) {
          unitMap[p.unit].totalProblems++;
        }
      });
    }
  });
  
  return Object.entries(unitMap)
    .map(([unit, data]) => ({
      unit,
      errorCount: data.errorCount,
      studentCount: data.students.size,
      students: Array.from(data.students),
      totalProblems: data.totalProblems,
      errorRate: data.totalProblems > 0 ? data.errorCount / data.totalProblems : 0
    }))
    .sort((a, b) => b.errorCount - a.errorCount)
    .slice(0, topN);
}

// ============================================================
// 점수 입력 초안(draft) — 입력 중에는 화면을 다시 그리지 않고
// [저장]을 눌렀을 때 한 번에 반영 + 동기화
// ============================================================
function draftKey(sid, round) { return sid + '|' + round; }
function draftCount() { return Object.keys(ui.scoreDraft || {}).length; }
function hasDrafts() { return draftCount() > 0; }

// 저장된 값 위에 초안을 덮어쓴 '현재 화면 기준' 데이터
function mergedRoundData(sid, round) {
  const stored = getRoundData(sid, round) || {};
  const d = (ui.scoreDraft || {})[draftKey(sid, round)];
  return d ? Object.assign({}, stored, d) : stored;
}

function setDraft(sid, round, patch) {
  if (!ui.scoreDraft) ui.scoreDraft = {};
  const k = draftKey(sid, round);
  ui.scoreDraft[k] = Object.assign({ _sid: sid, _round: round }, ui.scoreDraft[k] || {}, patch);
  updateSaveBar();
}

function discardDrafts() {
  ui.scoreDraft = {};
  updateSaveBar();
}

// 초안을 실제 데이터로 반영 (저장은 한 번만 → Firebase 푸시도 1회)
function commitDrafts() {
  const keys = Object.keys(ui.scoreDraft || {});
  if (!keys.length) return 0;
  keys.forEach(k => {
    const d = ui.scoreDraft[k];
    const sid = d._sid, round = d._round;
    const next = Object.assign({}, getRoundData(sid, round) || {});
    if ('absent' in d) next.absent = d.absent;
    if (next.absent === true) {
      next.score = ''; next.errors = '';
    } else {
      if ('score' in d) next.score = d.score;
      if ('errors' in d) next.errors = d.errors;
      next.absent = false;
    }
    if ('version' in d) next.version = d.version;
    if (!state.scores[sid]) state.scores[sid] = {};
    state.scores[sid]['r' + round] = next;
  });
  ui.scoreDraft = {};
  saveState();
  return keys.length;
}

// 화면 이동·필터 변경 시 자동 저장 (입력 유실 방지)
function commitDraftsBeforeLeaving() {
  const n = commitDrafts();
  if (n > 0) showToast(n + '건 저장되었습니다', 'success');
  return n;
}

function updateSaveBar() {
  const bar = document.getElementById('score-save-bar');
  if (!bar) return;
  const n = draftCount();
  bar.classList.toggle('visible', n > 0);
  const cnt = bar.querySelector('.save-bar-count');
  if (cnt) cnt.textContent = n + '건';
}

function dateStr(d) {

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function activeRoundCount() {
  const eligible = state.students.filter(s => GRADES.includes(s.grade));
  let n = 0;
  for (let r = 1; r <= ROUNDS; r++) {
    const has = eligible.some(s => {
      const rd = getRoundData(s.id, r);
      return rd && ((rd.score != null && rd.score !== '') || isAbsent(rd));
    });
    if (has) n++;
  }
  return n;
}

function getPhaseMessage() {
  const n = activeRoundCount();
  for (const m of PHASE_MESSAGES) if (n <= m.upTo) return m.t;
  return '';
}

// 날짜 기준 인덱스 (모든 선생님이 같은 날 같은 문장을 봅니다)
function dayNumber() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function quotePool() {
  const custom = (state.config && Array.isArray(state.config.quotes))
    ? state.config.quotes.map(x => String(x || '').trim()).filter(Boolean).map(t => ({ t: t, custom: true }))
    : [];
  if (state.config && state.config.quotesOnlyCustom && custom.length) return custom;
  return custom.concat(DAILY_QUOTES);
}

function getDailyQuote(offset) {
  const pool = quotePool();
  if (!pool.length) return null;
  const idx = (dayNumber() + (offset || 0)) % pool.length;
  return pool[idx];
}

// 문구 카드 (점수 입력 화면 상단)

  let offset = 0;

    const q = getDailyQuote(offset);
    textEl.textContent = q ? '“' + q.t + '”' : '';
    byEl.textContent = q && q.by ? '— ' + q.by : '';
    byEl.style.display = q && q.by ? 'block' : 'none';
  }
  paint();

  box.appendChild(el('div', { className: 'quote-head' },
    el('span', { className: 'quote-label' }, '오늘의 문장'),
    el('span', { className: 'quote-date' }, dateStr()),

      onClick: () => { offset++; paint(); }
    }, '↻')
  ));
  box.appendChild(textEl);
  box.appendChild(byEl);
  if (phase) box.appendChild(el('div', { className: 'quote-phase' }, phase));
  return box;
}

// 학년별 현황 카드 (최근 회차 평균 · 변화 · 응시율)
function renderGradeSnapshots(eligible) {
  const box = el('div', { className: 'grade-snap-grid' });
  GRADES.forEach(g => {
    const members = eligible.filter(s => s.grade === g);
    let firstAvg = null, lastAvg = null, lastRound = null, lastRate = null;
    for (let r = 1; r <= ROUNDS; r++) {
      const st = gradeRoundStats(g, r);
      if (st.avg == null) continue;
      if (firstAvg == null) firstAvg = st.avg;
      lastAvg = st.avg; lastRound = r; lastRate = attendanceRate(st);
    }
    const delta = (firstAvg != null && lastAvg != null) ? lastAvg - firstAvg : null;
    const ratePct = lastRate != null ? Math.round(lastRate * 100) : null;

    box.appendChild(el('div', { className: 'grade-snap' },
      el('div', { className: 'grade-snap-head' },
        el('span', { className: 'badge badge-grade-' + g }, g),
        el('span', { className: 'grade-snap-count' }, members.length + '명')
      ),
      el('div', { className: 'grade-snap-avg' },
        lastAvg != null ? fmt(lastAvg) : '—',
        lastAvg != null ? el('span', null, '점') : null
      ),
      delta != null
        ? el('div', {
            className: 'grade-snap-delta',
            style: { color: delta >= 0 ? 'var(--green)' : 'var(--red)' }
          }, (delta >= 0 ? '▲ ' : '▼ ') + Math.abs(delta).toFixed(1) + '점  (1회 대비)')
        : el('div', { className: 'grade-snap-delta', style: { color: 'var(--ink-mute)' } }, '데이터 없음'),
      el('div', { className: 'grade-snap-meta' },
        el('span', null, lastRound ? lastRound + '회 기준' : '미실시'),
        el('span', null, ratePct != null ? '응시율 ' + ratePct + '%' : '—')
      ),
      el('div', { className: 'grade-snap-bar' },
        el('div', { style: { width: (ratePct != null ? ratePct : 0) + '%' } })
      )
    ));
  });
  return box;
}

function renderRoundsProgress(students) {
  const rows = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const total = students.length;
    const taken = students.filter(s => {
      const rd = getRoundData(s.id, r);
      return rd && ((rd.score != null && rd.score !== '') || isAbsent(rd));
    }).length;
    const absent = students.filter(s => isAbsent(getRoundData(s.id, r))).length;
    const pct = total > 0 ? Math.round(taken / total * 100) : 0;
    rows.push(el('div', { style: { padding: '9px 0', borderBottom: '1px solid var(--line)' } },
      el('div', { className: 'flex-between mb-8' },
        el('div', { style: { fontWeight: 700, fontSize: '13px' } }, r + '회'),
        el('div', { className: 'text-sm muted' }, `${taken}/${total}명 (${pct}%)${absent > 0 ? ' · 결시 ' + absent : ''}`)
      ),
      el('div', { style: { height: '7px', background: 'rgba(31,27,20,0.06)', borderRadius: '99px', overflow: 'hidden', boxShadow: 'inset 0 1px 2px rgba(31,27,20,0.05)' } },
        el('div', { style: {
          height: '100%', width: pct + '%', borderRadius: '99px',
          background: pct >= 70 ? 'linear-gradient(90deg, #2f9d5b, #15803d)'
                    : pct >= 30 ? 'linear-gradient(90deg, #c9a468, var(--orange-deep))'
                                : 'linear-gradient(90deg, #d34d68, var(--red))',
          transition: 'width 0.45s cubic-bezier(.2,.7,.3,1)'
        }})
      )
    ));
  }
  return rows;
}

function renderTeacherOverviewTable() {
  const teachers = getAllTeachers();
  if (teachers.length === 0) {
    return el('div', { className: 'empty' }, el('div', { className: 'empty-text' }, '아직 선생님 정보가 없습니다'));
  }

  const headers = ['선생님', '담당', '학년', ...roundLabels()];
  const rows = teachers.map(t => {
    const tStudents = state.students.filter(s => s.teacher === t && GRADES.includes(s.grade));
    if (tStudents.length === 0) return null;
    const grades = Array.from(new Set(tStudents.map(s => s.grade))).sort((x, y) => GRADES.indexOf(x) - GRADES.indexOf(y)).join('+');
    const cells = [];
    for (let r = 1; r <= ROUNDS; r++) {
      const st = teacherRoundStats(t, null, r);
      const rate = attendanceRate(st);
      const level = attendanceLevel(rate);
      cells.push(el('td', { className: 'num ' + scoreClass(st.avg) },
        st.avg != null ? el('div', null,
          el('div', null, fmt(st.avg)),
          rate != null && st.count > 0 ? el('div', {
            style: {
              fontSize: '10px',
              fontWeight: 600,
              marginTop: '2px',
              color: level === 'low' ? '#b91c1c' : level === 'mid' ? '#b45309' : '#047857',
              fontFamily: 'JetBrains Mono, monospace'
            }
          }, `${st.count}/${st.total}`) : null
        ) : '—'));
    }
    return el('tr', null,
      el('td', { style: { fontWeight: 700 } }, t),
      el('td', { className: 'num' }, tStudents.length + '명'),
      el('td', null, el('span', { className: 'badge' }, grades)),
      ...cells
    );
  }).filter(Boolean);

  return el('div', { className: 'table-wrap' },
    el('table', { className: 'dt' },
      el('thead', null, el('tr', null, ...headers.map(h => el('th', null, h)))),
      el('tbody', null, ...rows)
    )
  );
}

function renderSettings() {
  const wrap = el('div');
  // 편집용 임시 사본 (저장을 눌러야 반영)
  const draft = {
    rounds: ROUNDS,

    versions: JSON.parse(JSON.stringify(GRADE_VERSIONS))

  });

  wrap.appendChild(el('div', { className: 'page-header flex-between flex-wrap', style: { gap: '12px' } },
    el('div', null,
      el('div', { className: 'page-title' }, '설정'),
      el('div', { className: 'page-subtitle' }, PROGRAM + ' · 회차 · 응시 학년 · 시험지 버전 구성')
    )
  ));

  // ---------- 1. 회차 수 ----------
  const roundsInput = el('input', {
    className: 'input', type: 'number', min: '1', max: '20',
    style: { width: '110px' }, value: String(draft.rounds),
    onInput: e => { draft.rounds = parseInt(e.target.value, 10) || 1; }
  });

    el('div', { className: 'card-title' }, '① 수만프 회차 수'),

      roundsInput,
      el('div', { className: 'text-sm', style: { color: 'var(--ink-3)' } },
        '회 (기본 8회 · 1~20회). 줄이면 이후 회차 점수는 화면에서 숨겨지며 데이터는 삭제되지 않습니다.')
    )
  ));

  // ---------- 2. 응시 학년 ----------
  const gradeBox = el('div', { className: 'filter-chips' });
  function paintGrades() {
    gradeBox.innerHTML = '';
    SELECTABLE_GRADES.forEach(g => {
      const on = draft.grades.includes(g);
      gradeBox.appendChild(el('button', {
        className: 'chip' + (on ? ' active' : ''),
        onClick: () => {
          if (on) {
            if (draft.grades.length <= 1) { showToast('학년은 최소 1개 이상이어야 합니다.', 'error'); return; }
            draft.grades = draft.grades.filter(x => x !== g);
          } else {
            draft.grades = SELECTABLE_GRADES.filter(x => draft.grades.includes(x) || x === g);
          }
          paintGrades(); paintVersions();
        }
      }, (on ? '✓ ' : '') + g));
    });
  }
  paintGrades();
  wrap.appendChild(el('div', { className: 'card' },
    el('div', { className: 'card-title' }, '② 응시 학년'),

  ));

  // ---------- 3. 학년별 시험지 버전 ----------
  const versionBox = el('div');
  function paintVersions() {
    versionBox.innerHTML = '';
    draft.grades.forEach(g => {
      const list = draft.versions[g] || (draft.versions[g] = ['표준 (V1)']);
      const rows = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } });

// 1학기 백업 JSON → 전학기 점수 / 담당 선생님 이월
function openCarryOverModal() {
  const fileInput = el('input', { type: 'file', accept: '.json', className: 'input' });
  const resultBox = el('div', { className: 'text-sm', style: { marginTop: '12px', color: 'var(--ink-3)' } });
  const opts = { carryTeacher: true, carryPrev: true, source: 'final' };
  let parsed = null;

  function summarize() {
    if (!parsed) return;
    const list = parsed.students || [];
    let match = 0;
    list.forEach(ls => { if (findLocalStudent(ls)) match++; });
    resultBox.innerHTML = '';
    resultBox.appendChild(el('div', null,
      '백업 파일 학생 ', el('strong', null, String(list.length)), '명 · 현재 명단과 이름이 일치하는 학생 ',
      el('strong', null, String(match)), '명'
    ));
    if (!state.students.length) {
      resultBox.appendChild(el('div', { style: { marginTop: '6px', color: 'var(--red)' } },
        '※ 현재 학생 명단이 비어 있습니다. 먼저 [학생 관리 > 일괄 가져오기]로 2학기 명단을 등록하세요.'));
    }
  }

  function findLocalStudent(ls) {
    return state.students.find(s => s.name === ls.name && (!ls.school || !s.school || s.school === ls.school));
  }

  fileInput.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        parsed = JSON.parse(reader.result);
        if (!parsed.students) throw new Error('students 없음');
        summarize();
      } catch (err) {
        parsed = null;
        resultBox.textContent = '올바른 수만프 백업 JSON이 아닙니다.';
      }
    };
    reader.readAsText(f);
  };

  openModal({
    title: '1학기 백업에서 이월',
    body: el('div', null,
      el('div', { className: 'text-sm', style: { marginBottom: '10px' } },
        '1학기 앱에서 [백업 내려받기]로 저장한 JSON 파일을 선택하세요.'),
      fileInput,
      el('div', { style: { marginTop: '14px', display: 'flex', flexDirection: 'column', gap: '8px' } },
        el('label', { className: 'flex gap-8', style: { alignItems: 'center' } },
          el('input', { type: 'checkbox', checked: true, onChange: e => { opts.carryPrev = e.target.checked; } }),
          el('span', { className: 'text-sm' }, '1학기 점수를 「전학기 점수」로 채우기')
        ),
        el('label', { className: 'flex gap-8', style: { alignItems: 'center' } },
          el('input', { type: 'checkbox', checked: true, onChange: e => { opts.carryTeacher = e.target.checked; } }),
          el('span', { className: 'text-sm' }, '담당 선생님 배정 이월 (현재 비어 있는 경우에만)')
        )
      ),
      el('div', { className: 'card', style: { marginTop: '12px', padding: '12px' } },
        el('div', { className: 'text-sm', style: { fontWeight: 700, marginBottom: '6px' } }, '전학기 점수로 쓸 값'),
        el('select', {
          className: 'select',
          onChange: e => { opts.source = e.target.value; }
        },
          el('option', { value: 'final' }, '1학기 기말 실제점수 (백업의 finalScore)'),
          el('option', { value: 'prev' }, '1학기 앱에 입력된 전학기(중간) 점수'),
          el('option', { value: 'avg' }, '1학기 수만프 1~8회 평균')
        ),
        el('div', { className: 'text-sm', style: { color: 'var(--ink-3)', marginTop: '6px' } },
          '기말 실제점수가 백업에 없으면 수만프 평균으로 자동 대체합니다.')
      ),
      resultBox,
      el('div', { className: 'modal-actions' },
        el('button', { className: 'btn btn-ghost', onClick: closeModal }, '취소'),
        el('button', {
          className: 'btn btn-orange',
          onClick: () => {
            if (!parsed) { showToast('먼저 백업 파일을 선택하세요.', 'error'); return; }
            let updated = 0, teacherSet = 0;
            (parsed.students || []).forEach(ls => {
              const target = findLocalStudent(ls);
              if (!target) return;
              let value = '';
              if (opts.source === 'final') value = ls.finalScore || ls.examScore || '';
              else if (opts.source === 'prev') value = ls.prevScore || '';
              if (!value || opts.source === 'avg') {
                const sc = (parsed.scores || {})[ls.id] || {};
                const arr = Object.keys(sc).map(k => sc[k]).filter(rd => rd && !rd.absent && rd.score !== '' && rd.score != null)
                  .map(rd => Number(rd.score)).filter(n => !isNaN(n));
                if (arr.length) value = String(Math.round(arr.reduce((a, b) => a + b, 0) / arr.length));
              }
              if (opts.carryPrev && value) { target.prevScore = String(value); updated++; }
              if (opts.carryTeacher && !target.teacher && ls.teacher) { target.teacher = ls.teacher; teacherSet++; }
            });
            saveState();
            closeModal();
            showToast('전학기 점수 ' + updated + '명 · 선생님 배정 ' + teacherSet + '명 이월 완료', 'success');
            render();
          }
        }, '이월 실행')
      )
    )
  });
}

  const s = isNew ? {
    id: 'new_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    name: '', school: '', grade: GRADES[0], teacher: '', version: '',
    prevScore: '', studentGoal: '', teacherGoal: '', teacherPossible: ''
  } : { ...getStudent(studentId) };

  const fields = [
    { key: 'name', label: '학생명 *', type: 'text' },
    { key: 'school', label: '학교', type: 'text' },
    { key: 'grade', label: '학년', type: 'select', options: GRADES },
    { key: 'teacher', label: '담당 선생님', type: 'text', placeholder: '예: 이영운T' },
    { key: 'version', label: '기본 응시 버전', type: 'select', options: [''].concat(getVersionsForGrade(s.grade || GRADES[0])) },
    { divider: '사전 입력 (선택)' },
    { key: 'prevScore', label: '전학기 점수', type: 'text', placeholder: '0~100 또는 X (해당없음)' },
    { key: 'studentGoal', label: '학생 목표 점수', type: 'number', placeholder: '0~100' },
    { key: 'teacherPossible', label: '가능 점수 (강사)', type: 'number', placeholder: '0~100' },
    { key: 'teacherGoal', label: '목표 점수 (강사)', type: 'number', placeholder: '0~100' }
  ];

  openModal({
    title: isNew ? '신규 학생 추가' : `${s.name} 정보 편집`,
    body: () => {
      const form = el('div');
      const inputs = {};
      fields.forEach(f => {
        if (f.divider) {
          form.appendChild(el('div', {
            style: { marginTop: '14px', marginBottom: '10px', fontSize: '12px', fontWeight: 700, color: 'var(--orange-deep)', borderTop: '1px solid var(--line)', paddingTop: '14px' }
          }, '── ' + f.divider + ' ──'));
          return;
        }
        let input;
        if (f.type === 'select') {
          input = el('select', { className: 'select' },
            ...f.options.map(o => el('option', { value: o, selected: s[f.key] === o }, o))
          );
        } else {
          input = el('input', {
            className: 'input', type: f.type,

            placeholder: f.placeholder || ''
          });
        }
        inputs[f.key] = input;
        form.appendChild(el('div', { className: 'form-row' },
          el('div', { className: 'form-label' }, f.label), input
        ));
      });

      form.appendChild(el('div', { className: 'modal-actions' },
        el('button', { className: 'btn btn-ghost', onClick: closeModal }, '취소'),

          Object.keys(inputs).forEach(k => { s[k] = inputs[k].value; });
          if (!s.name) { showToast('학생명을 입력하세요', 'error'); return; }
          if (isNew) state.students.push(s);
          else {
            const idx = state.students.findIndex(x => x.id === studentId);
            if (idx >= 0) state.students[idx] = s;
          }
          saveState();
          closeModal();
          render();
          showToast(isNew ? '학생 추가 완료' : '수정 완료');
        }}, '저장')
      ));
      return form;
    }
  });
}

function openBulkImportModal() {
  // 엑셀/CSV 열 이름 → 표준 필드
  const FIELD_ALIASES = {
    grade: ['학년', 'grade'],
    name: ['학생', '이름', '학생명', '성명', '학생 이름', 'name'],
    school: ['학교', '학교명', 'school'],
    teacher: ['선생님', '담당', '담당선생님', '담당T', 'teacher'],
    prevScore: ['전학기점수', '전학기', '1학기점수', '지난점수', '이전점수', '기말점수', 'prevscore'],
    studentGoal: ['학생목표', '목표점수', '학생목표점수', 'studentgoal'],
    teacherGoal: ['선생님목표', '교사목표', '선생님목표점수', 'teachergoal'],
    teacherPossible: ['가능점수', '예상점수', '선생님가능점수', 'teacherpossible'],
    version: ['버전', '응시버전', '시험지', 'version']
  };
  function normKey(h) { return String(h == null ? '' : h).replace(/\s|·|\(|\)|\.|_/g, '').toLowerCase(); }
  function mapHeaders(headers) {
    const map = {};
    const used = {};
    const keys = headers.map(normKey);
    // 1차: 정확히 일치하는 열 이름 우선 (학생 vs 학생목표 혼동 방지)
    Object.keys(FIELD_ALIASES).forEach(field => {
      keys.forEach((k, i) => {
        if (!k || used[i] || map[field] != null) return;
        if (FIELD_ALIASES[field].some(a => k === normKey(a))) { map[field] = i; used[i] = true; }
      });
    });
    // 2차: 부분 일치 (담당 선생님 → teacher 등)
    Object.keys(FIELD_ALIASES).forEach(field => {
      keys.forEach((k, i) => {
        if (!k || used[i] || map[field] != null) return;
        if (FIELD_ALIASES[field].some(a => k.includes(normKey(a)))) { map[field] = i; used[i] = true; }
      });
    });
    return map;
  }

  let rows = null;      // [{grade,name,...}]
  let sourceName = '';
  const preview = el('div', { className: 'text-sm', style: { marginTop: '12px' } });
  const ta = el('textarea', { className: 'textarea', rows: 7, placeholder: '학년,학생명,학교,선생님,전학기점수,학생목표,선생님목표,가능점수\n중1,홍길동,서울중,이영운T,82,95,90,88' });

  function buildRows(matrix) {
    if (!matrix || matrix.length < 2) return [];
    const map = mapHeaders(matrix[0]);
    if (map.name == null) return null;   // 헤더 인식 실패
    const out = [];
    for (let i = 1; i < matrix.length; i++) {
      const r = matrix[i] || [];
      const get = f => (map[f] == null ? '' : String(r[map[f]] == null ? '' : r[map[f]]).trim());
      const name = get('name');
      if (!name) continue;
      out.push({
        grade: normalizeGrade(get('grade')) || get('grade'),
        name: name, school: get('school'), teacher: get('teacher'),
        prevScore: get('prevScore'), studentGoal: get('studentGoal'),
        teacherGoal: get('teacherGoal'), teacherPossible: get('teacherPossible'),
        version: get('version')
      });
    }
    return out;
  }

  function paintPreview() {
    preview.innerHTML = '';
    if (rows === null) {
      preview.appendChild(el('div', { style: { color: 'var(--red)' } },
        '열 이름을 인식하지 못했습니다. 첫 줄에 「학년 · 이름 · 학교 · 선생님」 같은 열 제목이 있어야 합니다.'));
      return;
    }
    if (!rows.length) { preview.appendChild(el('div', null, '가져올 학생이 없습니다.')); return; }
    const bad = rows.filter(r => !GRADES.includes(r.grade));
    const counts = {};
    rows.forEach(r => { counts[r.grade] = (counts[r.grade] || 0) + 1; });
    preview.appendChild(el('div', null,
      (sourceName ? sourceName + ' · ' : ''), el('strong', null, String(rows.length)), '명 인식 — ',
      Object.keys(counts).map(g => g + ' ' + counts[g] + '명').join(' · ')
    ));
    if (bad.length) {
      preview.appendChild(el('div', { style: { color: 'var(--red)', marginTop: '6px' } },
        '※ 설정에 없는 학년 ' + bad.length + '명은 제외됩니다 (' +
        Array.from(new Set(bad.map(b => b.grade || '(빈칸)'))).join(', ') + '). 필요하면 [설정 > 응시 학년]에서 학년을 추가하세요.'));
    }
    preview.appendChild(el('div', { style: { marginTop: '6px', color: 'var(--ink-3)' } },
      '미리보기: ' + rows.slice(0, 5).map(r => r.grade + ' ' + r.name).join(' / ') + (rows.length > 5 ? ' …' : '')));
  }

  const fileInput = el('input', { type: 'file', accept: '.xlsx,.xls,.csv', className: 'input' });
  fileInput.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    sourceName = f.name;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        if (typeof XLSX === 'undefined') {
          rows = null;
          preview.innerHTML = '';
          preview.appendChild(el('div', { style: { color: 'var(--red)' } },
            '엑셀 모듈을 불러오지 못했습니다(인터넷 연결 확인). 아래 CSV 붙여넣기를 이용해 주세요.'));
          return;
        }
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
        let all = [];
        wb.SheetNames.forEach(sn => {
          const matrix = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '' });
          const parsedRows = buildRows(matrix);
          if (parsedRows && parsedRows.length) all = all.concat(parsedRows);
        });
        rows = all.length ? all : null;
      } catch (err) {
        console.error(err); rows = null;
      }
      paintPreview();
    };
    reader.readAsArrayBuffer(f);
  };

  ta.oninput = () => {
    const text = ta.value.trim();
    if (!text) { rows = []; preview.innerHTML = ''; return; }
    sourceName = '';
    const matrix = text.split('\n').map(l => l.split(/[,\t]/).map(c => c.trim()));
    rows = buildRows(matrix);
    paintPreview();
  };

  openModal({
    title: '학생 일괄 가져오기',
    size: 'lg',
    body: () => el('div', null,
      el('div', { className: 'notice' },
        el('strong', null, '엑셀 업로드'), ' — 첫 줄이 열 제목인 .xlsx / .xls / .csv 파일을 올리세요. 여러 시트도 함께 읽습니다.',
        el('br'),
        el('strong', null, '인식하는 열'), ' 학년 · 이름(학생명) · 학교 · 선생님 · 전학기점수 · 학생목표 · 선생님목표 · 가능점수 · 버전 (순서 무관, 없는 열은 비워둠)'
      ),
      fileInput,
      el('div', { className: 'text-sm', style: { margin: '14px 0 6px', fontWeight: 700 } }, '또는 직접 붙여넣기 (CSV)'),
      ta,
      preview,
      el('div', { className: 'modal-actions' },
        el('button', { className: 'btn btn-ghost', onClick: closeModal }, '취소'),
        el('button', { className: 'btn btn-orange', onClick: () => {
          if (!rows || !rows.length) { showToast('가져올 학생이 없습니다.', 'error'); return; }
          let added = 0, skipped = 0, dup = 0;
          rows.forEach(r => {
            if (!GRADES.includes(r.grade) || !r.name) { skipped++; return; }
            if (state.students.some(s => s.name === r.name && s.grade === r.grade && (s.school || '') === (r.school || ''))) { dup++; return; }
            state.students.push({
              id: 'stu_' + Date.now() + '_' + (added++),
              name: r.name, school: r.school || '', grade: r.grade, teacher: r.teacher || '',
              version: r.version || '',
              prevScore: r.prevScore || '', studentGoal: r.studentGoal || '',
              teacherGoal: r.teacherGoal || '', teacherPossible: r.teacherPossible || ''
            });
          });
          saveState();
          closeModal();
          render();
          showToast(added + '명 추가 · 중복 ' + dup + '명 · 제외 ' + skipped + '명', 'success');
        }}, '가져오기')
      )
    )
  });
}

function openPreInputModal() {
  // 학년/선생님으로 필터된 학생들의 사전 입력값을 한꺼번에 입력
  openModal({
    title: '📝 사전 입력 일괄 편집',
    size: 'lg',
    body: () => {
      const gradeFilter = el('select', { className: 'select', style: { width: '110px' } },
        el('option', { value: 'all' }, '전체'),
        ...GRADES.map(g => el('option', { value: g }, g))
      );
      const teacherFilter = el('select', { className: 'select', style: { width: '140px' } },
        el('option', { value: 'all' }, '전체 선생님'),
        ...getAllTeachers().map(t => el('option', { value: t }, t))
      );
      const list = el('div', { className: 'mt-12', style: { maxHeight: '450px', overflowY: 'auto' } });
      const inputs = new Map();

      function renderList() {
        list.innerHTML = '';
        const filtered = state.students.filter(s => {
          if (!GRADES.includes(s.grade)) return false;
          if (gradeFilter.value !== 'all' && s.grade !== gradeFilter.value) return false;
          if (teacherFilter.value !== 'all' && s.teacher !== teacherFilter.value) return false;
          return true;
        });

        const header = el('div', { style: { display: 'grid', gridTemplateColumns: '40px 1fr 90px 70px 70px 70px 70px', gap: '8px', padding: '8px 12px', background: 'var(--bg-elevated)', borderRadius: 'var(--radius)', fontSize: '11.5px', fontWeight: 700, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.5px' } },
          el('div', null, '학년'), el('div', null, '학생'), el('div', null, '선생님'),
          el('div', null, '전학기'), el('div', null, '학생목표'), el('div', null, '강사가능'), el('div', null, '강사목표')
        );
        list.appendChild(header);

        filtered.forEach(s => {
          const ps = el('input', { className: 'input', type: 'text', value: s.prevScore || '', style: { padding: '5px 8px', fontSize: '12.5px' } });
          const sg = el('input', { className: 'input', type: 'number', value: s.studentGoal || '', style: { padding: '5px 8px', fontSize: '12.5px' } });
          const tp = el('input', { className: 'input', type: 'number', value: s.teacherPossible || '', style: { padding: '5px 8px', fontSize: '12.5px' } });
          const tg = el('input', { className: 'input', type: 'number', value: s.teacherGoal || '', style: { padding: '5px 8px', fontSize: '12.5px' } });
          inputs.set(s.id, { prevScore: ps, studentGoal: sg, teacherPossible: tp, teacherGoal: tg });

          list.appendChild(el('div', {
            style: { display: 'grid', gridTemplateColumns: '40px 1fr 90px 70px 70px 70px 70px', gap: '8px', padding: '6px 12px', borderBottom: '1px solid var(--line)', alignItems: 'center' }
          },
            el('span', { className: 'badge badge-grade-' + s.grade }, s.grade),
            el('div', { style: { fontWeight: 600 } }, s.name, el('div', { className: 'text-sm muted' }, s.school || '')),
            el('div', { className: 'text-sm' }, s.teacher || '—'),
            ps, sg, tp, tg
          ));
        });
        if (filtered.length === 0) list.appendChild(el('div', { className: 'empty muted' }, '해당 조건의 학생이 없습니다'));
      }

      gradeFilter.addEventListener('change', renderList);
      teacherFilter.addEventListener('change', renderList);
      renderList();

      return el('div', null,
        el('div', { className: 'flex gap-12 mb-12' },
          el('div', { className: 'flex gap-8 flex-wrap' }, el('span', { className: 'filter-label' }, '필터'), gradeFilter, teacherFilter)
        ),
        list,
        el('div', { className: 'modal-actions' },
          el('button', { className: 'btn btn-ghost', onClick: closeModal }, '취소'),
          el('button', { className: 'btn btn-orange', onClick: () => {
            let updated = 0;
            inputs.forEach((fields, sid) => {
              const s = getStudent(sid);
              if (!s) return;
              let changed = false;
              Object.keys(fields).forEach(k => {
                if (s[k] !== fields[k].value) { s[k] = fields[k].value; changed = true; }
              });
              if (changed) updated++;
            });
            saveState();
            closeModal();
            render();
            showToast(`${updated}명 사전 입력 저장`);
          }}, '💾 일괄 저장')
        )
      );
    }
  });
}

function renderScoreTable(students, round) {
  // 모든 학년이 버전을 가지므로 항상 버전 컬럼 표시
  const headerColumns = ['학년', '학생/학교', '담당', '점수', '결시', '버전', '오답 문항'];
  const headerGrid = '56px 1fr 100px 90px 80px 180px 1fr';

  const header = el('div', { className: 'score-row header', style: { gridTemplateColumns: headerGrid } },
    ...headerColumns.map(c => el('div', null, c))
  );

  const rows = students.map(s => {
    const rd = mergedRoundData(s.id, round);
    let absent = isAbsent(rd);

    const row = el('div', { className: 'score-row' + (absent ? ' is-absent' : ''), style: { gridTemplateColumns: headerGrid } });

    const scoreInput = el('input', {
      className: 'score-input' + (absent ? ' absent' : ''),
      type: 'number',
      step: '0.1', min: '0', max: '100',
      value: absent ? '' : (rd.score != null ? rd.score : ''),
      disabled: absent,
      placeholder: absent ? '결시' : '점수',
      // 입력 중에는 화면을 다시 그리지 않고 초안에만 담아둔다
      onInput: e => { setDraft(s.id, round, { score: e.target.value }); markRowDirty(row); }
    });
    // Enter → 다음 학생 점수 칸으로 이동 (연속 입력 편의)
    scoreInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const all = Array.from(document.querySelectorAll('.score-input:not([disabled])'));
        const i = all.indexOf(e.target);
        if (i >= 0 && all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); }
        else e.target.blur();
      }
    });

    const errorsInput = el('input', {
      className: 'errors-input',
      type: 'text',
      value: rd.errors || '',
      disabled: absent,
      placeholder: '예: 5,12,18',
      onInput: e => { setDraft(s.id, round, { errors: e.target.value }); markRowDirty(row); }
    });

    const absentBtn = el('button', {
      className: 'absent-toggle' + (absent ? ' on' : ''),
      onClick: () => {
        absent = !absent;
        setDraft(s.id, round, absent ? { absent: true, score: '', errors: '' } : { absent: false });
        // 화면 전체를 다시 그리지 않고 이 줄만 갱신
        absentBtn.className = 'absent-toggle' + (absent ? ' on' : '');
        absentBtn.textContent = absent ? '✓ 결시' : '결시';
        row.classList.toggle('is-absent', absent);
        [scoreInput, errorsInput].forEach(inp => {
          inp.disabled = absent;
          if (absent) inp.value = '';
        });
        scoreInput.classList.toggle('absent', absent);
        scoreInput.placeholder = absent ? '결시' : '점수';
        markRowDirty(row);
      }
    }, absent ? '✓ 결시' : '결시');

    // 학년별 버전 옵션 (학생 기본 버전 → 회차 버전 미지정 시 자동 적용)
    const versions = getVersionsForGrade(s.grade);
    const curVersion = rd.version || (versions.includes(s.version) ? s.version : '');
    const versionSelect = el('select', {
      className: 'version-select',
      value: curVersion,
      onChange: e => { setDraft(s.id, round, { version: e.target.value }); markRowDirty(row); }
    },
      el('option', { value: '' }, '버전 선택...'),
      ...versions.map(v => el('option', { value: v, selected: curVersion === v }, v))
    );

    [
      el('div', null, el('span', { className: 'badge badge-grade-' + s.grade }, s.grade)),
      el('div', null,
        el('div', { style: { fontWeight: 600 } }, s.name),
        el('div', { className: 'text-sm muted' }, s.school || '')
      ),
      el('div', { className: 'text-sm', style: { fontWeight: 600 } }, s.teacher || '—'),
      scoreInput,
      absentBtn,
      versionSelect,
      errorsInput
    ].forEach(node => row.appendChild(node));

    if ((ui.scoreDraft || {})[draftKey(s.id, round)]) row.classList.add('dirty');
    return row;
  });

  return el('div', { className: 'score-grid' }, header, ...rows);
}

// 아직 저장되지 않은 줄 표시
function markRowDirty(row) { row.classList.add('dirty'); }

function renderGradeStatsTab() {
  const container = el('div');

  // 학년별 회차 통계 종합표 (평균/최고/최저/인원)
