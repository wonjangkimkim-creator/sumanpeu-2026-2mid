function renderScoreTable(students, round) {
  // 모든 학년이 버전을 가지므로 항상 버전 컬럼 표시
  const headerColumns = ['학년', '학생/학교', '담당', '점수', '결시', '버전', '오답 문항'];
  const headerGrid = '56px 1fr 100px 90px 80px 180px 1fr';

  const header = el('div', { className: 'score-row header', style: { gridTemplateColumns: headerGrid } },
    ...headerColumns.map(c => el('div', null, c))
  );

  const rows = students.map(s => {
    const rd = mergedRoundData(s.id, round);
    let absent = isAbsent(rd);

    const row = el('div', { className: 'score-row' + (absent ? ' is-absent' : ''), style: { gridTemplateColumns: headerGrid } });

    const scoreInput = el('input', {
      className: 'score-input' + (absent ? ' absent' : ''),
      type: 'number',
      step: '0.1', min: '0', max: '100',
      value: absent ? '' : (rd.score != null ? rd.score : ''),
      disabled: absent,
      placeholder: absent ? '결시' : '점수',
      // 입력 중에는 화면을 다시 그리지 않고 초안에만 담아둔다
      onInput: e => { setDraft(s.id, round, { score: e.target.value }); markRowDirty(row); }
    });
    // Enter → 다음 학생 점수 칸으로 이동 (연속 입력 편의)
    scoreInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const all = Array.from(document.querySelectorAll('.score-input:not([disabled])'));
        const i = all.indexOf(e.target);
        if (i >= 0 && all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); }
        else e.target.blur();
      }
    });

    const errorsInput = el('input', {
      className: 'errors-input',
      type: 'text',
      value: rd.errors || '',
      disabled: absent,
      placeholder: '예: 5,12,18',
      onInput: e => { setDraft(s.id, round, { errors: e.target.value }); markRowDirty(row); }
    });

    const absentBtn = el('button', {
      className: 'absent-toggle' + (absent ? ' on' : ''),
      onClick: () => {
        absent = !absent;
        setDraft(s.id, round, absent ? { absent: true, score: '', errors: '' } : { absent: false });
        // 화면 전체를 다시 그리지 않고 이 줄만 갱신
        absentBtn.className = 'absent-toggle' + (absent ? ' on' : '');
        absentBtn.textContent = absent ? '✓ 결시' : '결시';
        row.classList.toggle('is-absent', absent);
        [scoreInput, errorsInput].forEach(inp => {
          inp.disabled = absent;
          if (absent) inp.value = '';
        });
        scoreInput.classList.toggle('absent', absent);
        scoreInput.placeholder = absent ? '결시' : '점수';
        markRowDirty(row);
      }
    }, absent ? '✓ 결시' : '결시');

    // 학년별 버전 옵션 (학생 기본 버전 → 회차 버전 미지정 시 자동 적용)
    const versions = getVersionsForGrade(s.grade);
    const curVersion = rd.version || (versions.includes(s.version) ? s.version : '');
    const versionSelect = el('select', {
      className: 'version-select',
      value: curVersion,
      onChange: e => { setDraft(s.id, round, { version: e.target.value }); markRowDirty(row); }
    },
      el('option', { value: '' }, '버전 선택...'),
      ...versions.map(v => el('option', { value: v, selected: curVersion === v }, v))
    );

    [
      el('div', null, el('span', { className: 'badge badge-grade-' + s.grade }, s.grade)),
      el('div', null,
        el('div', { style: { fontWeight: 600 } }, s.name),
        el('div', { className: 'text-sm muted' }, s.school || '')
      ),
      el('div', { className: 'text-sm', style: { fontWeight: 600 } }, s.teacher || '—'),
      scoreInput,
      absentBtn,
      versionSelect,
      errorsInput
    ].forEach(node => row.appendChild(node));

    if ((ui.scoreDraft || {})[draftKey(s.id, round)]) row.classList.add('dirty');
    return row;
  });

  return el('div', { className: 'score-grid' }, header, ...rows);
}

// 아직 저장되지 않은 줄 표시

function renderGradeStatsTab() {
  const container = el('div');

  // 학년별 회차 통계 종합표 (평균/최고/최저/인원)

  }
  const subHeader = el('tr', null, el('th', null, ''));
  for (let r = 1; r <= ROUNDS; r++) {
    ['평균','최고','최저','응시'].forEach((label, i) =>
      subHeader.appendChild(el('th', i === 0 ? { style: { borderLeft: '2px solid var(--line-2)' } } : null, label))
    );
  }

  const body = GRADES.map(g => {
    const cells = [el('td', null, el('span', { className: 'badge badge-grade-' + g }, g))];
    for (let r = 1; r <= ROUNDS; r++) {
      const st = gradeRoundStats(g, r);
      const rate = attendanceRate(st);

      cells.push(el('td', { className: 'num ' + scoreClass(st.avg), style: { borderLeft: '2px solid var(--line-2)' } }, st.avg != null ? fmt(st.avg) : '—'));
      cells.push(el('td', { className: 'num' }, st.max != null ? fmt(st.max, 0) : '—'));
      cells.push(el('td', { className: 'num' }, st.min != null ? fmt(st.min, 0) : '—'));
      cells.push(el('td', { className: 'num' }, 
        rate != null && st.count > 0 ?
          el('span', { className: 'attendance-badge ' + level },
            `${st.count}/${st.total}`,
            ` · ${Math.round(rate * 100)}%`
          ) :
          el('span', { className: 'muted' }, '—')
      ));
    }
    return el('tr', null, ...cells);
  });

  container.appendChild(el('div', { className: 'table-wrap mb-18' },
    el('table', { className: 'dt' },
      el('thead', null, header, subHeader),
      el('tbody', null, ...body)
    )

    el('div', { className: 'grid grid-2' },
      ...GRADES.map(g => el('div', null,
        el('div', { style: { fontWeight: 700, marginBottom: '8px', fontSize: '14px' } },
          el('span', { className: 'badge badge-grade-' + g, style: { marginRight: '6px' } }, g)
        ),
        el('div', { className: 'chart-box sm' }, el('canvas', { id: 'grade-ch-' + g }))
      ))
    )
  ));

  setTimeout(() => GRADES.forEach(g => renderGradeChart(g)), 60);
  return container;
}

function renderGradeChart(grade) {
  const ctx = $('#grade-ch-' + grade);
  if (!ctx || typeof Chart === 'undefined') return;
  if (_charts['g_' + grade]) _charts['g_' + grade].destroy();

  const avgs = [], mins = [], maxs = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const st = gradeRoundStats(grade, r);
    avgs.push(st.avg); mins.push(st.min); maxs.push(st.max);
  }

  // 그라데이션 (평균선)
  const chartCtx = ctx.getContext('2d');

          el('span', { style: { fontSize: '17px', fontWeight: 800, fontFamily: 'Noto Serif KR, serif' } }, t),

    const compareTbl = el('div', { className: 'table-wrap mb-12' },
      el('table', { className: 'dt' },
        el('thead', null,
          el('tr', null,
            el('th', null, '학년'),
            ...roundLabels().map(lb => el('th', null, lb))
          )
        ),
        el('tbody', null,
          ...teacherGrades.map(g => {
            const cells = [el('td', null, el('span', { className: 'badge badge-grade-' + g }, g))];
            for (let r = 1; r <= ROUNDS; r++) {
              const tSt = teacherRoundStats(t, g, r);

                      className: diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-flat',

                    rate != null ? el('div', {

                        fontSize: '10px',
                        marginTop: '2px',

                        fontWeight: 700,

    card.appendChild(compareTbl);

function renderTeacherGradeSection(teacher, grade, students) {
  const section = el('div', { className: 'card mb-18' },
    el('div', { className: 'card-title' },
      el('div', { className: 'card-title-accent' }),
      el('span', { className: 'badge badge-grade-' + grade, style: { marginRight: '8px' } }, grade),
      `${grade} 담당 (${students.length}명)`
    )
  );

  // ============================================================
  // 1. 우선 관리 대상 추천 (가장 위, 가장 중요)
  // ============================================================
  const priority = getPriorityStudents(teacher, grade, 5);
  if (priority.length > 0) {
    const priorityBox = el('div', { className: 'priority-box mb-18' },
      el('div', { className: 'priority-header' },
        el('span', { className: 'priority-icon' }, '🎯'),
        el('div', { className: 'priority-title' }, '다음 회차 우선 관리 대상'),
        el('div', { className: 'priority-sub' }, `${priority.length}명 추천`)
      )
    );
    
    priority.forEach((item, idx) => {
      const { student, analysis } = item;
      const cat = STUDENT_CATEGORIES[analysis.category] || STUDENT_CATEGORIES.pending;
      const actions = getRecommendedActions(analysis);
      
      // 학생 상태 요약 문구
      let summary = '';
      if (analysis.latestScore != null) {
        summary = `최근 ${fmt(analysis.latestScore, 0)}점`;
        if (analysis.gap != null) {
          summary += analysis.gap >= 0 ? ` (목표 +${fmt(analysis.gap, 0)})` : ` (목표 ${fmt(analysis.gap, 0)})`;
        }
        if (analysis.delta !== 0 && analysis.firstScore != null) {
          summary += ` · 첫 응시 대비 ${analysis.delta >= 0 ? '▲' : '▼'}${Math.abs(analysis.delta).toFixed(0)}점`;
        }
      }
      
      priorityBox.appendChild(el('div', { className: 'priority-item' },
        el('div', { className: 'priority-num' }, idx + 1),
        el('div', { className: 'priority-content' },
          el('div', { className: 'priority-name-row' },
            el('div', { className: 'priority-name' }, student.name,
              el('span', { className: 'priority-school' }, ` · ${student.school || ''}`)
            ),
            el('span', { className: 'priority-badge', style: { background: cat.color + '18', color: cat.color, border: '1px solid ' + cat.color + '40' } },
              cat.icon + ' ' + cat.label
            ),
            ...analysis.tags.slice(0, 2).map(t => el('span', { className: 'priority-tag' }, t))
          ),
          summary ? el('div', { className: 'priority-summary' }, summary) : null,
          actions.length > 0 ? el('div', { className: 'priority-actions' },
            el('strong', null, '추천: '),
            actions.join(' · ')
          ) : null
        )
      ));
    });
    section.appendChild(priorityBox);
  }

  // ============================================================
  // 2. 공통 약점 단원 (Excel 가져오기로 단원 정보가 있을 때만)
  // ============================================================
  const weakUnits = getCommonWeakUnits(teacher, grade, 5);
  if (weakUnits.length > 0) {
    const weakBox = el('div', { className: 'weak-units-box mb-18' },
      el('div', { className: 'weak-units-header' },
        el('span', { style: { fontSize: '20px' } }, '📚'),
        el('div', { className: 'weak-units-title' }, '우리 반 공통 약점 단원'),
        el('div', { className: 'weak-units-sub' }, '오답 빈도 기준 · 다음 수업에서 보강 권장')
      )
    );
    
    const maxCount = weakUnits[0].errorCount;
    weakUnits.forEach((w, idx) => {
      const pct = (w.errorCount / maxCount) * 100;
      const errorRateText = w.errorRate > 0 ? ` · 오답률 ${Math.round(w.errorRate * 100)}%` : '';
      weakBox.appendChild(el('div', { className: 'weak-unit-row' },
        el('div', { className: 'weak-unit-rank' }, idx + 1),
        el('div', { className: 'weak-unit-info' },
          el('div', { className: 'weak-unit-name' }, w.unit),
          el('div', { className: 'weak-unit-stat' },
            `오답 ${w.errorCount}개 · ${w.studentCount}명${errorRateText}`
          )
        ),
        el('div', { className: 'weak-unit-bar-wrap' },
          el('div', { className: 'weak-unit-bar', style: { width: pct + '%' } })
        )
      ));
    });
    section.appendChild(weakBox);
  }

  // ============================================================
  // 3. 회차별 담당 vs 전체 비교 한 줄 요약 (응시율 포함)
  // ============================================================
  const compareRow = el('div', { className: 'mb-12', style: { padding: '12px', background: 'var(--bg-elevated)', borderRadius: '8px', fontSize: '13px', lineHeight: '1.9' } });
  const summaryItems = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const tSt = teacherRoundStats(teacher, grade, r);
    if (tSt.avg == null) continue;
    const gSt = gradeRoundStats(grade, r);
    const diff = gSt.avg != null ? tSt.avg - gSt.avg : null;
    const diffStr = diff != null ? ` ${diff >= 0 ? '▲' : '▼'}${Math.abs(diff).toFixed(1)}` : '';
    const tRate = attendanceRate(tSt);
    const tLevel = attendanceLevel(tRate);
    const rateColor = tLevel === 'low' ? '#b91c1c' : tLevel === 'mid' ? '#b45309' : '#047857';
    summaryItems.push(el('span', { style: { display: 'inline-block', marginRight: '14px' } },
      el('strong', null, `${r}회: `),
      `${fmt(tSt.avg)}점${diffStr} `,
      el('span', { style: { color: rateColor, fontSize: '11px', fontFamily: 'JetBrains Mono, monospace', fontWeight: 700 } },
        `(${tSt.count}/${tSt.total} · ${Math.round(tRate*100)}%)`
      )
    ));
  }
  if (summaryItems.length > 0) {
    compareRow.appendChild(el('div', { style: { marginBottom: '6px' } },
      el('strong', { style: { color: 'var(--orange-deep)' } }, '📊 회차별 담당 평균 (vs 전체 · 응시율)')
    ));
    summaryItems.forEach(s => compareRow.appendChild(s));
    section.appendChild(compareRow);
  }

  // 학생 상세표
  section.appendChild(renderStudentDetailTable(students, grade));

  // 분석 코멘트
  section.appendChild(renderTeacherGradeComment(teacher, grade, students));

  return section;
}

function renderStudentDetailTable(students, grade) {
  const rows = students.map(s => {
    const analysis = analyzeStudent(s.id);
    const cat = STUDENT_CATEGORIES[analysis.category] || STUDENT_CATEGORIES.pending;
    
    const cells = [];
    // 학생명 + 분류 배지
    cells.push(el('td', null,
      el('div', { style: { fontWeight: 700 } }, s.name),
      el('div', { style: { marginTop: '3px' } },
        el('span', {
          className: 'student-category-badge',
          style: {
            background: cat.color + '15',
            color: cat.color,
            border: '1px solid ' + cat.color + '30'
          },
          title: cat.desc
        }, cat.icon + ' ' + cat.label)
      )
    ));
    cells.push(el('td', null, s.school || '—'));
    cells.push(el('td', { className: 'num muted' }, s.prevScore !== '' && s.prevScore != null ? s.prevScore : '—'));
    
    // 목표 + 진행률 바
    const goal = Number(s.teacherGoal) || Number(s.studentGoal);
    const goalStr = s.studentGoal !== '' && s.studentGoal != null ? s.studentGoal : '—';
    let goalCell;
    if (isNaN(goal) || analysis.latestScore == null || goal <= 0) {
      goalCell = el('td', { className: 'num' }, goalStr);
    } else {
      // 진행률 = 현재 점수 / 목표 점수 (직관적 비율)
      const rawPct = (analysis.latestScore / goal) * 100;
      const pct = Math.max(0, Math.min(100, rawPct));  // 표시용 (바 너비)
      const displayPct = Math.round(rawPct);  // 텍스트 표시용 (100% 초과도 보여줌)
      // 색상: 100% 이상 녹색(목표 달성), 80% 이상 노랑(근접), 미만 빨강
      const barColor = rawPct >= 100 ? '#16a34a' : rawPct >= 80 ? '#f59e0b' : '#dc2626';
      goalCell = el('td', { className: 'num', style: { minWidth: '110px' } },
        el('div', { style: { fontSize: '12px', marginBottom: '3px' } }, goalStr + '점'),
        el('div', { className: 'goal-progress-bar' },
          el('div', {
            className: 'goal-progress-fill',
            style: {
              width: pct + '%',
              background: barColor
            }
          })
        ),
        el('div', { style: { fontSize: '10px', color: barColor, fontWeight: 700, marginTop: '2px', fontFamily: 'JetBrains Mono, monospace' } },
          displayPct + '%' + (rawPct >= 100 ? ' ✓' : '')
        )
      );
    }
    cells.push(goalCell);

    for (let r = 1; r <= ROUNDS; r++) {
      const rd = getRoundData(s.id, r);
      if (!rd) { cells.push(el('td', { className: 'muted' }, '—')); continue; }
      if (isAbsent(rd)) { cells.push(el('td', { className: 'absent' }, '결시')); continue; }
      const sc = Number(rd.score);
      if (isNaN(sc)) { cells.push(el('td', null, '—')); continue; }
      cells.push(el('td', { className: 'num ' + scoreClass(sc) }, fmt(sc)));
    }

    // 추세
    if (analysis.firstScore != null && analysis.latestScore != null) {
      const trend = analysis.delta;
      cells.push(el('td', { className: 'num ' + (trend > 0 ? 'delta-up' : trend < 0 ? 'delta-down' : 'delta-flat') },
        (trend > 0 ? '▲' : trend < 0 ? '▼' : '—') + Math.abs(trend).toFixed(1)
      ));
    } else {
      cells.push(el('td', { className: 'muted' }, '—'));
    }
    return el('tr', null, ...cells);
  });

  return el('div', { className: 'table-wrap mb-12' },
    el('table', { className: 'dt' },
      el('thead', null,
        el('tr', null,
          el('th', null, '학생명'), el('th', null, '학교'), el('th', null, '직전'),
          el('th', null, '목표'),
          ...roundLabels().map(lb => el('th', null, lb)),
          el('th', null, '추세')
        )
      ),
      el('tbody', null, ...rows)
    )
  );
}

function renderTeacherGradeComment(teacher, grade, students) {
  const lines = [];

  // 회차별 평균 변화 분석
  const tAvgs = [], gAvgs = [];
  for (let r = 1; r <= ROUNDS; r++) {
    tAvgs.push(teacherRoundStats(teacher, grade, r).avg);
    gAvgs.push(gradeRoundStats(grade, r).avg);
  }

  // 첫 회차 비교
  if (tAvgs[0] != null && gAvgs[0] != null) {
    const diff = tAvgs[0] - gAvgs[0];
    lines.push(`📊 1회 담당 평균 ${fmt(tAvgs[0])}점 — 학년 전체(${fmt(gAvgs[0])}점) 대비 ${diff >= 0 ? '+' : ''}${fmt(diff)}점`);
  }

  // 추세 분석 (n회 → n+1회)
  for (let r = 1; r < ROUNDS; r++) {
    if (tAvgs[r-1] != null && tAvgs[r] != null) {
      const d = tAvgs[r] - tAvgs[r-1];
      const arrow = d >= 0 ? '📈' : '📉';
      lines.push(`${arrow} ${r}→${r+1}회 담당 평균 변화: ${d >= 0 ? '+' : ''}${fmt(d)}점`);
    }
  }

  // 목표 달성률 (1회)
  const goalSet = students.filter(s => s.studentGoal && !isNaN(Number(s.studentGoal)));
  if (goalSet.length > 0) {
    const r1Achieved = goalSet.filter(s => {
      const sc = getScore(getRoundData(s.id, 1));
      return sc != null && sc >= Number(s.studentGoal);
    }).length;
    lines.push(`🎯 1회 목표 달성: ${r1Achieved}/${goalSet.length}명 (${Math.round(r1Achieved/goalSet.length*100)}%)`);
  }

  // 상승/하락 학생
  const movers = students.map(s => {
    let first = null, last = null;
    for (let r = 1; r <= ROUNDS; r++) {
      const sc = getScore(getRoundData(s.id, r));
      if (sc == null) continue;
      if (first == null) first = sc;
      last = sc;
    }
    if (first == null || last == null) return null;
    return { name: s.name, diff: last - first };
  }).filter(Boolean);

  const upMovers = movers.filter(m => m.diff >= 10).sort((a,b) => b.diff - a.diff).slice(0, 3);
  const downMovers = movers.filter(m => m.diff <= -10).sort((a,b) => a.diff - b.diff).slice(0, 3);
  if (upMovers.length > 0) lines.push(`📈 상승 학생: ${upMovers.map(m => `${m.name} (+${m.diff.toFixed(1)})`).join(', ')}`);
  if (downMovers.length > 0) lines.push(`📉 하락 학생: ${downMovers.map(m => `${m.name} (${m.diff.toFixed(1)})`).join(', ')} — 추가 점검 권장`);

  // 공통 오답 TOP 3 (1회 기준)
  const w1 = commonWrongs(grade, 1, 3);
  if (w1.entries.length > 0) {
    lines.push(`🔴 1회 공통 오답 TOP3: ${w1.entries.map(([n,c]) => `${n}번(${c}/${w1.total}명)`).join(', ')}`);
  }

  // 종합 코멘트
  const overallAvg = avg(tAvgs);
  if (overallAvg != null) {
    if (overallAvg >= 80) lines.push('💬 전반적으로 우수한 수준입니다. 목표 달성률 향상에 집중하세요.');
    else if (overallAvg >= 65) lines.push('💬 안정적인 수준입니다. 약점 보완으로 한 단계 상승 가능합니다.');
    else lines.push('💬 기초 보강이 필요합니다. 공통 오답 유형 집중 학습을 권장합니다.');
  }

  return el('div', {
    style: {
      background: 'var(--orange-soft)',
      border: '1px solid var(--line-2)',
      borderLeft: '3px solid var(--orange-deep)',
      borderRadius: '8px',
      padding: '14px 16px',
      fontSize: '13px',
      lineHeight: '1.9'
    }
  },
    el('div', { style: { fontWeight: 700, color: 'var(--orange-deep)', marginBottom: '8px', fontFamily: 'Noto Serif KR, serif', fontSize: '14px' } }, '💬 종합 분석'),
    ...lines.map(l => el('div', null, l))
  );
}

function exportTeacherReport(teacher) {
  if (!teacher) return;
  const wb = XLSX.utils.book_new();
  const ts = state.students.filter(s => s.teacher === teacher && GRADES.includes(s.grade));
  const grades = Array.from(new Set(ts.map(s => s.grade))).sort();

  grades.forEach(g => {
    const headers = ['학년','학교','이름','직전학기','목표(학생)','가능(강사)','목표(강사)'];
    for (let r = 1; r <= ROUNDS; r++) headers.push(r + '회', r + '회 오답');
    const rows = [headers];
    ts.filter(s => s.grade === g).forEach(s => {
      const row = [s.grade, s.school, s.name, s.prevScore, s.studentGoal, s.teacherPossible, s.teacherGoal];
      for (let r = 1; r <= ROUNDS; r++) {
        const rd = getRoundData(s.id, r);
        if (!rd) row.push('', '');
        else if (isAbsent(rd)) row.push('결시', '');
        else row.push(rd.score || '', rd.errors || '');
      }
      rows.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), g);
  });

  XLSX.writeFile(wb, `${teacher}_수만프리포트_${dateStr()}.xlsx`);
  showToast('Excel 다운로드 완료');
}

function updateParentList(jump) {
  const c = $('#parent-list-container');
  if (!c) return;
  c.innerHTML = '';
  c.appendChild(renderParentStudentList());

  if (jump) {
    const search = ui.reportFilter.search.trim();
    if (search) {
      const matches = state.students.filter(s => GRADES.includes(s.grade) && s.name.includes(search));
      if (matches.length === 1) {
        // 정확히 한 명 → 바로 열기
        openParentReportModal(matches[0].id);
      } else if (matches.length === 0) {
        showToast('❌ 해당 이름의 학생을 찾을 수 없습니다', 'error');
      }
    }
  }

function renderParentStudentList() {
  const f = ui.reportFilter;
  const students = state.students.filter(s => {
    if (!GRADES.includes(s.grade)) return false;
    if (f.grade && f.grade !== 'all' && s.grade !== f.grade) return false;
    if (f.teacher && f.teacher !== 'all' && s.teacher !== f.teacher) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!s.name.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  if (students.length === 0) {
    return el('div', { className: 'empty' },
      el('div', { className: 'empty-icon' }, '🔍'),
      el('div', { className: 'empty-text' }, '조건에 맞는 학생이 없습니다')
    );
  }

  const cards = students.map(s => {
    const scores = [];
    for (let r = 1; r <= ROUNDS; r++) {
      const rd = getRoundData(s.id, r);
      if (!rd) scores.push(null);
      else if (isAbsent(rd)) scores.push('absent');
      else scores.push(rd.score);
    }
    const validScores = scores.filter(x => x != null && x !== '' && x !== 'absent').map(Number);
    const myAvg = validScores.length > 0 ? avg(validScores) : null;
    const taken = scores.filter(x => x != null && x !== '').length;

    return el('div', {
      className: 'student-card',
      onClick: () => openParentReportModal(s.id)
    },
      el('div', { className: 'student-card-head' },
        el('div', { className: 'student-card-name' }, s.name,
          el('span', { className: 'badge badge-grade-' + s.grade, style: { marginLeft: '4px', fontSize: '10.5px' } }, s.grade)
        ),
        el('div', { className: 'text-sm muted' }, s.teacher || '')
      ),
      el('div', { className: 'student-card-info' }, s.school || ''),
      el('div', { className: 'dot-row mb-12' },
        ...scores.map((sc, i) => el('div', {
          className: 'dot ' + dotClass(sc),
          title: `${i+1}회: ${sc === 'absent' ? '결시' : (sc != null && sc !== '' ? sc + '점' : '미응시')}`
        }, i+1))
      ),
      el('div', { className: 'text-sm flex-between' },
        el('span', { className: 'muted' }, `응시 ${taken}/${ROUNDS}회`),
        myAvg != null ?
          el('span', {
            className: 'text-mono fw-800',
            style: { color: myAvg >= 80 ? 'var(--green)' : myAvg >= 60 ? 'var(--amber)' : 'var(--red)' }
          }, fmt(myAvg) + '점') :
          el('span', { className: 'muted' }, '점수 없음')
      )
    );
  });

  return el('div', { className: 'grid grid-3', style: { gap: '14px' } }, ...cards);
}

      ),
      el('div', { className: 'report-hero-stat' },
        el('div', { className: 'report-hero-stat-label' }, '평균 점수'),
        el('div', { className: 'report-hero-stat-value' }, myAvg != null ? fmt(myAvg) : '—',
          myAvg != null ? el('span', { style: { fontSize: '14px', opacity: '0.8', marginLeft: '2px' } }, '점') : null
        )
      )
    )
  ));

  // === 1. 목표 점수 ===
  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '🎯'),
      el('div', { className: 'report-section-title' }, '목표 점수')
    ),
    el('div', { className: 'goals-row' },
      goalBox('전학기', s.prevScore, 'muted'),
      goalBox('학생 목표', s.studentGoal, 'navy'),
      goalBox('가능 (강사)', s.teacherPossible, 'green'),
      goalBox('목표 (강사)', s.teacherGoal, 'orange')
    )
  ));

  // === 2. 회차별 점수 ===
  const roundCards = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = myRounds[r-1];
    const ga = gradeAvgs[r-1];
    const gst = gradeStats[r-1];
    let scoreClass = 'empty', scoreText = '—', deltaNode = null, avgNode = null;
    let hasData = false;

    if (rd) {
      if (isAbsent(rd)) {
        scoreClass = 'absent';
        scoreText = '결시';
        hasData = true;
      } else {
        const n = Number(rd.score);
        if (!isNaN(n) && rd.score !== '' && rd.score != null) {
          hasData = true;
          scoreText = fmt(n);
          scoreClass = n >= 80 ? 'high' : n >= 60 ? 'mid' : 'low';
          if (ga != null) {
            const d = n - ga;
            deltaNode = el('div', {
              className: 'round-card-delta ' + (d >= 0 ? 'delta-up' : 'delta-down')
            }, (d >= 0 ? '▲' : '▼') + Math.abs(d).toFixed(1));
            avgNode = el('div', { className: 'round-card-avg' }, '평균 ' + fmt(ga));
          }
        }
      }
    }

    roundCards.push(el('div', { className: 'round-card' + (hasData ? ' has-data' : '') },
      el('div', { className: 'round-card-no' }, `${r}회`),
      el('div', { className: 'round-card-score ' + scoreClass },
        scoreText,
        (hasData && scoreClass !== 'absent' && scoreClass !== 'empty') ?
          el('span', { style: { fontSize: '12px', opacity: '0.8', marginLeft: '1px' } }, '점') : null
      ),
      avgNode,
      deltaNode
    ));
  }

  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '📊'),
      el('div', { className: 'report-section-title' }, '회차별 점수'),
      el('div', { className: 'report-section-sub' }, '학년 평균 대비 추이')
    ),
    el('div', { className: 'rounds-grid' }, ...roundCards)
  ));

  // === 3. 추이 차트 ===
  const chartId = 'shared-trend-' + sid;
  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '📈'),
      el('div', { className: 'report-section-title' }, '추이 분석'),
      firstScore != null && lastScore != null ?
        el('div', { className: 'report-section-sub' },
          `${fmt(firstScore)}점 → ${fmt(lastScore)}점 (${lastScore - firstScore >= 0 ? '▲' : '▼'}${Math.abs(lastScore - firstScore).toFixed(1)})`
        ) : null
    ),
    el('div', { className: 'chart-box' }, el('canvas', { id: chartId }))
  ));

  // === 4. 오답 분석 ===
  const wrongSection = el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '🔍'),
      el('div', { className: 'report-section-title' }, '회차별 오답 분석')
    )
  );

  if (wrongs.length === 0) {
    wrongSection.appendChild(el('div', { className: 'muted', style: { padding: '20px 0', textAlign: 'center' } },
      '아직 오답 데이터가 없습니다.'
    ));
  } else {
    wrongs.forEach(w => {
      const paper = getPaperForStudent(s.grade, w.round, w.version);
      const hasPaperProblems = paper && paper.problems && paper.problems.length > 0 &&
                               paper.problems.some(p => p.unit || p.type || p.difficulty);
      // 통합 PDF (구버전 testPdf도 호환)
      const paperPdf = paper && (paper.paperPdf || paper.testPdf);
      const hasPdf = !!paperPdf;

      const roundCard = el('div', { className: 'wrong-round-card' },
        el('div', { className: 'wrong-round-head' },
          el('div', { className: 'wrong-round-title' },
            el('span', { className: 'wrong-round-title-num' }, `${w.round}회`),
            `오답 ${w.errors.length}문항`
          ),
          el('div', { className: 'wrong-badges' },
            ...w.errors.map(n => el('span', { className: 'wrong-num-badge' }, n + '번'))
          )
        )
      );

      // 주제 + PDF 링크
      if (paper) {
        const metaBar = el('div', { className: 'wrong-round-meta' });
        if (paper.topic) {
          metaBar.appendChild(el('div', { className: 'wrong-round-topic' },
            el('span', { className: 'wrong-round-topic-label' }, '주제'),
            el('span', { className: 'wrong-round-topic-value' }, paper.topic)
          ));
        }
        if (hasPdf) {
          const pdfLinks = el('div', { className: 'wrong-round-pdf-links' });
          pdfLinks.appendChild(el('button', {
            className: 'pdf-link-btn',
            onClick: () => openPdfBlob(paperPdf, pdfKey(s.grade, w.round))
          }, '📄 시험지 · 해설지 PDF'));
          metaBar.appendChild(pdfLinks);
        }
        if (paper.topic || hasPdf) roundCard.appendChild(metaBar);
      }

      // 학부모 친화적 요약: 회차별로 단원만 묶어서 간결하게 표시
      if (hasPaperProblems) {
        // 회차 내 단원별 그룹핑 (대단원 기준)
        const unitGroups = {};  // unit → [번호 리스트]
        const unanalyzedNums = [];
        
        w.errors.forEach(n => {
          const p = paper.problems[n - 1];
          if (!p) { unanalyzedNums.push(n); return; }
          if (!p.unit && !p.type && !p.difficulty) {
            unanalyzedNums.push(n);
            return;
          }
          // 대단원 키 (없으면 기타로)
          const unitKey = p.unit || '기타';
          if (!unitGroups[unitKey]) unitGroups[unitKey] = [];
          unitGroups[unitKey].push({ n, p });
        });
        
        const unitKeys = Object.keys(unitGroups);
        if (unitKeys.length > 0) {
          const summaryList = el('div', { className: 'wrong-summary-list' });
          unitKeys.forEach(unitKey => {
            const items = unitGroups[unitKey];
            const nums = items.map(it => it.n).sort((a, b) => a - b);
            
            // 이 단원에서 가장 자주 나오는 난이도 표시
            const diffCount = {};
            items.forEach(it => {
              if (it.p.difficulty) diffCount[it.p.difficulty] = (diffCount[it.p.difficulty] || 0) + 1;
            });
            const topDiff = Object.entries(diffCount).sort((a, b) => b[1] - a[1])[0];
            
            summaryList.appendChild(el('div', { className: 'wrong-unit-row' },
              el('div', { className: 'wrong-unit-info' },
                el('div', { className: 'wrong-unit-name' }, unitKey),
                el('div', { className: 'wrong-unit-count' }, items.length + '문항 오답')
              ),
              el('div', { className: 'wrong-unit-nums' },
                ...nums.map(n => el('span', { className: 'wrong-num-chip' }, n + '번'))
              ),
              topDiff ? el('div', { className: 'wrong-unit-diff' },
                (() => {
                  const d = TAG_SYSTEM.difficulties.find(x => x.level === topDiff[0]);
                  return d ? d.symbol : topDiff[0];
                })()
              ) : null
            ));
          });
          roundCard.appendChild(summaryList);
        }
        
        if (unanalyzedNums.length > 0 && unitKeys.length === 0) {
          roundCard.appendChild(el('div', { className: 'wrong-unanalyzed-note' },
            `${unanalyzedNums.join('번, ')}번 문항`
          ));
        }
      } else if (paper) {
        roundCard.appendChild(el('div', { className: 'wrong-unanalyzed-note' },
          '※ 시험지 문항 분류가 입력되면 상세 약점 분석이 표시됩니다.'
        ));
      } else {
        roundCard.appendChild(el('div', { className: 'wrong-unanalyzed-note' },
          '※ 시험지가 업로드되면 문항별 상세 분석이 자동으로 표시됩니다.'
        ));
      }

      wrongSection.appendChild(roundCard);
    });
  }
  wrap.appendChild(wrongSection);

  // === 5. 약점 영역 분석 ===
  const weakSec = buildWeaknessSection(sid);
  if (weakSec) wrap.appendChild(weakSec);

  // === 6. 종합 분석 ===
  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '💬'),
      el('div', { className: 'report-section-title' }, '종합 분석')
    ),
    el('div', { className: 'analysis-list' },
      ...generateStudentAnalysisLines(sid).map(l => el('div', { className: 'analysis-item' }, l))
    )
  ));

  // 푸터
  wrap.appendChild(el('div', {
    style: {
      textAlign: 'center',
      padding: '24px 20px',
      color: 'var(--ink-mute)',
      fontSize: '11.5px',
      letterSpacing: '0.5px',
      marginTop: '8px'
    }
  },
    el('div', { style: { marginBottom: '4px' } }, `생성일: ${dateStr()}`),
    el('div', null, '클라디수학학원 · 수만프 분석 시스템')
  ));

  page.appendChild(wrap);
  setTimeout(() => renderSharedTrendChart(sid, myRounds, gradeAvgs, chartId), 60);
  return page;
}

// 약점 영역 분석 섹션
function buildWeaknessSection(sid) {
  const s = getStudent(sid);
  const unitCounter = {}, typeCounter = {}, diffCounter = {};
  let totalAnalyzed = 0;

  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (!rd || isAbsent(rd) || !rd.errors) continue;
    const paper = getPaperForStudent(s.grade, r, rd.version);
    if (!paper || !paper.problems) continue;
    const errors = parseErrors(rd.errors);
    errors.forEach(n => {
      const p = paper.problems[n - 1];
      if (!p) return;
      if (!p.unit && !p.type && !p.difficulty) return;
      totalAnalyzed++;
      if (p.unit) {
        const key = p.unit;  // 대단원만 (학부모용 요약)
        unitCounter[key] = (unitCounter[key] || 0) + 1;
      }
      if (p.type) typeCounter[p.type] = (typeCounter[p.type] || 0) + 1;
      if (p.difficulty) diffCounter[p.difficulty] = (diffCounter[p.difficulty] || 0) + 1;
    });
  }

  if (totalAnalyzed === 0) return null;

  const topUnits = Object.entries(unitCounter).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const topTypes = Object.entries(typeCounter).sort((a,b) => b[1] - a[1]).slice(0, 4);
  const diffEntries = Object.entries(diffCounter).sort((a,b) => {
    const order = ['최하','하','중','상','최상'];
    return order.indexOf(a[0]) - order.indexOf(b[0]);
  });
  
  // 가장 약한 단원 1개 (강조)
  const topUnit = topUnits[0];
  const topUnitRatio = topUnit ? (topUnit[1] / totalAnalyzed * 100) : 0;

  const sec = el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '🎯'),
      el('div', { className: 'report-section-title' }, '약점 영역 분석'),
      el('div', { className: 'report-section-sub' }, `총 ${totalAnalyzed}개 오답 분석`)
    )
  );

  // 핵심 메시지 (가장 약한 단원 강조)
  if (topUnit) {
    sec.appendChild(el('div', { className: 'weakness-headline' },
      el('div', { className: 'weakness-headline-icon' }, '⚠️'),
      el('div', { className: 'weakness-headline-content' },
        el('div', { className: 'weakness-headline-label' }, '집중 보완이 필요한 단원'),
        el('div', { className: 'weakness-headline-unit' }, topUnit[0]),
        el('div', { className: 'weakness-headline-stat' },
          `오답 ${topUnit[1]}개 · 전체 오답의 `,
          el('strong', null, topUnitRatio.toFixed(0) + '%')
        )
      )
    ));
  }

  // 단원별 오답 분포 (진행률 바)
  if (topUnits.length > 0) {
    const unitChart = el('div', { className: 'weakness-bar-group' },
      el('div', { className: 'weakness-bar-title' }, '단원별 오답 분포')
    );
    const maxCount = topUnits[0][1];
    topUnits.forEach(([u, c]) => {
      const pct = (c / maxCount) * 100;
      const ratio = c / totalAnalyzed;
      const colorClass = ratio > 0.35 ? 'bar-high' : ratio > 0.20 ? 'bar-mid' : 'bar-low';
      unitChart.appendChild(el('div', { className: 'weakness-bar-row' },
        el('div', { className: 'weakness-bar-label' }, u),
        el('div', { className: 'weakness-bar-track' },
          el('div', { className: 'weakness-bar-fill ' + colorClass, style: { width: pct + '%' } })
        ),
        el('div', { className: 'weakness-bar-value' }, c + '개')
      ));
    });
    sec.appendChild(unitChart);
  }

  // 유형별·난이도별은 작은 칩 형식으로 (한눈에)
  const subBox = el('div', { className: 'weakness-sub-box' });
  
  if (topTypes.length > 0) {
    subBox.appendChild(el('div', { className: 'weakness-sub-col' },
      el('div', { className: 'weakness-sub-title' }, '유형별 오답'),
      el('div', { className: 'weakness-chips' },
        ...topTypes.map(([t, c]) => el('span', { className: 'weakness-chip' },
          t,
          el('span', { className: 'weakness-chip-count' }, c)
        ))
      )
    ));
  }

  if (diffEntries.length > 0) {
    subBox.appendChild(el('div', { className: 'weakness-sub-col' },
      el('div', { className: 'weakness-sub-title' }, '난이도별 오답'),
      el('div', { className: 'weakness-chips' },
        ...diffEntries.map(([d, c]) => {
          const dInfo = TAG_SYSTEM.difficulties.find(x => x.level === d);
          return el('span', { className: 'weakness-chip' },
            (dInfo ? dInfo.symbol + ' ' : '') + d,
            el('span', { className: 'weakness-chip-count' }, c)
          );
        })
      )
    ));
  }
  
  if (subBox.children.length > 0) sec.appendChild(subBox);

  return sec;
}

// goalBox 헬퍼
function goalBox(label, value, color) {
  const disp = (value != null && value !== '' && value !== 'X' && value !== 'x') ?
    value + '점' :
    (value === 'X' || value === 'x' ? '해당없음' : '—');
  return el('div', { className: 'goal-box ' + color },
    el('div', { className: 'goal-box-label' }, label),
    el('div', { className: 'goal-box-value' }, disp)
  );
}

function renderSharedTrendChart(sid, myRounds, gradeAvgs, chartId) {
  const ctx = document.getElementById(chartId);
  if (!ctx || typeof Chart === 'undefined') return;
  if (_charts[chartId]) _charts[chartId].destroy();

  const s = getStudent(sid);
  const myData = myRounds.map(rd => {
    if (!rd || isAbsent(rd)) return null;
    const n = Number(rd.score);
    return isNaN(n) ? null : n;
  });
  const goalLine = s.studentGoal && !isNaN(Number(s.studentGoal)) ? Number(s.studentGoal) : null;
  const teacherGoal = s.teacherGoal && !isNaN(Number(s.teacherGoal)) ? Number(s.teacherGoal) : null;

  // 그라데이션 만들기
  const chartCtx = ctx.getContext('2d');
  const orangeGradient = chartCtx.createLinearGradient(0, 0, 0, 280);
  orangeGradient.addColorStop(0, 'rgba(232, 136, 54, 0.32)');
  orangeGradient.addColorStop(0.5, 'rgba(232, 136, 54, 0.12)');
  orangeGradient.addColorStop(1, 'rgba(232, 136, 54, 0.01)');

  const navyGradient = chartCtx.createLinearGradient(0, 0, 0, 280);
  navyGradient.addColorStop(0, 'rgba(15, 39, 66, 0.08)');
  navyGradient.addColorStop(1, 'rgba(15, 39, 66, 0)');

  const datasets = [
    {
      label: s.name + ' 점수',
      data: myData,
      borderColor: '#e88836',
      backgroundColor: orangeGradient,
      borderWidth: 3.5,
      pointRadius: 6,
      pointHoverRadius: 9,
      pointBackgroundColor: '#e88836',
      pointBorderColor: '#fff',
      pointBorderWidth: 3,
      pointHoverBackgroundColor: '#d47020',
      pointHoverBorderColor: '#fff',
      pointHoverBorderWidth: 3,
      tension: 0.35,
      spanGaps: true,
      fill: true,
      order: 1
    },
    {
      label: s.grade + ' 학년 평균',
      data: gradeAvgs,
      borderColor: '#0f2742',
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      borderDash: [6, 5],
      pointRadius: 4,
      pointHoverRadius: 7,
      pointBackgroundColor: '#0f2742',
      pointBorderColor: '#fff',
      pointBorderWidth: 2,
      tension: 0.35,
      spanGaps: true,
      fill: false,
      order: 2
    }
  ];

  if (goalLine != null) {
    datasets.push({
      label: '학생 목표 ' + goalLine + '점',
      data: Array(8).fill(goalLine),
      borderColor: 'rgba(21, 128, 61, 0.85)',
      backgroundColor: 'transparent',
      borderWidth: 2,
      borderDash: [10, 6],
      pointRadius: 0,
      pointHoverRadius: 0,
      tension: 0,
      fill: false,
      order: 3
    });
  }
  if (teacherGoal != null && teacherGoal !== goalLine) {
    datasets.push({
      label: '강사 목표 ' + teacherGoal + '점',
      data: Array(8).fill(teacherGoal),
      borderColor: 'rgba(212, 112, 32, 0.7)',
      backgroundColor: 'transparent',
      borderWidth: 1.8,
      borderDash: [4, 4],
      pointRadius: 0,
      pointHoverRadius: 0,
      tension: 0,
      fill: false,
      order: 4
    });
  }

  _charts[chartId] = new Chart(ctx, {
    type: 'line',
    data: { labels: roundLabels(), datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: {
            color: '#2d2d4a',
            font: { size: 12.5, family: "Pretendard, sans-serif", weight: '600' },
            padding: 14,
            usePointStyle: true,
            pointStyle: 'circle',
            boxWidth: 8,
            boxHeight: 8
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15, 39, 66, 0.96)',
          titleColor: '#f7b87a',
          titleFont: { size: 13, weight: '700', family: "Pretendard, sans-serif" },
          titleMarginBottom: 8,
          bodyColor: '#ffffff',
          bodyFont: { size: 12.5, family: "Pretendard, sans-serif" },
          bodySpacing: 6,
          padding: 14,
          cornerRadius: 10,
          displayColors: true,
          boxPadding: 6,
          borderColor: 'rgba(232, 136, 54, 0.35)',
          borderWidth: 1,
          callbacks: {
            label: function(context) {
              const v = context.parsed.y;
              if (v == null) return context.dataset.label + ': —';
              return context.dataset.label + ': ' + (Math.round(v * 10) / 10) + '점';
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#555570',
            font: { size: 12, weight: '600', family: "Pretendard, sans-serif" }
          },
          grid: { display: false },
          border: { color: '#d8cdb3' }
        },
        y: {
          ticks: {
            color: '#9090a8',
            font: { size: 11.5, family: "JetBrains Mono, monospace" },
            callback: v => v + '점',
            stepSize: 20
          },
          grid: { color: 'rgba(184, 168, 122, 0.18)', lineWidth: 1 },
          border: { display: false },
          min: 0, max: 100
        }
      },
      animation: {
        duration: 800,
        easing: 'easeOutQuart'
      }
    }
  });
}

function generateStudentAnalysisLines(sid) {
  const s = getStudent(sid);
  const lines = [];
  const validScores = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (rd && !isAbsent(rd)) {
      const n = Number(rd.score);
      if (!isNaN(n)) validScores.push({ round: r, score: n });
    }
  }
  if (validScores.length === 0) return ['아직 응시한 시험이 없어 분석이 어렵습니다.'];

  const myAvg = avg(validScores.map(v => v.score));
  const gradeAvgScores = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const ga = gradeRoundStats(s.grade, r).avg;
    if (ga != null) gradeAvgScores.push(ga);
  }
  const gradeAvg = avg(gradeAvgScores);

  // 전체 위치
  if (gradeAvg != null && myAvg != null) {
    const diff = myAvg - gradeAvg;
    if (diff > 5) lines.push(`📈 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)보다 ${fmt(diff)}점 높은 우수한 수준입니다.`);
    else if (diff > 0) lines.push(`📊 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)을 약간 상회하고 있습니다.`);
    else if (diff > -5) lines.push(`📊 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)에 근접한 점수를 유지하고 있습니다.`);
    else lines.push(`📉 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)보다 ${fmt(Math.abs(diff))}점 낮습니다. 보완이 필요합니다.`);
  }

  // 추세
  if (validScores.length >= 3) {
    const first = validScores[0];
    const last = validScores[validScores.length-1];
    const trend = last.score - first.score;
    if (trend >= 10) lines.push(`💪 ${first.round}회(${fmt(first.score)}점) → ${last.round}회(${fmt(last.score)}점)로 ${fmt(trend)}점 향상되어 매우 긍정적입니다.`);
    else if (trend >= 0) lines.push(`✅ 점수가 안정적으로 유지되고 있습니다 (변화 ${fmt(trend)}점).`);
    else if (trend >= -5) lines.push(`📊 약간의 등락은 있으나 큰 변동은 없습니다 (변화 ${fmt(trend)}점).`);
    else lines.push(`⚠ ${first.round}회(${fmt(first.score)}점) → ${last.round}회(${fmt(last.score)}점)로 ${fmt(Math.abs(trend))}점 하락. 약점 보완이 시급합니다.`);
  }

  // 목표 달성
  if (s.studentGoal && !isNaN(Number(s.studentGoal))) {
    const goal = Number(s.studentGoal);
    const achieved = validScores.filter(v => v.score >= goal).length;
    if (achieved > 0) {
      lines.push(`🎯 학생 목표 ${goal}점 달성: ${achieved}/${validScores.length}회 (${Math.round(achieved/validScores.length*100)}%)`);
    } else {
      lines.push(`🎯 학생 목표 ${goal}점 미달성. 남은 회차에서 약점 보완에 집중하면 충분히 가능합니다.`);
    }
  }

  // 약점 단원 (시험지 태그 기반)
  const unitWrong = {};
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (!rd || isAbsent(rd) || !rd.errors) continue;
    const paper = getPaperForStudent(s.grade, r, rd.version);
    if (!paper || !paper.problems) continue;
    parseErrors(rd.errors).forEach(n => {
      const p = paper.problems[n - 1];
      if (p && p.unit) {
        unitWrong[p.unit] = (unitWrong[p.unit] || 0) + 1;
      }
    });
  }
  const topWeakUnits = Object.entries(unitWrong).sort((a,b) => b[1] - a[1]).slice(0, 2);
  if (topWeakUnits.length > 0) {
    lines.push(`📚 주요 약점 단원: ${topWeakUnits.map(([u,c]) => `${u} (${c}회 오답)`).join(', ')} — 해당 단원 복습 권장`);
  }

  // 종합 코멘트
  if (myAvg != null) {
    if (myAvg >= 85) lines.push('💎 매우 우수한 수준입니다. 기말고사에서 좋은 결과를 기대할 수 있습니다.');
    else if (myAvg >= 70) lines.push('👍 양호한 수준입니다. 약점 보완으로 목표 달성이 가능합니다.');
    else if (myAvg >= 50) lines.push('📚 기초 보강이 필요합니다. 학원의 보충 학습 프로그램을 적극 활용해주세요.');
    else lines.push('🔍 개별 맞춤 학습이 시급합니다. 담당 선생님과 학습 계획을 재정비하세요.');
  }

  return lines;
}

function renderPaperCard(grade, round, version) {

      el('div', { className: 'text-sm muted mb-6', style: { fontSize: '11.5px' } },

// PDF 파일을 base64로 변환
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // data:application/pdf;base64,...
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function bytesFmt(b) {
  if (!b) return '0';
  if (b < 1024) return b + 'B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
  return (b/(1024*1024)).toFixed(1) + 'MB';
}

// 난이도 문자열 정규화 ("★★★☆☆", "★★★", "중" 등 → 표준 레벨)
function normalizeDifficulty(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  // 별 개수 세기
  const starCount = (s.match(/★/g) || []).length;
  if (starCount > 0) {
    const map = { 1: '최하', 2: '하', 3: '중', 4: '상', 5: '최상' };
    return map[starCount] || '';
  }
  // 한글 직접 매칭
  const known = ['최하', '하', '중', '상', '최상'];
  for (const k of known) {
    if (s.includes(k)) return k;
  }
  return '';
}

// 학년 문자열 정규화
function normalizeGrade(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (s.includes('중1') || s.includes('중학교 1')) return '중1';
  if (s.includes('중2') || s.includes('중학교 2')) return '중2';
  if (s.includes('중3') || s.includes('중학교 3')) return '중3';
  if (s.includes('고1') || s.includes('고등학교 1')) return '고1';
  if (s.includes('고2') || s.includes('고등학교 2')) return '고2';
  if (s.includes('고3') || s.includes('고등학교 3')) return '고3';
  return '';
}

// 컬럼명 → 표준 키 매핑
function detectColumnMap(headers) {
  const map = {};
  headers.forEach((h, idx) => {
    if (!h) return;
    const norm = String(h).trim().replace(/\s+/g, '');
    if (/^번호$|^문항번호$|^No$/i.test(norm)) map.no = idx;
    else if (/문항요약|요약|내용/.test(norm)) map.summary = idx;
    else if (/^과정$|^학년$/.test(norm)) map.gradeCol = idx;
    else if (/^대단원$|^단원$/.test(norm)) map.unit = idx;
    else if (/^중단원$/.test(norm)) map.subUnit = idx;
    else if (/^소단원$/.test(norm)) map.soUnit = idx;
    else if (/일반유형|문제유형|^유형$/.test(norm)) map.type = idx;
    else if (/도형유형|기하유형/.test(norm)) map.geomType = idx;
    else if (/^난이도$/.test(norm)) map.difficulty = idx;
    else if (/사고단계|인지단계|Bloom|블룸/.test(norm)) map.cognitive = idx;
    else if (/^비고$|^메모$|^참고$/.test(norm)) map.memo = idx;
  });
  return map;
}

// 시트 데이터 → 문항 배열로 변환
function parseSheetToProblems(rows, colMap) {
  const problems = [];
  for (const row of rows) {
    const no = colMap.no != null ? parseInt(row[colMap.no]) : NaN;
    if (isNaN(no) || no < 1) continue;
    
    const p = {
      no: no,
      summary: colMap.summary != null ? (row[colMap.summary] || '') : '',
      book: '',
      unit: colMap.unit != null ? (row[colMap.unit] || '') : '',
      subUnit: colMap.subUnit != null ? (row[colMap.subUnit] || '') : '',
      soUnit: colMap.soUnit != null ? (row[colMap.soUnit] || '') : '',
      type: colMap.type != null ? (row[colMap.type] || '') : '',
      geomType: colMap.geomType != null ? (row[colMap.geomType] || '') : '',
      difficulty: normalizeDifficulty(colMap.difficulty != null ? row[colMap.difficulty] : ''),
      cognitive: colMap.cognitive != null ? (row[colMap.cognitive] || '') : '',
      memo: colMap.memo != null ? (row[colMap.memo] || '') : ''
    };
    // 빈 값(NaN, "—", 등) 정리
    Object.keys(p).forEach(k => {
      if (typeof p[k] === 'string') {
        p[k] = p[k].trim();
        if (p[k] === '—' || p[k] === '-' || p[k].toLowerCase() === 'nan') p[k] = '';
      } else if (p[k] == null || (typeof p[k] === 'number' && isNaN(p[k]))) {
        p[k] = k === 'no' ? p[k] : '';
      }
    });
    problems.push(p);
  }
  // 번호순 정렬
  problems.sort((a, b) => a.no - b.no);
  return problems;
}

// Excel 파일에서 시트 정보 파싱
async function parseExcelFile(file) {
  if (typeof XLSX === 'undefined') {
    throw new Error('Excel 라이브러리(XLSX)가 로드되지 않았습니다');
  }
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type: 'array' });
  
  const sheets = [];
  for (const sheetName of wb.SheetNames) {
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
    if (rows.length < 2) continue;
    
    // 헤더 행 찾기 (보통 첫 줄이지만, '번호'가 포함된 행을 찾음)
    let headerRowIdx = 0;
    for (let i = 0; i < Math.min(5, rows.length); i++) {
      if (rows[i] && rows[i].some(c => String(c).trim() === '번호')) {
        headerRowIdx = i;
        break;
      }
    }
    
    const headers = rows[headerRowIdx];
    const colMap = detectColumnMap(headers);
    
    // 데이터 행이 너무 적거나 번호 컬럼이 없으면 스킵
    if (colMap.no == null) continue;
    
    const dataRows = rows.slice(headerRowIdx + 1);
    const problems = parseSheetToProblems(dataRows, colMap);
    
    if (problems.length === 0) continue;
    
    // 학년 자동 감지 (학년 컬럼 또는 시트명에서)
    let detectedGrade = '';
    if (colMap.gradeCol != null && dataRows[0]) {
      detectedGrade = normalizeGrade(dataRows[0][colMap.gradeCol]);
    }
    if (!detectedGrade) detectedGrade = normalizeGrade(sheetName);
    
    sheets.push({
      name: sheetName,
      grade: detectedGrade,
      problemCount: problems.length,
      problems: problems,
      colMap: colMap
    });
  }
  
  return sheets;
}

// Excel 가져오기 모달 — 시트→회차 매핑 UI
async function openExcelImportModal(file) {
  let sheets;
  try {
    showToast('📥 Excel 파일 분석 중...', 'info');
    sheets = await parseExcelFile(file);
  } catch (err) {
    console.error(err);
    showToast('Excel 파일을 읽을 수 없습니다: ' + err.message, 'error');
    return;
  }
  
  if (!sheets || sheets.length === 0) {
    showToast('가져올 수 있는 시트가 없습니다. "번호" 컬럼이 포함된 시트를 확인하세요', 'error');
    return;
  }
  
  // 시트별 회차 매핑 설정 (기본값 자동 추정)
  const mappings = sheets.map((sheet, idx) => {
    // 시트명에서 회차 힌트 찾기
    let suggestedRound = idx + 1;
    let suggestedGrade = sheet.grade || ui.papersGrade || '중2';
    
    // "중간" 키워드면 중간 회차 (4회), "기말" 키워드면 후반 회차 (8회)
    if (/중간/.test(sheet.name)) suggestedRound = 4;
    else if (/기말/.test(sheet.name)) suggestedRound = 8;
    
    // 시트명에서 버전 힌트 찾기 (모든 학년)
    let suggestedVersion = 'v1';
    const sn = sheet.name;
    // 고1 키워드 (3버전)
    if (/v3|V3|버전3|version3|방정식과\s*부등식|방부행/.test(sn)) suggestedVersion = 'v3';
    else if (/v2|V2|버전2|version2|부등식.*행렬|부행/i.test(sn)) suggestedVersion = 'v2';
    else if (/v1|V1|버전1|version1|방정식.*행렬|방행/i.test(sn)) suggestedVersion = 'v1';
    // 중등 키워드 (난이도)
    else if (/난이도\s*하|난도\s*하|쉬운|기본/.test(sn)) suggestedVersion = 'v2';
    else if (/난이도\s*상|난도\s*상|어려운|표준|심화/.test(sn)) suggestedVersion = 'v1';
    
    return {
      sheet: sheet,
      grade: suggestedGrade,
      round: suggestedRound,
      version: suggestedVersion,
      enabled: true
    };
  });
  
  openModal({
    title: '📥 Excel 문항 분류표 가져오기',
    body: () => {
      const wrap = el('div');
      
      // 안내
      wrap.appendChild(el('div', { className: 'notice notice-warn mb-12', style: { fontSize: '12px' } },
        el('strong', null, `✓ ${sheets.length}개 시트 인식됨. `),
        '각 시트를 어느 학년·회차·버전에 적용할지 선택하세요. (중1/중2/중3: V1 표준, V2 난이도 ↓ / 고1: V1~V3) 기존 데이터가 있으면 덮어쓰여집니다.'
      ));
      
      // 매핑 테이블 (고1 지원을 위해 버전 컬럼 추가)
      const table = el('div', { style: { border: '1px solid var(--line)', borderRadius: '8px', overflow: 'hidden' } });
      const cols = '32px 1fr 70px 70px 70px 90px';  // 체크 / 시트명 / 문항수 / 학년 / 회차 / 버전
      
      // 헤더
      table.appendChild(el('div', {
        style: {
          display: 'grid',
          gridTemplateColumns: cols,
          gap: '8px',
          padding: '10px 12px',
          background: 'var(--bg-elevated)',
          fontSize: '12px',
          fontWeight: 700,
          color: 'var(--ink-3)',
          borderBottom: '1px solid var(--line)'
        }
      },
        el('div', null, ''),
        el('div', null, '시트명'),
        el('div', null, '문항수'),
        el('div', null, '학년'),
        el('div', null, '회차'),
        el('div', null, '버전')
      ));
      
      mappings.forEach((m, idx) => {
        const checkbox = el('input', { type: 'checkbox', checked: m.enabled });
        checkbox.addEventListener('change', e => { m.enabled = e.target.checked; });
        
        // 학년에 맞는 버전 옵션 빌드
        function buildVersionOptions(grade, currentVersion) {
          const versions = getVersionsForGrade(grade);
          const keys = getVersionKeysForGrade(grade);
          return keys.map((k, i) => el('option', { 
            value: k, 
            selected: currentVersion === k 
          }, `V${i+1} ${versions[i]}`));
        }
        
        const versionSelect = el('select', { className: 'select', style: { padding: '4px 6px', fontSize: '12px' } },
          ...buildVersionOptions(m.grade, m.version)
        );
        versionSelect.addEventListener('change', e => { m.version = e.target.value; });
        
        const gradeSelect = el('select', { className: 'select', style: { padding: '4px 6px', fontSize: '12px' } },
          ...GRADES.map(g => el('option', { value: g, selected: g === m.grade }, g))
        );
        gradeSelect.addEventListener('change', e => {
          m.grade = e.target.value;
          // 학년이 변경되면 버전 옵션 재구성
          const newKeys = getVersionKeysForGrade(m.grade);
          // m.version이 새 학년에 유효하지 않으면 첫 번째 키로
          if (!newKeys.includes(m.version)) m.version = newKeys[0];
          // 버전 select 옵션 갱신
          versionSelect.innerHTML = '';
          buildVersionOptions(m.grade, m.version).forEach(opt => versionSelect.appendChild(opt));
        });
        
        const roundSelect = el('select', { className: 'select', style: { padding: '4px 6px', fontSize: '12px' } },
          ...Array.from({length: ROUNDS}, (_, i) => i + 1).map(r =>
            el('option', { value: r, selected: r === m.round }, `${r}회`)
          )
        );
        roundSelect.addEventListener('change', e => { m.round = parseInt(e.target.value); });
        
        table.appendChild(el('div', {
          style: {
            display: 'grid',
            gridTemplateColumns: cols,
            gap: '8px',
            padding: '10px 12px',
            borderBottom: idx < mappings.length - 1 ? '1px solid var(--line)' : 'none',
            alignItems: 'center'
          }
        },
          checkbox,
          el('div', null,
            el('div', { style: { fontWeight: 700, fontSize: '12.5px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, m.sheet.name),
            el('div', { style: { fontSize: '10.5px', color: 'var(--ink-3)', marginTop: '2px' } },
              `컬럼: ${Object.keys(m.sheet.colMap).filter(k => m.sheet.colMap[k] != null).length}개 인식`
            )

          el('div', { style: { fontSize: '13px', fontWeight: 700 } }, m.sheet.problemCount + '개'),

          roundSelect,

      });
      
      wrap.appendChild(table);
      
      // 미리보기 (첫 시트의 첫 3문항)
      if (sheets[0] && sheets[0].problems.length > 0) {
        wrap.appendChild(el('div', { className: 'mt-12', style: { padding: '10px 12px', background: 'var(--bg-elevated)', borderRadius: '8px', fontSize: '11.5px' } },
          el('div', { style: { fontWeight: 700, marginBottom: '6px' } }, '👀 미리보기 (' + sheets[0].name + ' 시트의 첫 3문항):'),
          ...sheets[0].problems.slice(0, 3).map(p =>
            el('div', { style: { marginBottom: '4px', lineHeight: '1.5' } },
              el('strong', null, `${p.no}번: `),
              p.unit ? `${p.unit}` : '',
              p.subUnit ? ` › ${p.subUnit}` : '',
              p.soUnit ? ` › ${p.soUnit}` : '',
              p.type ? ` · ${p.type}` : '',
              p.difficulty ? ` · ${p.difficulty}` : ''
            )
          )
        ));
      }
      
      // 액션
      wrap.appendChild(el('div', { className: 'modal-actions' },
        el('button', { className: 'btn btn-ghost', onClick: closeModal }, '취소'),
        el('button', {
          className: 'btn btn-orange',
          onClick: async () => {
            const enabled = mappings.filter(m => m.enabled);
            if (enabled.length === 0) {
              showToast('적용할 시트를 선택하세요', 'error');
              return;
            }
            
            // 중복 매핑 검증 (모든 학년이 버전 포함)
            const seen = new Set();
            for (const m of enabled) {
              const key = m.grade + '|' + m.round + '|' + (m.version || '');
              if (seen.has(key)) {
                const dup = m.grade + ' ' + m.round + '회' + (m.version ? ' ' + m.version.toUpperCase() : '');
                showToast(`중복 매핑: ${dup}이 여러 시트에 매핑되어 있습니다`, 'error');
                return;
              }
              seen.add(key);
            }
            
            // 적용
            let totalApplied = 0;
            for (const m of enabled) {
              const grade = m.grade;
              const round = m.round;
              const versionLabels = getVersionLabelsForGrade(grade);
              const pKey = m.version ? ('r' + round + '_' + m.version) : ('r' + round);
              if (!state.testPapers[grade]) state.testPapers[grade] = {};
              
              const problems = m.sheet.problems.map(p => ({ ...p }));
              
              const existing = state.testPapers[grade][pKey] || {};
              
              state.testPapers[grade][pKey] = {
                version: m.version || '',
                versionLabel: m.version ? versionLabels[m.version] : '',
                problemCount: problems.length,
                topic: m.sheet.name,
                paperPdf: existing.paperPdf || null,
                problems: problems,
                comment: existing.comment || '',
                analysisMode: 'excel_import',
                detectedCount: problems.length,
                uploadedAt: dateStr()
              };
              totalApplied += problems.length;
            }
            
            saveState();
            closeModal();
            render();
            showToast(`✅ ${enabled.length}개 시트 · 총 ${totalApplied}개 문항 가져오기 완료`, 'success');
          }
        }, '✅ 가져오기')
      ));
      
      return wrap;
    }
  });
}

function base64ToBlob(dataUrl, mime) {
  const base64 = dataUrl.split(',')[1];
  const byteChars = atob(base64);
  const byteArr = new Uint8Array(byteChars.length);
  for (let i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
  return new Blob([byteArr], { type: mime || 'application/octet-stream' });
}

async function openPdfBlob(pdf, gradeRoundKey) {
  if (!pdf) { showToast('PDF 데이터가 없습니다', 'error'); return; }
  let dataUrl = pdf.data;
  // 데이터가 없으면 IndexedDB에서 로드
  if (!dataUrl && gradeRoundKey) {
    showToast('PDF 불러오는 중...', 'info');
    dataUrl = await loadPdfFromDB(gradeRoundKey);
  }
  if (!dataUrl) {
    showToast('PDF 데이터를 찾을 수 없습니다', 'error');
    return;
  }
  const blob = base64ToBlob(dataUrl, 'application/pdf');
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

// ============================================================
// 자동 문항 분석
// 시험지 업로드 시 학년·학기·주제·문항 수를 기반으로 합리적인 기본값 자동 채움
// ============================================================

// 학년별 시험 범위 기본 매핑
// 2학기 중간고사 대비 → 중등은 2학기 단원, 고등은 해당 학년 2학기 과목 우선
const TERM_BOOK_ORDER = {
  '중1': ['2학기', '1학기'],
  '중2': ['2학기', '1학기'],
  '중3': ['2학기', '1학기'],
  '고1': ['공통수학2', '공통수학1'],
  '고2': ['대수', '미적분Ⅰ', '확률과 통계'],
  '고3': ['미적분Ⅱ', '기하']
};

function getBookOrder(grade) {
  const curr = TAG_SYSTEM.curriculum[grade] || {};
  const pref = TERM_BOOK_ORDER[grade] || [];
  const books = pref.filter(b => curr[b]);
  Object.keys(curr).forEach(b => { if (!books.includes(b)) books.push(b); });
  return books;
}

function getDefaultUnitRangeForRound(grade, round) {
  const curr = TAG_SYSTEM.curriculum[grade];
  if (!curr) return [];
  const flat = [];
  getBookOrder(grade).forEach(book => {
    (curr[book] || []).forEach(u => {
      if (u.mid) {
        // 고등 구조: 대단원 > 중단원 > 소단원
        (u.mid || []).forEach(m => {
          (m.sub || []).forEach(so => {
            flat.push({ book: book, unit: u.unit, mid: m.name, so: so });
          });
        });
      } else {
        // 중등 구조: 대단원 > 중단원
        (u.sub || []).forEach(s => {
          flat.push({ book: book, unit: u.unit, mid: s, so: '' });
        });
      }
    });
  });
  return flat;
}

// 문항 번호 → 난이도·유형 추론 (시험지 일반 패턴 기반)
function inferDifficultyByPosition(no, total) {
  // 시험지 난이도 분포 일반 패턴:
  //   처음 30% — 하 (개념·기본 계산)
  //   30~70% — 중 (응용·복합)
  //   70~90% — 상 (심화 응용)
  //   90~100% — 최상 (고난도)
  const ratio = (no - 1) / Math.max(1, total - 1);
  if (ratio < 0.30) return '하';
  if (ratio < 0.70) return '중';
  if (ratio < 0.90) return '상';
  return '최상';
}

function inferTypeByPosition(no, total) {
  // 문항 위치별 유형 분포 (일반적 시험지 구성):
  //   1~5번: 개념 확인형
  //   6~15번: 계산형
  //   16~22번: 응용형
  //   23번 이후: 추론형 또는 복합형
  const ratio = (no - 1) / Math.max(1, total - 1);
  if (ratio < 0.20) return '개념 확인형';
  if (ratio < 0.55) return '계산형';
  if (ratio < 0.85) return '응용형';
  return '추론형';
}

// "주제" 문자열에서 단원 키워드 매칭으로 적합한 단원 찾기
function matchUnitsByTopic(topicStr, grade) {
  if (!topicStr) return null;
  const allUnits = getDefaultUnitRangeForRound(grade, 1);
  const matched = [];
  // 주제 문자열에서 키워드 추출 (예: "식의 계산과 일차부등식" → ["식의 계산", "일차부등식"])
  const keywords = topicStr.split(/[,·、\/+&과와그리고및]/g)
    .map(k => k.trim())
    .filter(k => k.length >= 2);
  
  keywords.forEach(kw => {
    // 단원명, 중단원명, 소단원명에 키워드가 포함된 것들 찾기
    const found = allUnits.filter(u => {
      return (u.unit && u.unit.includes(kw)) ||
             (u.mid && u.mid.includes(kw)) ||
             (u.so && u.so.includes(kw));
    });
    found.forEach(f => {
      if (!matched.some(m => m.unit === f.unit && m.mid === f.mid && m.so === f.so)) {
        matched.push(f);
      }
    });
  });
  return matched.length > 0 ? matched : null;
}

// 메인 자동 분석 함수: 모든 문항에 단원/유형/난이도 채워넣기
function autoAnalyzeProblems(problems, grade, round, topic) {
  const total = problems.length;
  if (total === 0) return problems;
  
  // 1) 주제로 단원 매칭 시도
  let candidateUnits = matchUnitsByTopic(topic, grade);
  
  // 2) 매칭 실패 시 학년·회차별 기본 범위 사용
  if (!candidateUnits || candidateUnits.length === 0) {
    candidateUnits = getDefaultUnitRangeForRound(grade, round);
  }
  
  if (candidateUnits.length === 0) return problems;
  
  // 3) 각 문항에 단원을 균등 분배 (앞쪽 문항은 앞 단원, 뒤쪽은 뒤 단원)
  problems.forEach((p, idx) => {
    // 이미 사용자가 수동 입력한 값은 보존
    if (p.unit || p.type || p.difficulty) return;
    
    // 단원 매핑: 문항 번호를 단원 개수에 따라 분배
    const unitIdx = Math.min(
      Math.floor((idx / total) * candidateUnits.length),
      candidateUnits.length - 1
    );
    const u = candidateUnits[unitIdx];
    p.book = u.book;
    p.unit = u.unit;
    p.subUnit = u.mid;
    p.soUnit = u.so;
    
    // 위치 기반 유형/난이도
    p.type = inferTypeByPosition(idx + 1, total);
    p.difficulty = inferDifficultyByPosition(idx + 1, total);
  });
  
  return problems;
}

// PDF 텍스트 기반 진짜 자동 분석
// PDF에서 텍스트를 추출해 각 문항의 단원·유형·난이도를 실제로 분석
// ============================================================

// PDF에서 모든 페이지의 텍스트 추출
async function extractPdfText(dataUrl) {
  if (!window.pdfjsLib) {
    throw new Error('PDF.js 라이브러리가 로드되지 않았습니다');
  }
  // dataUrl → ArrayBuffer
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  
  const pdf = await window.pdfjsLib.getDocument({ data: bytes.buffer }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const text = content.items.map(item => item.str).join(' ');
    pages.push(text);
  }
  return pages.join('\n\n');
}

// 문항 번호별로 텍스트 분할
// 한국 수학 시험지의 다양한 번호 패턴을 인식
function splitTextByProblems(text, expectedCount) {
  // 다양한 패턴 시도
  const patterns = [
    { regex: /(?:^|[\n\r\s])(\d{1,2})\.\s/g,  name: '1.' },     // "1. "
    { regex: /(?:^|[\n\r\s])(\d{1,2})\)\s/g,  name: '1)' },     // "1) "
    { regex: /\[(\d{1,2})\]/g,                  name: '[1]' },   // "[1]"
    { regex: /문제\s*(\d{1,2})[\s\.\)]/g,      name: '문제 1' }, // "문제 1"
    { regex: /(?:^|[\n\r])\s*(\d{1,2})\s*[\.\)]/g, name: '줄시작1.' }, // 줄 시작 "1." (more lax)
  ];
  
  let bestSplit = null;
  let bestPattern = null;
  let bestCount = 0;
  
  for (const pat of patterns) {
    pat.regex.lastIndex = 0;
    const matches = [];
    let m;
    while ((m = pat.regex.exec(text)) !== null) {
      const num = parseInt(m[1]);
      if (num >= 1 && num <= 50) {
        // 매치의 실제 번호 부분의 시작 위치 계산
        const numStr = m[1];
        const numIdx = m[0].indexOf(numStr);
        matches.push({ num, index: m.index + numIdx, matchEnd: m.index + m[0].length });
      }
    }
    
    if (matches.length < 3) continue;
    
    // 가장 긴 연속 시퀀스 찾기 (1, 2, 3, ...) 
    // 중간에 중복이나 비순차 번호가 있어도 가장 긴 1→N 시퀀스 추출
    // 정답표/페이지번호 같은 패턴이 섞여있을 수 있으므로 첫 등장 번호만 사용
    const seenNums = new Set();
    const uniqueOrdered = [];
    for (const match of matches) {
      if (!seenNums.has(match.num)) {
        seenNums.add(match.num);
        uniqueOrdered.push(match);
      }
    }
    
    // 1부터 연속되는 가장 긴 시퀀스
    let expected = 1;
    const sequential = [];
    for (const match of uniqueOrdered) {
      if (match.num === expected) {
        sequential.push(match);
        expected++;
      } else if (match.num > expected) {
        // 건너뛴 번호가 있으면 시퀀스 종료
        break;
      }
    }
    
    if (sequential.length >= 3 && sequential.length > bestCount) {
      bestCount = sequential.length;
      bestSplit = sequential;
      bestPattern = pat.name;
    }
  }
  
  if (!bestSplit || bestSplit.length < 3) {
    console.log('[PDF 분석] 문항 번호 패턴 인식 실패. 텍스트 길이:', text.length);
    return null;
  }
  
  console.log('[PDF 분석] 패턴 "' + bestPattern + '"로 ' + bestSplit.length + '개 문항 감지');
  
  // 각 문항의 텍스트 영역 잘라내기
  const problems = [];
  for (let i = 0; i < bestSplit.length; i++) {
    const start = bestSplit[i].index;
    const end = i + 1 < bestSplit.length ? bestSplit[i + 1].index : text.length;
    problems.push({
      no: bestSplit[i].num,
      text: text.substring(start, end).slice(0, 800)
    });
  }
  return problems;
}

// 단원 키워드 사전 만들기 (학년별)
function buildKeywordMap(grade) {
  const curriculum = TAG_SYSTEM.curriculum[grade] || {};
  const keywords = [];
  
  Object.entries(curriculum).forEach(([book, units]) => {
    units.forEach(u => {
      // 대단원 이름에서 핵심 키워드 추출
      const unitName = u.unit.replace(/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+\.\s*/, '');
      
      if (u.mid) { // 고1
        u.mid.forEach(m => {
          const midName = m.name.replace(/^\d+\.\s*/, '');
          m.sub.forEach(so => {
            keywords.push({
              keywords: extractKeywords(so + ' ' + midName + ' ' + unitName),
              book, unit: u.unit, mid: m.name, so: so
            });
          });
        });
      } else { // 중2/3
        u.sub.forEach(s => {
          keywords.push({
            keywords: extractKeywords(s + ' ' + unitName),
            book, unit: u.unit, mid: s, so: ''
          });
        });
      }
    });
  });
  
  return keywords;
}

// 텍스트에서 의미있는 키워드 추출
function extractKeywords(text) {
  // 수학 용어/단어를 추출 (2글자 이상 한글)
  const tokens = text.split(/[\s·,()\[\]{}]+/).filter(t => t.length >= 2);
  return [...new Set(tokens)];
}

// 문항 텍스트와 단원 키워드 매칭해서 가장 적합한 단원 찾기
function matchUnitByText(problemText, keywordMap) {
  if (!problemText) return null;
  
  let bestMatch = null;
  let bestScore = 0;
  
  for (const entry of keywordMap) {
    let score = 0;
    for (const kw of entry.keywords) {
      if (kw.length < 2) continue;
      // 정확 매칭은 높은 점수
      if (problemText.includes(kw)) {
        score += kw.length;  // 긴 키워드일수록 가중치 높음
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = entry;
    }
  }
  
  return bestScore >= 4 ? bestMatch : null;  // 최소 점수 임계값
}

// 문항 텍스트에서 유형 추론
function inferTypeFromText(text) {
  if (!text) return null;
  
  const patterns = [
    { keywords: ['증명', '보여라', '나타내라', '증명하시오'], type: '증명형' },
    { keywords: ['그래프', '도형', '삼각형', '사각형', '원', '각도', '넓이', '부피', '길이', '둘레'], type: '응용형' },
    { keywords: ['값을 구', '값은', '구하시오', '구하라'], type: '계산형' },
    { keywords: ['다음 중', '옳은 것', '옳지 않은', '모두 고르', '몇 개'], type: '개념 확인형' },
    { keywords: ['보기', '항상', '추론', '결론'], type: '추론형' },
    { keywords: ['풀이 과정', '서술', '설명하시오'], type: '서술형' }
  ];
  
  let bestType = null;
  let bestScore = 0;
  for (const p of patterns) {
    let score = 0;
    for (const kw of p.keywords) {
      if (text.includes(kw)) score++;
    }
    if (score > bestScore) {
      bestScore = score;
      bestType = p.type;
    }
  }
  return bestType;
}

// 문항 텍스트 길이/복잡도로 난이도 추론
function inferDifficultyFromText(text, position, total) {
  if (!text) return null;
  
  const len = text.length;
  // 텍스트 길이 + 위치 종합 점수
  let difficultyScore = 0;
  
  // 길이 기반 (긴 문항 = 더 어려움)
  if (len > 400) difficultyScore += 3;
  else if (len > 250) difficultyScore += 2;
  else if (len > 150) difficultyScore += 1;
  
  // 위치 기반
  const posRatio = (position - 1) / Math.max(1, total - 1);
  if (posRatio > 0.85) difficultyScore += 3;
  else if (posRatio > 0.65) difficultyScore += 2;
  else if (posRatio > 0.40) difficultyScore += 1;
  
  // 키워드 기반 가중치
  if (/(?:그리고|또한|이때|따라서|단,)/.test(text)) difficultyScore += 1;  // 조건이 많은 문제
  if (/(?:최[댓대]값|최[솟소]값)/.test(text)) difficultyScore += 1;
  if (/(?:정수|실수|모든)/.test(text)) difficultyScore += 1;
  
  if (difficultyScore <= 1) return '최하';
  if (difficultyScore <= 2) return '하';
  if (difficultyScore <= 4) return '중';
  if (difficultyScore <= 6) return '상';
  return '최상';
}

// 메인: PDF 텍스트 기반 자동 분석
// 반환: { mode, extracted, analyzed, detectedCount }
// detectedCount: PDF에서 실제 감지한 문항 수 (호출자가 problems 배열 크기 조정에 사용)
async function autoAnalyzeFromPDF(problems, grade, round, topic, pdfDataUrl) {
  if (!pdfDataUrl) {
    autoAnalyzeProblems(problems, grade, round, topic);
    return { mode: 'heuristic', extracted: 0, detectedCount: null };
  }
  
  try {
    const text = await extractPdfText(pdfDataUrl);
    if (!text || text.length < 100) {
      autoAnalyzeProblems(problems, grade, round, topic);
      return { mode: 'heuristic_empty_text', extracted: 0, detectedCount: null, textLength: text ? text.length : 0 };
    }
    
    // 문항별로 텍스트 분할 (PDF에서 실제 문항 수 자동 감지)
    const problemTexts = splitTextByProblems(text, problems.length);
    
    if (!problemTexts || problemTexts.length === 0) {
      autoAnalyzeProblems(problems, grade, round, topic);
      return { mode: 'heuristic_split_failed', extracted: 0, detectedCount: null, totalText: text.length };
    }
    
    // PDF에서 감지한 실제 문항 수
    const detectedCount = problemTexts.length;
    
    // problems 배열 크기를 감지한 문항 수로 조정
    if (detectedCount !== problems.length) {
      // 문항 추가
      while (problems.length < detectedCount) {
        problems.push({
          no: problems.length + 1,
          book: '', unit: '', subUnit: '', soUnit: '',
          type: '', difficulty: '', memo: ''
        });
      }
      // 문항 제거 (PDF에서 감지된 수가 더 적은 경우)
      while (problems.length > detectedCount) {
        problems.pop();
      }
      // 번호 재정렬
      problems.forEach((p, i) => p.no = i + 1);
    }
    
    // 학년별 단원 키워드 맵
    const keywordMap = buildKeywordMap(grade);
    
    let analyzed = 0;
    problems.forEach((p, idx) => {
      const probText = problemTexts.find(pt => pt.no === (idx + 1));
      const ptext = probText ? probText.text : '';
      
      if (ptext && ptext.length > 30) {
        const match = matchUnitByText(ptext, keywordMap);
        if (match) {
          p.book = match.book;
          p.unit = match.unit;
          p.subUnit = match.mid;
          p.soUnit = match.so;
          analyzed++;
        }
        
        const type = inferTypeFromText(ptext);
        if (type) p.type = type;
        
        const diff = inferDifficultyFromText(ptext, idx + 1, problems.length);
        if (diff) p.difficulty = diff;
      }
      
      // 매칭 실패한 부분은 위치 기반 휴리스틱으로 보완
      if (!p.unit) {
        const tempArr = [{ no: idx + 1, unit: '', subUnit: '', soUnit: '', type: '', difficulty: '' }];
        // 임시 분석 시 학년 기본 단원에서 위치별로 할당
        autoAnalyzeProblems(tempArr, grade, round, topic);
        if (tempArr[0].unit) {
          p.book = tempArr[0].book; p.unit = tempArr[0].unit;
          p.subUnit = tempArr[0].subUnit; p.soUnit = tempArr[0].soUnit;
        }
      }
      if (!p.type) p.type = inferTypeByPosition(idx + 1, problems.length);
      if (!p.difficulty) p.difficulty = inferDifficultyByPosition(idx + 1, problems.length);
    });
    
    return {
      mode: 'pdf_text',
      extracted: problemTexts.length,
      analyzed,
      detectedCount,
      totalText: text.length
    };
  } catch (err) {
    console.error('PDF 텍스트 분석 실패:', err);
    autoAnalyzeProblems(problems, grade, round, topic);
    return { mode: 'heuristic_error', error: err.message, detectedCount: null };
  }
}

function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    showToast('Excel 라이브러리 로드 실패', 'error');
    return;
  }
  const wb = XLSX.utils.book_new();

  // 1) 학생 명단
  const studentRows = [['학년','학생명','학교','선생님','전학기','목표(학생)','가능(강사)','목표(강사)']];
  state.students.filter(s => GRADES.includes(s.grade)).forEach(s => {
    studentRows.push([s.grade, s.name, s.school, s.teacher, s.prevScore, s.studentGoal, s.teacherPossible, s.teacherGoal]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(studentRows), '학생명단');

  // 2) 선생님별 점수 시트
  getAllTeachers().forEach(t => {
    const headers = ['학년','학교','이름','직전','목표(학생)','가능(강사)','목표(강사)'];
    for (let r = 1; r <= ROUNDS; r++) headers.push(r+'회', r+'회 오답');
    const rows = [headers];
    state.students.filter(s => s.teacher === t && GRADES.includes(s.grade)).forEach(s => {
      const row = [s.grade, s.school, s.name, s.prevScore, s.studentGoal, s.teacherPossible, s.teacherGoal];
      for (let r = 1; r <= ROUNDS; r++) {
        const rd = getRoundData(s.id, r);
        if (!rd) row.push('', '');
        else if (isAbsent(rd)) row.push('결시', '');
        else row.push(rd.score || '', rd.errors || '');
      }
      rows.push(row);
    });
    if (rows.length > 1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), t.slice(0, 30));
  });

  // 3) 학년별 종합
  const summary = [['학년']];
  for (let r = 1; r <= ROUNDS; r++) summary[0].push(r+'회 평균', r+'회 응시', r+'회 최고', r+'회 최저');
  GRADES.forEach(g => {
    const row = [g];
    for (let r = 1; r <= ROUNDS; r++) {
      const st = gradeRoundStats(g, r);
      row.push(st.avg != null ? Number(st.avg.toFixed(1)) : '', st.count, st.max || '', st.min || '');
    }
    summary.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), '학년별 종합');

  XLSX.writeFile(wb, `수만프_전체데이터_${dateStr()}.xlsx`);
  showToast('Excel 다운로드 완료');
}
