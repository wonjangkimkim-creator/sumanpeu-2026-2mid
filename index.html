  }
  const subHeader = el('tr', null, el('th', null, ''));
  for (let r = 1; r <= ROUNDS; r++) {
    ['평균','최고','최저','응시'].forEach((label, i) =>
      subHeader.appendChild(el('th', i === 0 ? { style: { borderLeft: '2px solid var(--line-2)' } } : null, label))
    );
  }

  const body = GRADES.map(g => {
    const cells = [el('td', null, el('span', { className: 'badge badge-grade-' + g }, g))];
    for (let r = 1; r <= ROUNDS; r++) {
      const st = gradeRoundStats(g, r);
      const rate = attendanceRate(st);
      const level = attendanceLevel(rate);
      cells.push(el('td', { className: 'num ' + scoreClass(st.avg), style: { borderLeft: '2px solid var(--line-2)' } }, st.avg != null ? fmt(st.avg) : '—'));
      cells.push(el('td', { className: 'num' }, st.max != null ? fmt(st.max, 0) : '—'));
      cells.push(el('td', { className: 'num' }, st.min != null ? fmt(st.min, 0) : '—'));
      cells.push(el('td', { className: 'num' }, 
        rate != null && st.count > 0 ?
          el('span', { className: 'attendance-badge ' + level },
            `${st.count}/${st.total}`,
            ` · ${Math.round(rate * 100)}%`
          ) :
          el('span', { className: 'muted' }, '—')
      ));
    }
    return el('tr', null, ...cells);
  });

  container.appendChild(el('div', { className: 'table-wrap mb-18' },
    el('table', { className: 'dt' },
      el('thead', null, header, subHeader),
      el('tbody', null, ...body)
    )
  ));

  // 각 학년별 차트
  container.appendChild(el('div', { className: 'card' },
    el('div', { className: 'card-title' }, el('div', { className: 'card-title-accent' }), '학년별 회차별 평균 · 최고 · 최저 추이'),

        ),

      ))
    )
  ));

  setTimeout(() => GRADES.forEach(g => renderGradeChart(g)), 60);
  return container;
}

function renderGradeChart(grade) {

  if (!ctx || typeof Chart === 'undefined') return;
  if (_charts['g_' + grade]) _charts['g_' + grade].destroy();

  const avgs = [], mins = [], maxs = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const st = gradeRoundStats(grade, r);
    avgs.push(st.avg); mins.push(st.min); maxs.push(st.max);
  }

  // 그라데이션 (평균선)
  const chartCtx = ctx.getContext('2d');
  const avgGradient = chartCtx.createLinearGradient(0, 0, 0, 260);
  avgGradient.addColorStop(0, 'rgba(181, 146, 79, 0.28)');
  avgGradient.addColorStop(1, 'rgba(181, 146, 79, 0)');

  _charts['g_' + grade] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: roundLabels(),
      datasets: [

          label: '최고',

          borderColor: '#15803d',

          tension: 0.35,
          spanGaps: true,
          pointRadius: 3.5,
          pointHoverRadius: 6,
          pointBackgroundColor: '#15803d',
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          fill: false
        },
        {
          label: '평균',
          data: avgs,
          borderColor: '#b5924f',
          backgroundColor: avgGradient,
          borderWidth: 3.5,
          tension: 0.35,
          spanGaps: true,
          pointRadius: 5,
          pointHoverRadius: 8,
          pointBackgroundColor: '#b5924f',
          pointBorderColor: '#fff',
          pointBorderWidth: 2.5,
          fill: true
        },
        {
          label: '최저',
          data: mins,
          borderColor: '#b91c3c',
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5, 4],
          tension: 0.35,
          spanGaps: true,
          pointRadius: 3.5,
          pointHoverRadius: 6,
          pointBackgroundColor: '#b91c3c',
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: {
            color: '#2d2d4a',
            font: { size: 11.5, weight: '600', family: "Pretendard, sans-serif" },
            padding: 12,
            usePointStyle: true,
            pointStyle: 'circle',
            boxWidth: 8,
            boxHeight: 8
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15, 39, 66, 0.96)',
          titleColor: '#d9bd82',
          titleFont: { size: 12.5, weight: '700' },
          bodyColor: '#fff',
          bodyFont: { size: 12 },
          padding: 12,

          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#555570', font: { size: 11, weight: '600' } },
          grid: { display: false },
          border: { color: '#d8cdb3' }
        },
        y: {

function renderTeacherGradeSection(teacher, grade, students) {
  const section = el('div', { className: 'card mb-18' },
    el('div', { className: 'card-title' },
      el('div', { className: 'card-title-accent' }),
      el('span', { className: 'badge badge-grade-' + grade, style: { marginRight: '8px' } }, grade),
      `${grade} 담당 (${students.length}명)`
    )
  );

  // ============================================================
  // 1. 우선 관리 대상 추천 (가장 위, 가장 중요)
  // ============================================================
  const priority = getPriorityStudents(teacher, grade, 5);
  if (priority.length > 0) {
    const priorityBox = el('div', { className: 'priority-box mb-18' },
      el('div', { className: 'priority-header' },
        el('span', { className: 'priority-icon' }, '🎯'),
        el('div', { className: 'priority-title' }, '다음 회차 우선 관리 대상'),
        el('div', { className: 'priority-sub' }, `${priority.length}명 추천`)
      )
    );
    
    priority.forEach((item, idx) => {
      const { student, analysis } = item;
      const cat = STUDENT_CATEGORIES[analysis.category] || STUDENT_CATEGORIES.pending;
      const actions = getRecommendedActions(analysis);
      
      // 학생 상태 요약 문구
      let summary = '';
      if (analysis.latestScore != null) {
        summary = `최근 ${fmt(analysis.latestScore, 0)}점`;
        if (analysis.gap != null) {
          summary += analysis.gap >= 0 ? ` (목표 +${fmt(analysis.gap, 0)})` : ` (목표 ${fmt(analysis.gap, 0)})`;
        }
        if (analysis.delta !== 0 && analysis.firstScore != null) {
          summary += ` · 첫 응시 대비 ${analysis.delta >= 0 ? '▲' : '▼'}${Math.abs(analysis.delta).toFixed(0)}점`;
        }
      }
      
      priorityBox.appendChild(el('div', { className: 'priority-item' },
        el('div', { className: 'priority-num' }, idx + 1),
        el('div', { className: 'priority-content' },
          el('div', { className: 'priority-name-row' },
            el('div', { className: 'priority-name' }, student.name,
              el('span', { className: 'priority-school' }, ` · ${student.school || ''}`)
            ),
            el('span', { className: 'priority-badge', style: { background: cat.color + '18', color: cat.color, border: '1px solid ' + cat.color + '40' } },
              cat.icon + ' ' + cat.label
            ),
            ...analysis.tags.slice(0, 2).map(t => el('span', { className: 'priority-tag' }, t))
          ),
          summary ? el('div', { className: 'priority-summary' }, summary) : null,
          actions.length > 0 ? el('div', { className: 'priority-actions' },
            el('strong', null, '추천: '),
            actions.join(' · ')
          ) : null
        )
      ));
    });
    section.appendChild(priorityBox);
  }

  // ============================================================
  // 2. 공통 약점 단원 (Excel 가져오기로 단원 정보가 있을 때만)
  // ============================================================
  const weakUnits = getCommonWeakUnits(teacher, grade, 5);
  if (weakUnits.length > 0) {
    const weakBox = el('div', { className: 'weak-units-box mb-18' },
      el('div', { className: 'weak-units-header' },
        el('span', { style: { fontSize: '20px' } }, '📚'),
        el('div', { className: 'weak-units-title' }, '우리 반 공통 약점 단원'),
        el('div', { className: 'weak-units-sub' }, '오답 빈도 기준 · 다음 수업에서 보강 권장')
      )
    );
    
    const maxCount = weakUnits[0].errorCount;
    weakUnits.forEach((w, idx) => {
      const pct = (w.errorCount / maxCount) * 100;
      const errorRateText = w.errorRate > 0 ? ` · 오답률 ${Math.round(w.errorRate * 100)}%` : '';
      weakBox.appendChild(el('div', { className: 'weak-unit-row' },
        el('div', { className: 'weak-unit-rank' }, idx + 1),
        el('div', { className: 'weak-unit-info' },
          el('div', { className: 'weak-unit-name' }, w.unit),
          el('div', { className: 'weak-unit-stat' },
            `오답 ${w.errorCount}개 · ${w.studentCount}명${errorRateText}`
          )
        ),
        el('div', { className: 'weak-unit-bar-wrap' },
          el('div', { className: 'weak-unit-bar', style: { width: pct + '%' } })
        )
      ));
    });
    section.appendChild(weakBox);
  }

  // ============================================================
  // 3. 회차별 담당 vs 전체 비교 한 줄 요약 (응시율 포함)
  // ============================================================
  const compareRow = el('div', { className: 'mb-12', style: { padding: '12px', background: 'var(--bg-elevated)', borderRadius: '8px', fontSize: '13px', lineHeight: '1.9' } });
  const summaryItems = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const tSt = teacherRoundStats(teacher, grade, r);
    if (tSt.avg == null) continue;
    const gSt = gradeRoundStats(grade, r);
    const diff = gSt.avg != null ? tSt.avg - gSt.avg : null;
    const diffStr = diff != null ? ` ${diff >= 0 ? '▲' : '▼'}${Math.abs(diff).toFixed(1)}` : '';
    const tRate = attendanceRate(tSt);
    const tLevel = attendanceLevel(tRate);
    const rateColor = tLevel === 'low' ? '#b91c1c' : tLevel === 'mid' ? '#b45309' : '#047857';
    summaryItems.push(el('span', { style: { display: 'inline-block', marginRight: '14px' } },
      el('strong', null, `${r}회: `),
      `${fmt(tSt.avg)}점${diffStr} `,
      el('span', { style: { color: rateColor, fontSize: '11px', fontFamily: 'JetBrains Mono, monospace', fontWeight: 700 } },
        `(${tSt.count}/${tSt.total} · ${Math.round(tRate*100)}%)`
      )
    ));
  }
  if (summaryItems.length > 0) {
    compareRow.appendChild(el('div', { style: { marginBottom: '6px' } },
      el('strong', { style: { color: 'var(--orange-deep)' } }, '📊 회차별 담당 평균 (vs 전체 · 응시율)')
    ));
    summaryItems.forEach(s => compareRow.appendChild(s));
    section.appendChild(compareRow);
  }

  // 학생 상세표
  section.appendChild(renderStudentDetailTable(students, grade));

  // 분석 코멘트
  section.appendChild(renderTeacherGradeComment(teacher, grade, students));

  return section;
}

function renderStudentDetailTable(students, grade) {
  const rows = students.map(s => {
    const analysis = analyzeStudent(s.id);
    const cat = STUDENT_CATEGORIES[analysis.category] || STUDENT_CATEGORIES.pending;
    
    const cells = [];
    // 학생명 + 분류 배지
    cells.push(el('td', null,
      el('div', { style: { fontWeight: 700 } }, s.name),
      el('div', { style: { marginTop: '3px' } },
        el('span', {
          className: 'student-category-badge',
          style: {
            background: cat.color + '15',
            color: cat.color,
            border: '1px solid ' + cat.color + '30'
          },
          title: cat.desc
        }, cat.icon + ' ' + cat.label)
      )
    ));
    cells.push(el('td', null, s.school || '—'));
    cells.push(el('td', { className: 'num muted' }, s.prevScore !== '' && s.prevScore != null ? s.prevScore : '—'));
    
    // 목표 + 진행률 바
    const goal = Number(s.teacherGoal) || Number(s.studentGoal);
    const goalStr = s.studentGoal !== '' && s.studentGoal != null ? s.studentGoal : '—';
    let goalCell;
    if (isNaN(goal) || analysis.latestScore == null || goal <= 0) {
      goalCell = el('td', { className: 'num' }, goalStr);
    } else {
      // 진행률 = 현재 점수 / 목표 점수 (직관적 비율)
      const rawPct = (analysis.latestScore / goal) * 100;
      const pct = Math.max(0, Math.min(100, rawPct));  // 표시용 (바 너비)
      const displayPct = Math.round(rawPct);  // 텍스트 표시용 (100% 초과도 보여줌)
      // 색상: 100% 이상 녹색(목표 달성), 80% 이상 노랑(근접), 미만 빨강
      const barColor = rawPct >= 100 ? '#16a34a' : rawPct >= 80 ? '#f59e0b' : '#dc2626';
      goalCell = el('td', { className: 'num', style: { minWidth: '110px' } },
        el('div', { style: { fontSize: '12px', marginBottom: '3px' } }, goalStr + '점'),
        el('div', { className: 'goal-progress-bar' },
          el('div', {
            className: 'goal-progress-fill',
            style: {
              width: pct + '%',
              background: barColor
            }
          })
        ),
        el('div', { style: { fontSize: '10px', color: barColor, fontWeight: 700, marginTop: '2px', fontFamily: 'JetBrains Mono, monospace' } },
          displayPct + '%' + (rawPct >= 100 ? ' ✓' : '')
        )
      );
    }
    cells.push(goalCell);

    for (let r = 1; r <= ROUNDS; r++) {
      const rd = getRoundData(s.id, r);
      if (!rd) { cells.push(el('td', { className: 'muted' }, '—')); continue; }
      if (isAbsent(rd)) { cells.push(el('td', { className: 'absent' }, '결시')); continue; }
      const sc = Number(rd.score);
      if (isNaN(sc)) { cells.push(el('td', null, '—')); continue; }
      cells.push(el('td', { className: 'num ' + scoreClass(sc) }, fmt(sc)));
    }

    // 추세
    if (analysis.firstScore != null && analysis.latestScore != null) {
      const trend = analysis.delta;
      cells.push(el('td', { className: 'num ' + (trend > 0 ? 'delta-up' : trend < 0 ? 'delta-down' : 'delta-flat') },
        (trend > 0 ? '▲' : trend < 0 ? '▼' : '—') + Math.abs(trend).toFixed(1)
      ));
    } else {
      cells.push(el('td', { className: 'muted' }, '—'));
    }
    return el('tr', null, ...cells);
  });

  return el('div', { className: 'table-wrap mb-12' },
    el('table', { className: 'dt' },
      el('thead', null,
        el('tr', null,
          el('th', null, '학생명'), el('th', null, '학교'), el('th', null, '직전'),
          el('th', null, '목표'),
          ...roundLabels().map(lb => el('th', null, lb)),
          el('th', null, '추세')
        )
      ),
      el('tbody', null, ...rows)
    )
  );
}

function renderTeacherGradeComment(teacher, grade, students) {
  const lines = [];

  // 회차별 평균 변화 분석
  const tAvgs = [], gAvgs = [];
  for (let r = 1; r <= ROUNDS; r++) {
    tAvgs.push(teacherRoundStats(teacher, grade, r).avg);
    gAvgs.push(gradeRoundStats(grade, r).avg);
  }

  // 첫 회차 비교
  if (tAvgs[0] != null && gAvgs[0] != null) {
    const diff = tAvgs[0] - gAvgs[0];
    lines.push(`📊 1회 담당 평균 ${fmt(tAvgs[0])}점 — 학년 전체(${fmt(gAvgs[0])}점) 대비 ${diff >= 0 ? '+' : ''}${fmt(diff)}점`);
  }

  // 추세 분석 (n회 → n+1회)
  for (let r = 1; r < ROUNDS; r++) {
    if (tAvgs[r-1] != null && tAvgs[r] != null) {
      const d = tAvgs[r] - tAvgs[r-1];
      const arrow = d >= 0 ? '📈' : '📉';
      lines.push(`${arrow} ${r}→${r+1}회 담당 평균 변화: ${d >= 0 ? '+' : ''}${fmt(d)}점`);
    }
  }

  // 목표 달성률 (1회)
  const goalSet = students.filter(s => s.studentGoal && !isNaN(Number(s.studentGoal)));
  if (goalSet.length > 0) {
    const r1Achieved = goalSet.filter(s => {
      const sc = getScore(getRoundData(s.id, 1));
      return sc != null && sc >= Number(s.studentGoal);
    }).length;
    lines.push(`🎯 1회 목표 달성: ${r1Achieved}/${goalSet.length}명 (${Math.round(r1Achieved/goalSet.length*100)}%)`);
  }

  // 상승/하락 학생
  const movers = students.map(s => {
    let first = null, last = null;
    for (let r = 1; r <= ROUNDS; r++) {
      const sc = getScore(getRoundData(s.id, r));
      if (sc == null) continue;
      if (first == null) first = sc;
      last = sc;
    }
    if (first == null || last == null) return null;
    return { name: s.name, diff: last - first };
  }).filter(Boolean);

  const upMovers = movers.filter(m => m.diff >= 10).sort((a,b) => b.diff - a.diff).slice(0, 3);
  const downMovers = movers.filter(m => m.diff <= -10).sort((a,b) => a.diff - b.diff).slice(0, 3);
  if (upMovers.length > 0) lines.push(`📈 상승 학생: ${upMovers.map(m => `${m.name} (+${m.diff.toFixed(1)})`).join(', ')}`);
  if (downMovers.length > 0) lines.push(`📉 하락 학생: ${downMovers.map(m => `${m.name} (${m.diff.toFixed(1)})`).join(', ')} — 추가 점검 권장`);

  // 공통 오답 TOP 3 (1회 기준)
  const w1 = commonWrongs(grade, 1, 3);
  if (w1.entries.length > 0) {
    lines.push(`🔴 1회 공통 오답 TOP3: ${w1.entries.map(([n,c]) => `${n}번(${c}/${w1.total}명)`).join(', ')}`);
  }

  // 종합 코멘트
  const overallAvg = avg(tAvgs);
  if (overallAvg != null) {
    if (overallAvg >= 80) lines.push('💬 전반적으로 우수한 수준입니다. 목표 달성률 향상에 집중하세요.');
    else if (overallAvg >= 65) lines.push('💬 안정적인 수준입니다. 약점 보완으로 한 단계 상승 가능합니다.');
    else lines.push('💬 기초 보강이 필요합니다. 공통 오답 유형 집중 학습을 권장합니다.');
  }

  return el('div', {
    style: {
      background: 'var(--orange-soft)',
      border: '1px solid var(--line-2)',
      borderLeft: '3px solid var(--orange-deep)',
      borderRadius: '8px',
      padding: '14px 16px',
      fontSize: '13px',
      lineHeight: '1.9'
    }
  },
    el('div', { style: { fontWeight: 700, color: 'var(--orange-deep)', marginBottom: '8px', fontFamily: 'Noto Serif KR, serif', fontSize: '14px' } }, '💬 종합 분석'),
    ...lines.map(l => el('div', null, l))
  );
}

function exportTeacherReport(teacher) {
  if (!teacher) return;
  const wb = XLSX.utils.book_new();
  const ts = state.students.filter(s => s.teacher === teacher && GRADES.includes(s.grade));
  const grades = Array.from(new Set(ts.map(s => s.grade))).sort();

  grades.forEach(g => {
    const headers = ['학년','학교','이름','직전학기','목표(학생)','가능(강사)','목표(강사)'];
    for (let r = 1; r <= ROUNDS; r++) headers.push(r + '회', r + '회 오답');
    const rows = [headers];
    ts.filter(s => s.grade === g).forEach(s => {
      const row = [s.grade, s.school, s.name, s.prevScore, s.studentGoal, s.teacherPossible, s.teacherGoal];
      for (let r = 1; r <= ROUNDS; r++) {
        const rd = getRoundData(s.id, r);
        if (!rd) row.push('', '');
        else if (isAbsent(rd)) row.push('결시', '');
        else row.push(rd.score || '', rd.errors || '');
      }
      rows.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), g);
  });

  XLSX.writeFile(wb, `${teacher}_수만프리포트_${dateStr()}.xlsx`);
  showToast('Excel 다운로드 완료');
}

function renderParentStudentList() {
  const f = ui.reportFilter;
  const students = state.students.filter(s => {
    if (!GRADES.includes(s.grade)) return false;
    if (f.grade && f.grade !== 'all' && s.grade !== f.grade) return false;
    if (f.teacher && f.teacher !== 'all' && s.teacher !== f.teacher) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!s.name.toLowerCase().includes(q)) return false;
    }
    return true;
  });

  if (students.length === 0) {
    return el('div', { className: 'empty' },
      el('div', { className: 'empty-icon' }, '🔍'),
      el('div', { className: 'empty-text' }, '조건에 맞는 학생이 없습니다')
    );
  }

  const cards = students.map(s => {
    const scores = [];
    for (let r = 1; r <= ROUNDS; r++) {
      const rd = getRoundData(s.id, r);
      if (!rd) scores.push(null);
      else if (isAbsent(rd)) scores.push('absent');
      else scores.push(rd.score);
    }
    const validScores = scores.filter(x => x != null && x !== '' && x !== 'absent').map(Number);
    const myAvg = validScores.length > 0 ? avg(validScores) : null;
    const taken = scores.filter(x => x != null && x !== '').length;

    return el('div', {
      className: 'student-card',
      onClick: () => openParentReportModal(s.id)
    },
      el('div', { className: 'student-card-head' },
        el('div', { className: 'student-card-name' }, s.name,
          el('span', { className: 'badge badge-grade-' + s.grade, style: { marginLeft: '4px', fontSize: '10.5px' } }, s.grade)
        ),
        el('div', { className: 'text-sm muted' }, s.teacher || '')
      ),
      el('div', { className: 'student-card-info' }, s.school || ''),
      el('div', { className: 'dot-row mb-12' },
        ...scores.map((sc, i) => el('div', {
          className: 'dot ' + dotClass(sc),
          title: `${i+1}회: ${sc === 'absent' ? '결시' : (sc != null && sc !== '' ? sc + '점' : '미응시')}`
        }, i+1))
      ),
      el('div', { className: 'text-sm flex-between' },
        el('span', { className: 'muted' }, `응시 ${taken}/${ROUNDS}회`),
        myAvg != null ?

// ============================================================
function reportImageFileName(s) {
  return `${s.name}_${s.grade}_수만프리포트_${dateStr()}.png`;
}

async function saveReportImage(sid) {
  const s = getStudent(sid);
  if (!s) return false;
  if (typeof html2canvas === 'undefined') {
    showToast('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', 'error');
    return false;
  }
  // 화면 밖에 리포트를 그린 뒤 이미지로 변환 (버튼·상단바 없는 깨끗한 결과물)
  const holder = el('div', {
    style: {
      position: 'fixed', left: '-12000px', top: '0',
      width: '1000px', background: '#faf9f5', padding: '0', zIndex: '-1'
    }
  });
  const dom = buildSharedReportDOM(sid);
  holder.appendChild(dom);
  document.body.appendChild(holder);
  const topbar = dom.querySelector('.report-topbar');
  if (topbar) topbar.remove();

  try {
    await new Promise(r => setTimeout(r, 950));   // 차트 그려질 시간
    const target = dom.querySelector('.report-wrap') || dom;
    const canvas = await html2canvas(target, {
      scale: 2,
      backgroundColor: '#faf9f5',
      useCORS: true,
      logging: false,
      windowWidth: 1000
    });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('canvas toBlob 실패');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = reportImageFileName(s);
    a.href = url;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) {
    console.error('[리포트 이미지]', e);
    showToast('이미지 저장에 실패했습니다', 'error');
    return false;
  } finally {
    holder.remove();
  }
}

async function saveReportImageWithToast(sid) {
  const s = getStudent(sid);
  showToast('이미지를 만드는 중입니다…');

function buildSharedReportDOM(sid) {
  const s = getStudent(sid);

  // 데이터 수집
  const myRounds = [];
  const gradeAvgs = [];  // 값만 (차트/계산용)
  const gradeStats = []; // 전체 stat (응시율 표시용)
  const wrongs = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    myRounds.push(rd);
    const gs = gradeRoundStats(s.grade, r);
    gradeAvgs.push(gs.avg);
    gradeStats.push(gs);
    if (rd && !isAbsent(rd) && rd.errors) {
      const errList = parseErrors(rd.errors);
      if (errList.length > 0) {
        wrongs.push({ round: r, errors: errList, version: rd.version || '' });
      }
    }
  }
  const validScores = myRounds.map(rd => getScore(rd)).filter(x => x != null);
  const myAvg = avg(validScores);
  // 본인 응시 현황 (전체 학생 수는 노출하지 않고 회차 기준으로만 계산)
  const myTaken = validScores.length;
  const myAbsent = myRounds.filter(rd => isAbsent(rd)).length;
  const myRate = ROUNDS > 0 ? Math.round(myTaken / ROUNDS * 100) : null;
  const firstScore = validScores[0];
  const lastScore = validScores[validScores.length - 1];

  const page = el('div', { className: 'report-page' });

        el('div', { className: 'report-hero-meta-name' }, s.name,
          el('span', {
            style: {
              fontSize: '11.5px',

          }, s.grade)
        ),
        el('div', { className: 'report-hero-meta-info' }, `${s.school || ''}${s.school && s.teacher ? ' · ' : ''}${s.teacher ? '담당: ' + s.teacher : ''}`)
      ),
      el('div', { className: 'report-hero-stat' },
        el('div', { className: 'report-hero-stat-label' }, '평균 점수'),
        el('div', { className: 'report-hero-stat-value' }, myAvg != null ? fmt(myAvg) : '—',
          myAvg != null ? el('span', { style: { fontSize: '14px', opacity: '0.8', marginLeft: '2px' } }, '점') : null
        ),
        el('div', { className: 'report-hero-stat-rate' },
          '응시율 ', el('strong', null, myRate != null ? myRate + '%' : '—'),
          el('span', { style: { opacity: '0.75' } }, `  (${ROUNDS}회 중 ${myTaken}회 응시${myAbsent > 0 ? ' · 결시 ' + myAbsent + '회' : ''})`)
        )
      )
    )
  ));

  // === 1. 목표 점수 ===
  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '🎯'),
      el('div', { className: 'report-section-title' }, '목표 점수')
    ),
    el('div', { className: 'goals-row' },
      goalBox('전학기', s.prevScore, 'muted'),
      goalBox('학생 목표', s.studentGoal, 'navy'),
      goalBox('가능 (강사)', s.teacherPossible, 'green'),
      goalBox('목표 (강사)', s.teacherGoal, 'orange')
    )
  ));

  // === 2. 회차별 점수 ===
  const roundCards = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = myRounds[r-1];
    const ga = gradeAvgs[r-1];
    const gst = gradeStats[r-1];
    let scoreClass = 'empty', scoreText = '—', deltaNode = null, avgNode = null, rateNode = null;
    let hasData = false;

    if (rd) {
      if (isAbsent(rd)) {
        scoreClass = 'absent';
        scoreText = '결시';
        hasData = true;
      } else {
        const n = Number(rd.score);
        if (!isNaN(n) && rd.score !== '' && rd.score != null) {
          hasData = true;
          scoreText = fmt(n);
          scoreClass = n >= 80 ? 'high' : n >= 60 ? 'mid' : 'low';
          if (ga != null) {
            const d = n - ga;
            deltaNode = el('div', {
              className: 'round-card-delta ' + (d >= 0 ? 'delta-up' : 'delta-down')
            }, (d >= 0 ? '▲' : '▼') + Math.abs(d).toFixed(1));
            avgNode = el('div', { className: 'round-card-avg' }, '평균 ' + fmt(ga));
            const gRate = attendanceRate(gst);
            if (gRate != null) {
              rateNode = el('div', { className: 'round-card-rate' }, '학년 응시율 ' + Math.round(gRate * 100) + '%');
            }
          }
        }
      }
    }

    roundCards.push(el('div', { className: 'round-card' + (hasData ? ' has-data' : '') },
      el('div', { className: 'round-card-no' }, `${r}회`),
      el('div', { className: 'round-card-score ' + scoreClass },
        scoreText,
        (hasData && scoreClass !== 'absent' && scoreClass !== 'empty') ?
          el('span', { style: { fontSize: '12px', opacity: '0.8', marginLeft: '1px' } }, '점') : null
      ),
      avgNode,
      deltaNode,
      rateNode
    ));
  }

  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '📊'),
      el('div', { className: 'report-section-title' }, '회차별 점수'),
      el('div', { className: 'report-section-sub' }, '학년 평균 대비 추이')
    ),
    el('div', { className: 'rounds-grid' }, ...roundCards)
  ));

  // === 3. 추이 차트 ===
  const chartId = 'shared-trend-' + sid + '-' + (++_sharedChartSeq);
  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '📈'),
      el('div', { className: 'report-section-title' }, '추이 분석'),
      firstScore != null && lastScore != null ?
        el('div', { className: 'report-section-sub' },
          `${fmt(firstScore)}점 → ${fmt(lastScore)}점 (${lastScore - firstScore >= 0 ? '▲' : '▼'}${Math.abs(lastScore - firstScore).toFixed(1)})`
        ) : null
    ),
    el('div', { className: 'chart-box' }, el('canvas', { id: chartId }))
  ));

  // === 4. 오답 분석 ===
  const wrongSection = el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '🔍'),
      el('div', { className: 'report-section-title' }, '회차별 오답 분석')
    )
  );

  if (wrongs.length === 0) {
    wrongSection.appendChild(el('div', { className: 'muted', style: { padding: '20px 0', textAlign: 'center' } },
      '아직 오답 데이터가 없습니다.'
    ));
  } else {
    wrongs.forEach(w => {
      const paper = getPaperForStudent(s.grade, w.round, w.version);
      const hasPaperProblems = paper && paper.problems && paper.problems.length > 0 &&
                               paper.problems.some(p => p.unit || p.type || p.difficulty);
      // 통합 PDF (구버전 testPdf도 호환)
      const paperPdf = paper && (paper.paperPdf || paper.testPdf);
      const hasPdf = !!paperPdf;

      const roundCard = el('div', { className: 'wrong-round-card' },
        el('div', { className: 'wrong-round-head' },
          el('div', { className: 'wrong-round-title' },
            el('span', { className: 'wrong-round-title-num' }, `${w.round}회`),
            `오답 ${w.errors.length}문항`
          ),
          el('div', { className: 'wrong-badges' },
            ...w.errors.map(n => el('span', { className: 'wrong-num-badge' }, n + '번'))
          )
        )
      );

      // 주제 + PDF 링크
      if (paper) {
        const metaBar = el('div', { className: 'wrong-round-meta' });
        if (paper.topic) {
          metaBar.appendChild(el('div', { className: 'wrong-round-topic' },
            el('span', { className: 'wrong-round-topic-label' }, '주제'),
            el('span', { className: 'wrong-round-topic-value' }, paper.topic)
          ));
        }
        if (hasPdf) {
          const pdfLinks = el('div', { className: 'wrong-round-pdf-links' });
          pdfLinks.appendChild(el('button', {
            className: 'pdf-link-btn',
            onClick: () => openPdfBlob(paperPdf, pdfKey(s.grade, w.round))
          }, '📄 시험지 · 해설지 PDF'));
          metaBar.appendChild(pdfLinks);
        }
        if (paper.topic || hasPdf) roundCard.appendChild(metaBar);
      }

      // 학부모 친화적 요약: 회차별로 단원만 묶어서 간결하게 표시
      if (hasPaperProblems) {
        // 회차 내 단원별 그룹핑 (대단원 기준)
        const unitGroups = {};  // unit → [번호 리스트]
        const unanalyzedNums = [];
        
        w.errors.forEach(n => {
          const p = paper.problems[n - 1];
          if (!p) { unanalyzedNums.push(n); return; }
          if (!p.unit && !p.type && !p.difficulty) {
            unanalyzedNums.push(n);
            return;
          }
          // 대단원 키 (없으면 기타로)
          const unitKey = p.unit || '기타';
          if (!unitGroups[unitKey]) unitGroups[unitKey] = [];
          unitGroups[unitKey].push({ n, p });
        });
        
        const unitKeys = Object.keys(unitGroups);
        if (unitKeys.length > 0) {
          const summaryList = el('div', { className: 'wrong-summary-list' });
          unitKeys.forEach(unitKey => {
            const items = unitGroups[unitKey];
            const nums = items.map(it => it.n).sort((a, b) => a - b);
            
            // 이 단원에서 가장 자주 나오는 난이도 표시
            const diffCount = {};
            items.forEach(it => {
              if (it.p.difficulty) diffCount[it.p.difficulty] = (diffCount[it.p.difficulty] || 0) + 1;
            });
            const topDiff = Object.entries(diffCount).sort((a, b) => b[1] - a[1])[0];
            
            summaryList.appendChild(el('div', { className: 'wrong-unit-row' },
              el('div', { className: 'wrong-unit-info' },
                el('div', { className: 'wrong-unit-name' }, unitKey),
                el('div', { className: 'wrong-unit-count' }, items.length + '문항 오답')
              ),
              el('div', { className: 'wrong-unit-nums' },
                ...nums.map(n => el('span', { className: 'wrong-num-chip' }, n + '번'))
              ),
              topDiff ? el('div', { className: 'wrong-unit-diff' },
                (() => {
                  const d = TAG_SYSTEM.difficulties.find(x => x.level === topDiff[0]);
                  return d ? d.symbol : topDiff[0];
                })()
              ) : null
            ));
          });
          roundCard.appendChild(summaryList);
        }
        
        if (unanalyzedNums.length > 0 && unitKeys.length === 0) {
          roundCard.appendChild(el('div', { className: 'wrong-unanalyzed-note' },
            `${unanalyzedNums.join('번, ')}번 문항`
          ));
        }
      } else if (paper) {
        roundCard.appendChild(el('div', { className: 'wrong-unanalyzed-note' },
          '※ 시험지 문항 분류가 입력되면 상세 약점 분석이 표시됩니다.'
        ));
      } else {
        roundCard.appendChild(el('div', { className: 'wrong-unanalyzed-note' },
          '※ 시험지가 업로드되면 문항별 상세 분석이 자동으로 표시됩니다.'
        ));
      }

      wrongSection.appendChild(roundCard);
    });
  }
  wrap.appendChild(wrongSection);

  // === 5. 약점 영역 분석 ===
  const weakSec = buildWeaknessSection(sid);
  if (weakSec) wrap.appendChild(weakSec);

  // === 6. 종합 분석 ===
  wrap.appendChild(el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '💬'),
      el('div', { className: 'report-section-title' }, '종합 분석')
    ),
    el('div', { className: 'analysis-list' },
      ...generateStudentAnalysisLines(sid).map(l => el('div', { className: 'analysis-item' }, l))
    )
  ));

  // 푸터
  wrap.appendChild(el('div', {
    style: {
      textAlign: 'center',
      padding: '24px 20px',
      color: 'var(--ink-mute)',
      fontSize: '11.5px',
      letterSpacing: '0.5px',
      marginTop: '8px'
    }
  },
    el('div', { style: { marginBottom: '4px' } }, `생성일: ${dateStr()}`),
    el('div', null, '클라디수학학원 · 수만프 분석 시스템')
  ));

  page.appendChild(wrap);
  setTimeout(() => renderSharedTrendChart(sid, myRounds, gradeAvgs, chartId), 60);
  return page;
}

// 약점 영역 분석 섹션
function buildWeaknessSection(sid) {
  const s = getStudent(sid);
  const unitCounter = {}, typeCounter = {}, diffCounter = {};
  let totalAnalyzed = 0;

  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (!rd || isAbsent(rd) || !rd.errors) continue;
    const paper = getPaperForStudent(s.grade, r, rd.version);
    if (!paper || !paper.problems) continue;
    const errors = parseErrors(rd.errors);
    errors.forEach(n => {
      const p = paper.problems[n - 1];
      if (!p) return;
      if (!p.unit && !p.type && !p.difficulty) return;
      totalAnalyzed++;
      if (p.unit) {
        const key = p.unit;  // 대단원만 (학부모용 요약)
        unitCounter[key] = (unitCounter[key] || 0) + 1;
      }
      if (p.type) typeCounter[p.type] = (typeCounter[p.type] || 0) + 1;
      if (p.difficulty) diffCounter[p.difficulty] = (diffCounter[p.difficulty] || 0) + 1;
    });
  }

  if (totalAnalyzed === 0) return null;

  const topUnits = Object.entries(unitCounter).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const topTypes = Object.entries(typeCounter).sort((a,b) => b[1] - a[1]).slice(0, 4);
  const diffEntries = Object.entries(diffCounter).sort((a,b) => {
    const order = ['최하','하','중','상','최상'];
    return order.indexOf(a[0]) - order.indexOf(b[0]);
  });
  
  // 가장 약한 단원 1개 (강조)
  const topUnit = topUnits[0];
  const topUnitRatio = topUnit ? (topUnit[1] / totalAnalyzed * 100) : 0;

  const sec = el('div', { className: 'report-section' },
    el('div', { className: 'report-section-header' },
      el('div', { className: 'report-section-icon' }, '🎯'),
      el('div', { className: 'report-section-title' }, '약점 영역 분석'),
      el('div', { className: 'report-section-sub' }, `총 ${totalAnalyzed}개 오답 분석`)
    )
  );

  // 핵심 메시지 (가장 약한 단원 강조)
  if (topUnit) {
    sec.appendChild(el('div', { className: 'weakness-headline' },
      el('div', { className: 'weakness-headline-icon' }, '⚠️'),
      el('div', { className: 'weakness-headline-content' },
        el('div', { className: 'weakness-headline-label' }, '집중 보완이 필요한 단원'),
        el('div', { className: 'weakness-headline-unit' }, topUnit[0]),
        el('div', { className: 'weakness-headline-stat' },
          `오답 ${topUnit[1]}개 · 전체 오답의 `,
          el('strong', null, topUnitRatio.toFixed(0) + '%')
        )
      )
    ));
  }

  // 단원별 오답 분포 (진행률 바)
  if (topUnits.length > 0) {
    const unitChart = el('div', { className: 'weakness-bar-group' },
      el('div', { className: 'weakness-bar-title' }, '단원별 오답 분포')
    );
    const maxCount = topUnits[0][1];
    topUnits.forEach(([u, c]) => {
      const pct = (c / maxCount) * 100;
      const ratio = c / totalAnalyzed;
      const colorClass = ratio > 0.35 ? 'bar-high' : ratio > 0.20 ? 'bar-mid' : 'bar-low';
      unitChart.appendChild(el('div', { className: 'weakness-bar-row' },
        el('div', { className: 'weakness-bar-label' }, u),
        el('div', { className: 'weakness-bar-track' },
          el('div', { className: 'weakness-bar-fill ' + colorClass, style: { width: pct + '%' } })
        ),
        el('div', { className: 'weakness-bar-value' }, c + '개')
      ));
    });
    sec.appendChild(unitChart);
  }

  // 유형별·난이도별은 작은 칩 형식으로 (한눈에)
  const subBox = el('div', { className: 'weakness-sub-box' });
  
  if (topTypes.length > 0) {
    subBox.appendChild(el('div', { className: 'weakness-sub-col' },
      el('div', { className: 'weakness-sub-title' }, '유형별 오답'),
      el('div', { className: 'weakness-chips' },
        ...topTypes.map(([t, c]) => el('span', { className: 'weakness-chip' },
          t,
          el('span', { className: 'weakness-chip-count' }, c)
        ))
      )
    ));
  }

  if (diffEntries.length > 0) {
    subBox.appendChild(el('div', { className: 'weakness-sub-col' },
      el('div', { className: 'weakness-sub-title' }, '난이도별 오답'),
      el('div', { className: 'weakness-chips' },
        ...diffEntries.map(([d, c]) => {
          const dInfo = TAG_SYSTEM.difficulties.find(x => x.level === d);
          return el('span', { className: 'weakness-chip' },
            (dInfo ? dInfo.symbol + ' ' : '') + d,
            el('span', { className: 'weakness-chip-count' }, c)
          );
        })
      )
    ));
  }
  
  if (subBox.children.length > 0) sec.appendChild(subBox);

  return sec;
}

// goalBox 헬퍼
function goalBox(label, value, color) {
  const disp = (value != null && value !== '' && value !== 'X' && value !== 'x') ?
    value + '점' :
    (value === 'X' || value === 'x' ? '해당없음' : '—');
  return el('div', { className: 'goal-box ' + color },
    el('div', { className: 'goal-box-label' }, label),
    el('div', { className: 'goal-box-value' }, disp)
  );
}

function renderSharedTrendChart(sid, myRounds, gradeAvgs, chartId) {
  const ctx = document.getElementById(chartId);
  if (!ctx || typeof Chart === 'undefined') return;
  if (_charts[chartId]) _charts[chartId].destroy();

  const s = getStudent(sid);
  const myData = myRounds.map(rd => {
    if (!rd || isAbsent(rd)) return null;
    const n = Number(rd.score);
    return isNaN(n) ? null : n;
  });
  const goalLine = s.studentGoal && !isNaN(Number(s.studentGoal)) ? Number(s.studentGoal) : null;
  const teacherGoal = s.teacherGoal && !isNaN(Number(s.teacherGoal)) ? Number(s.teacherGoal) : null;

  // 그라데이션 만들기
  const chartCtx = ctx.getContext('2d');
  const orangeGradient = chartCtx.createLinearGradient(0, 0, 0, 280);
  orangeGradient.addColorStop(0, 'rgba(181, 146, 79, 0.32)');
  orangeGradient.addColorStop(0.5, 'rgba(181, 146, 79, 0.12)');
  orangeGradient.addColorStop(1, 'rgba(181, 146, 79, 0.01)');

  const navyGradient = chartCtx.createLinearGradient(0, 0, 0, 280);
  navyGradient.addColorStop(0, 'rgba(15, 39, 66, 0.08)');
  navyGradient.addColorStop(1, 'rgba(15, 39, 66, 0)');

  const datasets = [
    {
      label: s.name + ' 점수',
      data: myData,
      borderColor: '#b5924f',
      backgroundColor: orangeGradient,
      borderWidth: 3.5,
      pointRadius: 6,
      pointHoverRadius: 9,
      pointBackgroundColor: '#b5924f',
      pointBorderColor: '#fff',
      pointBorderWidth: 3,
      pointHoverBackgroundColor: '#8c6c33',
      pointHoverBorderColor: '#fff',
      pointHoverBorderWidth: 3,
      tension: 0.35,
      spanGaps: true,
      fill: true,
      order: 1
    },
    {
      label: s.grade + ' 학년 평균',
      data: gradeAvgs,
      borderColor: '#0f2742',
      backgroundColor: 'transparent',
      borderWidth: 2.5,
      borderDash: [6, 5],
      pointRadius: 4,
      pointHoverRadius: 7,
      pointBackgroundColor: '#0f2742',
      pointBorderColor: '#fff',
      pointBorderWidth: 2,
      tension: 0.35,
      spanGaps: true,
      fill: false,
      order: 2
    }
  ];

  if (goalLine != null) {
    datasets.push({
      label: '학생 목표 ' + goalLine + '점',
      data: Array(8).fill(goalLine),
      borderColor: 'rgba(21, 128, 61, 0.85)',
      backgroundColor: 'transparent',
      borderWidth: 2,
      borderDash: [10, 6],
      pointRadius: 0,
      pointHoverRadius: 0,
      tension: 0,
      fill: false,
      order: 3
    });
  }
  if (teacherGoal != null && teacherGoal !== goalLine) {
    datasets.push({
      label: '강사 목표 ' + teacherGoal + '점',
      data: Array(8).fill(teacherGoal),
      borderColor: 'rgba(140, 108, 51, 0.7)',
      backgroundColor: 'transparent',
      borderWidth: 1.8,
      borderDash: [4, 4],
      pointRadius: 0,
      pointHoverRadius: 0,
      tension: 0,
      fill: false,
      order: 4
    });
  }

  _charts[chartId] = new Chart(ctx, {
    type: 'line',
    data: { labels: roundLabels(), datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: {
            color: '#2d2d4a',
            font: { size: 12.5, family: "Pretendard, sans-serif", weight: '600' },
            padding: 14,
            usePointStyle: true,
            pointStyle: 'circle',
            boxWidth: 8,
            boxHeight: 8
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15, 39, 66, 0.96)',
          titleColor: '#d9bd82',
          titleFont: { size: 13, weight: '700', family: "Pretendard, sans-serif" },
          titleMarginBottom: 8,
          bodyColor: '#ffffff',
          bodyFont: { size: 12.5, family: "Pretendard, sans-serif" },
          bodySpacing: 6,
          padding: 14,
          cornerRadius: 10,
          displayColors: true,
          boxPadding: 6,
          borderColor: 'rgba(181, 146, 79, 0.35)',
          borderWidth: 1,
          callbacks: {
            label: function(context) {
              const v = context.parsed.y;
              if (v == null) return context.dataset.label + ': —';
              return context.dataset.label + ': ' + (Math.round(v * 10) / 10) + '점';
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: '#555570',
            font: { size: 12, weight: '600', family: "Pretendard, sans-serif" }
          },
          grid: { display: false },
          border: { color: '#d8cdb3' }
        },
        y: {
          ticks: {
            color: '#9090a8',
            font: { size: 11.5, family: "JetBrains Mono, monospace" },
            callback: v => v + '점',
            stepSize: 20
          },
          grid: { color: 'rgba(184, 168, 122, 0.18)', lineWidth: 1 },
          border: { display: false },
          min: 0, max: 100
        }
      },
      animation: {
        duration: 800,
        easing: 'easeOutQuart'
      }
    }
  });
}

function generateStudentAnalysisLines(sid) {
  const s = getStudent(sid);
  const lines = [];
  const validScores = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (rd && !isAbsent(rd)) {
      const n = Number(rd.score);
      if (!isNaN(n)) validScores.push({ round: r, score: n });
    }
  }
  if (validScores.length === 0) return ['아직 응시한 시험이 없어 분석이 어렵습니다.'];

  const myAvg = avg(validScores.map(v => v.score));
  const gradeAvgScores = [];
  for (let r = 1; r <= ROUNDS; r++) {
    const ga = gradeRoundStats(s.grade, r).avg;
    if (ga != null) gradeAvgScores.push(ga);
  }
  const gradeAvg = avg(gradeAvgScores);

  // 전체 위치
  if (gradeAvg != null && myAvg != null) {
    const diff = myAvg - gradeAvg;
    if (diff > 5) lines.push(`📈 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)보다 ${fmt(diff)}점 높은 우수한 수준입니다.`);
    else if (diff > 0) lines.push(`📊 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)을 약간 상회하고 있습니다.`);
    else if (diff > -5) lines.push(`📊 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)에 근접한 점수를 유지하고 있습니다.`);
    else lines.push(`📉 ${s.name} 학생은 ${s.grade} 평균(${fmt(gradeAvg)}점)보다 ${fmt(Math.abs(diff))}점 낮습니다. 보완이 필요합니다.`);
  }

  // 응시율 (전체 학생 수는 노출하지 않고 본인 회차 기준으로만)
  const takenCount = validScores.length;
  const absentCount = countAbsent(sid);
  const rate = ROUNDS > 0 ? Math.round(takenCount / ROUNDS * 100) : null;
  if (rate != null) {
    if (rate >= 100) lines.push(`🗓 ${ROUNDS}회 전 회차에 모두 응시했습니다 (응시율 100%). 성실한 참여가 성적 향상의 바탕이 됩니다.`);
    else if (rate >= 75) lines.push(`🗓 응시율 ${rate}% (${ROUNDS}회 중 ${takenCount}회 응시${absentCount ? ' · 결시 ' + absentCount + '회' : ''}) — 꾸준히 참여하고 있습니다.`);
    else if (rate >= 50) lines.push(`🗓 응시율 ${rate}% (${ROUNDS}회 중 ${takenCount}회 응시${absentCount ? ' · 결시 ' + absentCount + '회' : ''}) — 남은 회차 응시가 성적 흐름 파악에 중요합니다.`);
    else lines.push(`⚠ 응시율 ${rate}% (${ROUNDS}회 중 ${takenCount}회 응시${absentCount ? ' · 결시 ' + absentCount + '회' : ''}) — 응시 횟수가 적어 분석의 정확도가 낮습니다. 남은 회차 참여를 부탁드립니다.`);
  }

  // 추세
  if (validScores.length >= 3) {
    const first = validScores[0];
    const last = validScores[validScores.length-1];
    const trend = last.score - first.score;
    if (trend >= 10) lines.push(`💪 ${first.round}회(${fmt(first.score)}점) → ${last.round}회(${fmt(last.score)}점)로 ${fmt(trend)}점 향상되어 매우 긍정적입니다.`);
    else if (trend >= 0) lines.push(`✅ 점수가 안정적으로 유지되고 있습니다 (변화 ${fmt(trend)}점).`);
    else if (trend >= -5) lines.push(`📊 약간의 등락은 있으나 큰 변동은 없습니다 (변화 ${fmt(trend)}점).`);
    else lines.push(`⚠ ${first.round}회(${fmt(first.score)}점) → ${last.round}회(${fmt(last.score)}점)로 ${fmt(Math.abs(trend))}점 하락. 약점 보완이 시급합니다.`);
  }

  // 목표 달성
  if (s.studentGoal && !isNaN(Number(s.studentGoal))) {
    const goal = Number(s.studentGoal);
    const achieved = validScores.filter(v => v.score >= goal).length;
    if (achieved > 0) {
      lines.push(`🎯 학생 목표 ${goal}점 달성: ${achieved}/${validScores.length}회 (${Math.round(achieved/validScores.length*100)}%)`);
    } else {
      lines.push(`🎯 학생 목표 ${goal}점 미달성. 남은 회차에서 약점 보완에 집중하면 충분히 가능합니다.`);
    }
  }

  // 약점 단원 (시험지 태그 기반)
  const unitWrong = {};
  for (let r = 1; r <= ROUNDS; r++) {
    const rd = getRoundData(sid, r);
    if (!rd || isAbsent(rd) || !rd.errors) continue;
    const paper = getPaperForStudent(s.grade, r, rd.version);
    if (!paper || !paper.problems) continue;
    parseErrors(rd.errors).forEach(n => {
      const p = paper.problems[n - 1];
      if (p && p.unit) {
        unitWrong[p.unit] = (unitWrong[p.unit] || 0) + 1;
      }
    });
  }
  const topWeakUnits = Object.entries(unitWrong).sort((a,b) => b[1] - a[1]).slice(0, 2);
  if (topWeakUnits.length > 0) {
    lines.push(`📚 주요 약점 단원: ${topWeakUnits.map(([u,c]) => `${u} (${c}회 오답)`).join(', ')} — 해당 단원 복습 권장`);
  }

  // 종합 코멘트
  if (myAvg != null) {
    if (myAvg >= 85) lines.push('💎 매우 우수한 수준입니다. 기말고사에서 좋은 결과를 기대할 수 있습니다.');
    else if (myAvg >= 70) lines.push('👍 양호한 수준입니다. 약점 보완으로 목표 달성이 가능합니다.');
    else if (myAvg >= 50) lines.push('📚 기초 보강이 필요합니다. 학원의 보충 학습 프로그램을 적극 활용해주세요.');
    else lines.push('🔍 개별 맞춤 학습이 시급합니다. 담당 선생님과 학습 계획을 재정비하세요.');
  }

  return lines;
}

// PDF 파일을 base64로 변환
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // data:application/pdf;base64,...
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function bytesFmt(b) {
  if (!b) return '0';
  if (b < 1024) return b + 'B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + 'KB';
  return (b/(1024*1024)).toFixed(1) + 'MB';
}
